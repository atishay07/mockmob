<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pip Round 5 exploration</title><style>.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}

body{margin:0;background:#0b100e;color:#f2f4ec;font:18px/1.6 system-ui}main{max-width:1000px;margin:auto;padding:40px 30px}section{min-height:85vh;padding:50px 0;position:relative;border-bottom:1px solid #253026}h1,h2{font-size:clamp(28px,4vw,54px);line-height:1.1;max-width:700px}p{max-width:55ch;color:#b2bdac}button,a{color:inherit}article{border:1px solid #526700;padding:24px;border-radius:20px;max-width:600px}img{object-fit:contain;width:130px;height:160px}#pip{position:fixed;right:24px;top:140px;pointer-events:none}body[data-v='1'] main{padding-right:180px}body[data-v='3'] #pip{position:absolute}body[data-v='2'] #pip{right:50px}.orb{display:inline-block;width:48px;height:48px;border-radius:50%;background:radial-gradient(at 30% 20%,#d2f000,#243224 65%);box-shadow:inset 0 2px 6px #dce5c7}.handover{display:flex;align-items:center;gap:20px}.glass{background:#243224cc;border:1px solid #526700;backdrop-filter:blur(12px);padding:20px;border-radius:18px}@media(max-width:600px){body[data-v='1'] main{padding-right:130px}#pip{right:8px;width:100px}h1,h2{font-size:28px}}
</style><main id="stage"></main><nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Gutter</button>
  <button class="proto-picker-item">Relay</button>
  <button class="proto-picker-item">Rail</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const poses=['greeting','thinking','pointing','idle','encouraging'];
const copy=['A mock tonight.','See where your marks went.','Check the source.','Try the exam screen.','See you in the Arena.'];
const variants=[0,1,2].map(v=>()=>{document.body.dataset.v=v+1;return copy.map((s,i)=>'<section><h2>'+s+'</h2><p>Original CUET practice. Your recorded answers lead to one useful next step. No invented gains or admission promises.</p>'+(i===1?'<article><b>Get one next move</b><p>Compare the answer changes in this illustrative replay.</p><button onclick="this.textContent=&quot;Next move selected&quot;">Show the next move</button></article>':'')+(i===3?'<div class="handover '+(v===0?'glass':'')+'">'+(v!==2?'<img src="/brand/mascot/pointing.webp" alt="Pip">':'')+'<span class="orb"></span><div><b>PrepOS</b><p>'+['Pip and PrepOS, together.','Over to PrepOS. Read your practice record.','Your next step, explained.'][v]+'</p><p>Paid replies stay subject to the existing pause.</p></div></div>':'')+'</section>').join('')+'<img id="pip" src="/brand/mascot/greeting.webp" alt="Pip">';});
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

let scheduled=false;function paint(){scheduled=false;const pip=document.getElementById('pip');if(!pip)return;const sections=[...document.querySelectorAll('section')],i=Math.min(4,Math.max(0,Math.round(scrollY/innerHeight)));pip.src='/brand/mascot/'+poses[i]+'.webp';if(current===0){pip.style.transform='translateY('+Math.sin(scrollY/innerHeight)*50+'px)';pip.style.opacity=1;}else if(current===1){pip.style.transform='translateY('+Math.max(-24,Math.min(24,sections[i].getBoundingClientRect().top*.1))+'px)';pip.style.opacity=Math.abs(sections[i].getBoundingClientRect().top)<innerHeight*.65?1:0;}else{pip.style.top=sections[i].offsetTop+80+'px';pip.style.opacity=1;}}addEventListener('scroll',()=>{if(!scheduled){scheduled=true;requestAnimationFrame(paint)}});setInterval(paint,250);
</script>
