<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Den, Mob mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- MockMob tokens (APP/lib/core/theme, MOB-FACTS section 4) ---------- */
.night{
  --ground:#12110E; --raised:#1B1A16; --raised2:#25231E; --sunken:#0D0C0A;
  --line:#312E27; --lineStrong:#4A453B; --ink:#F4F0E6; --ink2:#BDB6A6; --ink3:#A09989; --ink4:#6A645A;
  --volt:#D2F000; --voltInk:#0B1000; --voltEdge:#9DB400; --accentText:#D2F000;
  --good:#C6E86E; --bad:#FFA396; --warn:#EDB75A; --lamp:#F2A93B;
  --glass:rgba(27,26,22,.66); --edge:rgba(255,246,228,.14); --scrim:rgba(8,7,5,.62);
  --shadow:0 1px 1px rgba(0,0,0,.25),0 18px 36px -20px rgba(0,0,0,.35);
  --limb:#4A453E;
  /* den scene */
  --wall:#1C1A16; --wallLine:#23211C; --desk:#2A251F; --deskTop:#39322A; --deskEdge:#4A4136;
  --sky:#1A202C; --moon:#F4F0E6; --shelf:#3A332A; --shade:#EFE4CC; --poolA:rgba(242,169,59,.30); --poolB:rgba(242,169,59,0);
  --paper:#EDE5D3; --paperEdge:#BDB29C; --paperLine:#CFC5AF; --keyb:#1E1D19; --keycap:#34312B;
  --m-rose:#FF7A8A; --m-blue:#6E8BFF; --m-violet:#B98CFF; --m-teal:#3FC6A8; --m-amber:#F2A93B; --m-sky:#56B8F0; --m-coral:#E58E5A; --m-green:#9FBF4A;
}
.day{
  --ground:#F3EFE6; --raised:#FFFDF8; --raised2:#E9E4D8; --sunken:#EAE5DA;
  --line:#D8D1C2; --lineStrong:#BDB4A2; --ink:#17150F; --ink2:#454036; --ink3:#655F53; --ink4:#8A8375;
  --volt:#D2F000; --voltInk:#0B1000; --voltEdge:#9DB400; --accentText:#526700;
  --good:#3D6600; --bad:#B0291F; --warn:#845400; --lamp:#C77F12;
  --glass:rgba(255,253,248,.74); --edge:rgba(255,255,255,.85); --scrim:rgba(23,21,15,.38);
  --shadow:0 1px 2px rgba(42,32,16,.06),0 14px 30px -18px rgba(42,32,16,.15);
  --limb:#262421;
  --wall:#ECE4D4; --wallLine:#E3DAC8; --desk:#CDBB9C; --deskTop:#DDCFB5; --deskEdge:#BBA683;
  --sky:#CFE5F0; --moon:#F2C46B; --shelf:#C9B593; --shade:#FFFDF8; --poolA:rgba(242,196,107,.26); --poolB:rgba(242,196,107,0);
  --paper:#FFFDF8; --paperEdge:#CFC6B4; --paperLine:#E2DACB; --keyb:#E3DED3; --keycap:#FFFDF8;
  --m-rose:#B4243A; --m-blue:#3550C8; --m-violet:#6A3BC4; --m-teal:#0E7C66; --m-amber:#9A5B00; --m-sky:#0B6A9E; --m-coral:#A14A12; --m-green:#55741A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0E0D0B}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:#F4F0E6;-webkit-font-smoothing:antialiased}
.br{font-family:'Bricolage Grotesque',sans-serif}
.t-display{font:800 36px/38px 'Bricolage Grotesque';letter-spacing:-.025em;font-variation-settings:'opsz' 96}
.t-headline{font:750 28px/31px 'Bricolage Grotesque';letter-spacing:-.022em;font-variation-settings:'opsz' 72}
.t-title{font:700 22px/27px 'Bricolage Grotesque';letter-spacing:-.015em;font-variation-settings:'opsz' 48}
.t-fig{font-family:'Bricolage Grotesque';font-weight:750;font-stretch:75%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.t-sub{font:700 17px/22px 'Hanken Grotesk'}
.t-body{font:400 16px/24px 'Hanken Grotesk'}
.t-small{font:400 14px/20px 'Hanken Grotesk'}
.t-cap{font:400 13px/18px 'Hanken Grotesk'}
.t-label{font:600 13px/18px 'Hanken Grotesk'}
.num{font-variant-numeric:tabular-nums}

/* ---------- phone ---------- */
.phone{position:relative;width:360px;height:780px;overflow:hidden;background:var(--ground);color:var(--ink);border-radius:28px;flex:none}
.solo .phone{border-radius:0}
.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 24px;font:600 13px/1 'Hanken Grotesk';color:var(--ink);position:relative;z-index:5}
.status .ico{display:flex;gap:6px;align-items:center}
.scrollc{position:absolute;inset:32px 0 0 0;overflow:hidden}
.pad{padding:0 16px}
.hdr{display:flex;align-items:center;gap:12px;height:60px;padding:0 16px}
.hdr .grow{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink);background:transparent;border:0}
.iconbtn.ring{border:1px solid var(--line);background:var(--raised)}
.askmobi{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--raised);display:flex;align-items:center;gap:6px;padding:0 14px 0 8px;font:600 14px/1 'Hanken Grotesk';color:var(--ink)}
.key{height:56px;border-radius:999px;background:var(--volt);color:var(--voltInk);font:650 16px/20px 'Hanken Grotesk';font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 0 var(--voltEdge)}
.key2{height:48px;border-radius:999px;background:var(--raised);color:var(--ink);font:600 15px/20px 'Hanken Grotesk';display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--lineStrong);padding:0 18px}
.textbtn{height:44px;display:flex;align-items:center;justify-content:center;font:600 15px/20px 'Hanken Grotesk';color:var(--ink2);text-decoration:underline;text-decoration-color:var(--lineStrong);text-underline-offset:4px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.hair{height:1px;background:var(--line)}
.muted{color:var(--ink3)}
.ink2{color:var(--ink2)}
.acc{color:var(--accentText)}

/* bottom bar (H5: keep exactly) */
.bar{position:absolute;left:16px;right:16px;bottom:12px;height:64px;border-radius:32px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-around;z-index:20}
.night .bar{border-color:rgba(255,246,228,.10)}
.bar .slot{width:58px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12px/15px 'Hanken Grotesk';color:var(--ink2)}
.bar .slot.on{background:var(--raised2);color:var(--ink);font-weight:700}
.night .bar .slot.on svg{color:var(--volt)}
.bar .start{width:64px;height:64px;border-radius:50%;background:var(--volt);color:var(--voltInk);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 12px/14px 'Hanken Grotesk';margin-top:-4px;box-shadow:0 0 0 1px var(--voltEdge),0 10px 20px -10px rgba(0,0,0,.5)}
.fade-under{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to bottom,transparent,var(--ground) 70%);z-index:10;pointer-events:none}

/* avatar disc */
.disc{display:inline-grid;place-items:center;border-radius:50%;background:var(--raised2);overflow:hidden;flex:none;position:relative}
.disc svg{display:block}
.live-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid var(--ground);right:-1px;bottom:-1px}
.pulse{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--good);animation:pulse 1800ms cubic-bezier(.23,1,.32,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}

/* idle life (lobby at rest) */
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3600ms cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes breathe{from{transform:translateY(0) scale(1,1)}to{transform:translateY(-.8px) scale(1.012,1.028)}}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5200ms linear infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.12)}}
.sway{transform-box:view-box;transform-origin:164px 0px;animation:sway 6400ms cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.glowpulse{animation:glowp 3200ms cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes glowp{from{opacity:.86}to{opacity:1}}
.wave-arm{transform-box:view-box;animation:wave 1400ms cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes wave{from{transform:rotate(-6deg)}to{transform:rotate(10deg)}}
.steam{animation:steam 2600ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes steam{0%{transform:translateY(2px);opacity:0}40%{opacity:.7}100%{transform:translateY(-5px);opacity:0}}

/* results reveal (S4). tokens: emphasized 420 (.16,1,.3,1), settle 420, result 320, enter 360, stagger 45 */
.rv-stack{transform-box:fill-box;transform-origin:50% 100%;animation:rvStack 420ms cubic-bezier(.16,1,.3,1) both}
@keyframes rvStack{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
.rv-av{animation:rvAv 420ms cubic-bezier(.23,1,.32,1) both}
@keyframes rvAv{0%{transform:translateY(-34px);opacity:0}55%{transform:translateY(2px);opacity:1}100%{transform:translateY(0);opacity:1}}
.rv-name{animation:rvUp 260ms cubic-bezier(.23,1,.32,1) both}
@keyframes rvUp{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.rv-pop{transform-box:fill-box;transform-origin:50% 50%;animation:rvPop 420ms cubic-bezier(.16,1,.3,1) both}
@keyframes rvPop{0%{transform:scale(.6) rotate(-14deg);opacity:0}60%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.rv-in{animation:rvIn 360ms cubic-bezier(.16,1,.3,1) both}
@keyframes rvIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.rv-tray{animation:rvTray 360ms cubic-bezier(.32,.72,0,1) both}
@keyframes rvTray{from{transform:translateY(100%)}to{transform:none}}

/* reaction (S4) */
.react-fly{position:absolute;z-index:30;pointer-events:none}
/* picker (S5) */
.pk-out{animation:pkOut 200ms cubic-bezier(.4,.3,.8,.6) both}
@keyframes pkOut{to{transform:translateY(18px) scale(.95);opacity:0}}
.pk-in{animation:pkIn 360ms cubic-bezier(.16,1,.3,1) both}
@keyframes pkIn{from{transform:translateY(22px) scale(.95);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* gallery chrome */
.gal{max-width:1600px;margin:0 auto;padding:40px 32px 80px}
.gal h1{font:800 40px/44px 'Bricolage Grotesque';letter-spacing:-.025em;color:#F4F0E6}
.gal .lede{font:400 17px/26px 'Hanken Grotesk';color:#BDB6A6;max-width:760px;margin-top:10px}
.gal .note{font:500 13px/18px 'Hanken Grotesk';color:#A09989;margin-top:8px}
.row{margin-top:48px}
.row h2{font:700 22px/27px 'Bricolage Grotesque';color:#F4F0E6}
.row .r2{font:400 15px/22px 'Hanken Grotesk';color:#BDB6A6;margin-top:4px;max-width:820px}
.pair{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap;align-items:flex-start}
.pair .lab{font:600 12px/16px 'Hanken Grotesk';color:#A09989;margin-bottom:8px}
.gbtn{font:600 14px/1 'Hanken Grotesk';background:#25231E;color:#F4F0E6;border:1px solid #4A453B;border-radius:999px;height:36px;padding:0 16px;cursor:pointer;margin-top:12px;margin-right:8px}
.contact{display:grid;grid-template-columns:repeat(8,360px);gap:24px 20px;padding:28px;background:#0E0D0B}
.contact .cl{font:600 15px/20px 'Hanken Grotesk';color:#BDB6A6;margin-bottom:8px}
.sheet{padding:36px;width:1320px}
.sheet h1{font:800 34px/38px 'Bricolage Grotesque';letter-spacing:-.02em;color:var(--ink)}
.sheet .sl{font:400 16px/24px 'Hanken Grotesk';color:var(--ink2);margin-top:6px}
.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:24px}
.scard{background:var(--raised);border:1px solid var(--line);border-radius:20px;padding:12px 12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.scard .nm{font:700 18px/22px 'Bricolage Grotesque';color:var(--ink);margin-top:2px}
.scard .ln{font:400 13px/18px 'Hanken Grotesk';color:var(--ink2);margin-top:4px;min-height:36px}
.scard .lk{position:absolute;top:10px;right:10px;font:600 11px/14px 'Hanken Grotesk';color:var(--ink3);display:flex;gap:4px;align-items:center}
</style>
</head>

<div id="root"></div>
<script>
/* =====================================================================
   THE DEN — Mob direction mock-up. Illustrative fixture data only.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
let UID = 0; const uid = () => 'u' + (UID++);
const f1 = n => (+n).toFixed(1);
const pt = p => f1(p[0]) + ' ' + f1(p[1]);

/* rounded polygon: soft folded-paper corners */
function rp(pts, r){
  const n = pts.length; let d = '';
  for (let i = 0; i < n; i++){
    const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const la = Math.hypot(a[0]-p[0], a[1]-p[1]), lb = Math.hypot(b[0]-p[0], b[1]-p[1]);
    const rr = Math.min(r, la/2, lb/2);
    const s = [p[0] + (a[0]-p[0])/la*rr, p[1] + (a[1]-p[1])/la*rr];
    const e = [p[0] + (b[0]-p[0])/lb*rr, p[1] + (b[1]-p[1])/lb*rr];
    d += (i ? 'L' : 'M') + pt(s) + 'Q' + pt(p) + ' ' + pt(e);
  }
  return d + 'Z';
}
const poly = (pts, fill, op=1, extra='') => `<path d="M${pts.map(pt).join('L')}Z" fill="${fill}" opacity="${op}" ${extra}/>`;
const ln = (x1,y1,x2,y2,st,w=1.4,op=1,extra='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${st}" stroke-width="${w}" opacity="${op}" stroke-linecap="round" ${extra}/>`;
const rot = (p, c, deg) => { const a = deg*Math.PI/180, x = p[0]-c[0], y = p[1]-c[1]; return [c[0] + x*Math.cos(a) - y*Math.sin(a), c[1] + x*Math.sin(a) + y*Math.cos(a)]; };

/* paper palette: base, light, deep. Mid-tones read on both grounds, like Mobi (same paper, only the light changes). */
const PAL = {
  rose:['#FF8796','#FFB8C1','#D9586B'], blue:['#7F98FF','#B0C0FF','#5670DE'], violet:['#BC93FF','#DAC3FF','#9064DD'],
  teal:['#4CCBAE','#8DE4CF','#279B83'], amber:['#F4B04A','#FAD28C','#CC8820'], sky:['#5FBEF2','#A0DBF8','#2C93CC'],
  coral:['#EA9764','#F5C29F','#C36B37'], green:['#A7C650','#CDE18F','#7B9A2A'], lime:['#D2F000','#EFFF7A','#A2BB00']
};
const COLOURS = ['rose','blue','violet','teal','amber','sky','coral','green'];

/* ---------------- the family: 24 originals, each a different piece of exam stationery, folded ---------------- */
const CH = {};
function def(key, o){ CH[key] = Object.assign({key}, o); }

def('patang',{name:'Patang',line:'Rises fastest when the wind is against it.',colour:'rose',eyes:'open',
  visor:[60,52,46,24],top:[60,8],chest:[74,76],arms:[30,60,90,60],legs:[53,67,92],
  draw:(P,g)=>({main:rp([[60,8],[101,49],[60,104],[19,49]],8),
    over:poly([[60,0],[120,0],[120,130],[60,130]],P[2],.28)+ln(60,8,60,104,P[1],1.3,.7)+ln(19,49,101,49,P[1],1.3,.55),
    front:`<path d="M55 7 L60 12 L65 7 L60 4Z" fill="${P[1]}"/><path d="M53 3 L58 8 M67 3 L62 8" stroke="${P[2]}" stroke-width="2.2" stroke-linecap="round"/>`})});

def('dart',{name:'Dart',line:'Answers first, then checks every answer twice.',colour:'teal',eyes:'slant',
  visor:[60,60,40,21],top:[60,7],chest:[74,78],arms:[36,68,84,68],legs:[44,76,92],
  draw:(P)=>({main:rp([[60,6],[105,98],[60,80],[15,98]],6),
    over:poly([[60,0],[120,0],[120,130],[60,130]],P[2],.30)+ln(60,8,60,80,P[1],1.4,.8)})});

def('crane',{name:'Crane',line:'Folds it a hundred times until it is right.',colour:'violet',eyes:'lid',unlock:'Fix 3 Mob traps together',
  visor:[60,66,38,20],top:[63,12],chest:[70,86],arms:[36,74,84,74],legs:[53,67,92],
  draw:(P,g)=>({back:`<path d="${rp([[40,64],[6,20],[54,48]],5)}" fill="url(#${g})"/><path d="${rp([[80,64],[114,20],[66,48]],5)}" fill="url(#${g})"/>`+poly([[40,64],[6,20],[30,52]],P[2],.35)+poly([[80,64],[114,20],[90,52]],P[2],.35)
     ,
    main:rp([[60,30],[91,65],[60,101],[29,65]],7),
    over:poly([[60,20],[100,20],[100,110],[60,110]],P[2],.26)+ln(60,30,60,101,P[1],1.2,.6)})});

def('ticket',{name:'Ticket',line:'Always the first one into the exam hall.',colour:'amber',eyes:'smile',tilt:-6,
  visor:[52,59,44,23],top:[60,22],chest:[66,86],arms:[20,66,100,66],legs:[48,72,98],
  draw:(P)=>({main:'M26 22 H94 Q102 22 102 30 V50 A9 9 0 0 0 102 68 V90 Q102 98 94 98 H26 Q18 98 18 90 V68 A9 9 0 0 0 18 50 V30 Q18 22 26 22Z',
    over:poly([[84,0],[120,0],[120,130],[84,130]],P[2],.22)+ln(84,26,84,94,P[1],1.8,.9,'stroke-dasharray="3 4"')+`<circle cx="94" cy="40" r="2.2" fill="${P[2]}"/><circle cx="94" cy="80" r="2.2" fill="${P[2]}"/>`})});

def('dogear',{name:'Dog-ear',line:'Folds a corner on every question that tricked them.',colour:'sky',eyes:'open',
  visor:[60,48,46,24],top:[60,12],chest:[82,72],arms:[24,62,98,62],legs:[50,72,104],
  draw:(P)=>({main:rp([[22,12],[82,12],[100,30],[100,104],[22,104]],5),
    over:poly([[82,8],[82,30],[104,30]],P[1],1)+ln(82,30,100,30,P[2],1.2,.6)+[78,86,94].map((y,i)=>ln(34,y,[86,74,80][i],y,P[1],2.4,.55)).join(''),
    front:`<path d="M33 22 V6 a4 4 0 0 1 8 0 V20 a2.5 2.5 0 0 1 -5 0 V9" fill="none" stroke="#A39C8E" stroke-width="2" stroke-linecap="round"/>`})});

def('pip',{name:'Pip',line:'Keeps everyone’s notes, and everyone’s secrets.',colour:'coral',eyes:'smile',
  visor:[60,60,48,24],top:[60,8],chest:[86,84],arms:[16,68,104,68],legs:[48,72,98],
  draw:(P,g)=>({back:`<path d="${rp([[15,38],[60,7],[105,38]],6)}" fill="${P[2]}"/><rect x="27" y="20" width="66" height="30" rx="3" fill="#FFF8EA"/>`+ln(35,29,72,29,'#D9D0BD',2.2)+ln(35,36,62,36,'#D9D0BD',2.2),
    main:rp([[13,36],[107,36],[107,98],[13,98]],7),
    over:ln(13,98,60,68,P[1],1.4,.75)+ln(107,98,60,68,P[1],1.4,.75)+poly([[13,98],[60,68],[107,98]],P[2],.18)})});

def('naav',{name:'Naav',line:'Stays steady when the paper gets rough.',colour:'blue',eyes:'open',
  visor:[60,80,50,21],top:[60,7],chest:[88,90],arms:[18,78,102,78],legs:[48,72,100],
  draw:(P,g)=>({back:`<path d="${rp([[60,6],[95,64],[25,64]],6)}" fill="url(#${g})"/>`+poly([[60,8],[93,62],[60,62]],P[2],.30)+ln(60,8,60,62,P[1],1.3,.6),
    main:rp([[5,60],[115,60],[94,101],[26,101]],7),
    over:poly([[36,60],[60,73],[84,60]],P[2],.25)+ln(5,61,115,61,P[1],1.6,.7)})});

def('teller',{name:'Teller',line:'Guesses wisely, never wildly.',colour:'green',eyes:'curious',
  visor:[60,60,46,24],top:[60,14],chest:[88,90],arms:[16,70,104,70],legs:[48,72,106],
  draw:(P)=>({main:rp([[14,14],[106,14],[106,106],[14,106]],10),
    over:poly([[14,14],[60,14],[14,60]],P[2],.32)+poly([[106,106],[60,106],[106,60]],P[2],.32)+poly([[106,14],[106,60],[60,14]],P[1],.35)+poly([[14,106],[14,60],[60,106]],P[1],.35)
      +`<path d="M60 14 L106 60 L60 106 L14 60Z" fill="none" stroke="${P[1]}" stroke-width="1.4" opacity=".8"/>`+ln(14,14,106,106,P[2],1,.35)+ln(106,14,14,106,P[2],1,.35)})});

(function(){ /* Pankha: pleated paper fan */
  const C=[60,106], R=64, a0=28, a1=152, n=8; const pts=[C];

  let pleats=''; for(let i=0;i<n;i+=2){ pleats+=poly([C,pts[i+1],pts[i+2]],'DEEP',.28); }

/* eyes */
function eyesSVG(v, type){
  const [cx,cy,w,h]=v, dx=w*.205, ew=Math.max(4.6,w*.122), eh=h*.47, c='#FFFAEE', y=cy+1;
  const cap=(x,s=1)=>`<rect x="${f1(x-ew*s/2)}" y="${f1(y-eh*s/2)}" width="${f1(ew*s)}" height="${f1(eh*s)}" rx="${f1(ew*s/2)}" fill="${c}"/>`;
  let e='';
  if(type==='smile'){ e=[cx-dx,cx+dx].map(x=>`<path d="M${f1(x-ew*.75)} ${f1(y+eh*.18)} Q${f1(x)} ${f1(y-eh*.55)} ${f1(x+ew*.75)} ${f1(y+eh*.18)}" fill="none" stroke="${c}" stroke-width="${f1(ew*.62)}" stroke-linecap="round"/>`).join(''); }
  else if(type==='slant'){ e=cap(cx-dx)+cap(cx+dx)+`<path d="M${f1(cx-dx-ew)} ${f1(y-eh*.75)} L${f1(cx-dx+ew)} ${f1(y-eh*.75)} L${f1(cx-dx+ew)} ${f1(y-eh*.05)}Z M${f1(cx+dx+ew)} ${f1(y-eh*.75)} L${f1(cx+dx-ew)} ${f1(y-eh*.75)} L${f1(cx+dx-ew)} ${f1(y-eh*.05)}Z" fill="#161513"/>`; }
  else if(type==='lid'){ e=cap(cx-dx)+cap(cx+dx)+`<rect x="${f1(cx-dx-ew)}" y="${f1(y-eh*.75)}" width="${f1(dx*2+ew*2)}" height="${f1(eh*.62)}" fill="#161513"/>`+`<path d="M${f1(cx-dx-ew*.6)} ${f1(y-eh*.13)} H${f1(cx-dx+ew*.6)} M${f1(cx+dx-ew*.6)} ${f1(y-eh*.13)} H${f1(cx+dx+ew*.6)}" stroke="#D9D0BD" stroke-width="1.1" stroke-linecap="round"/>`; }
  else if(type==='curious'){ e=cap(cx-dx,.9)+cap(cx+dx,1.2); }
  else { e=cap(cx-dx)+cap(cx+dx); }
  return `<g class="eyes">${e}</g>`;
}

/* accessories (one per character) */
function accSVG(acc, c, P){
  const [vx,vy,vw,vh]=c.visor, [tx,ty]=c.top, [chx,chy]=c.chest, hw=vw/2;
  if(acc==='headphones') return `<rect x="${vx-hw-11}" y="${vy-9}" width="11" height="18" rx="5.5" fill="#2B2926"/><rect x="${vx+hw}" y="${vy-9}" width="11" height="18" rx="5.5" fill="#2B2926"/><rect x="${vx-hw-8.5}" y="${vy-5}" width="5" height="10" rx="2.5" fill="${P[1]}"/><rect x="${vx+hw+3.5}" y="${vy-5}" width="5" height="10" rx="2.5" fill="${P[1]}"/>`;
  if(acc==='cap') return `<g transform="translate(${tx} ${ty})"><path d="M-17 2 C -17 -16, 17 -16, 17 2 Z" fill="#2B2926"/><path d="M8 1 Q 22 -1 28 4 Q 18 6 6 4Z" fill="#2B2926"/><path d="M-12 -6 Q 0 -14 10 -8" stroke="#45413B" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="0" cy="-13" r="2.4" fill="${P[1]}"/></g>`;
  if(acc==='specs'){ const dx=vw*.205, r=vh*.42; return `<g fill="none" stroke="#F2C46B" stroke-width="1.8"><circle cx="${vx-dx}" cy="${vy+1}" r="${r}"/><circle cx="${vx+dx}" cy="${vy+1}" r="${r}"/><path d="M${vx-dx+r} ${vy} Q ${vx} ${vy-3} ${vx+dx-r} ${vy}"/></g>`; }
  if(acc==='scarf') return `<g transform="translate(${chx-14} ${chy-6})"><path d="${rp([[-22,0],[30,0],[30,11],[-22,11]],5)}" fill="#F4F0E6"/><path d="M-6 0 v11 M6 0 v11 M18 0 v11" stroke="#FF7A8A" stroke-width="4"/><path d="${rp([[20,8],[30,8],[32,26],[22,26]],3)}" fill="#F4F0E6"/><path d="M22 14 h9 M23 20 h9" stroke="#FF7A8A" stroke-width="3"/></g>`;
  if(acc==='pin') { let s=''; for(let i=0;i<10;i++){ const r=i%2?3.4:8, a=(-90+36*i)*Math.PI/180; s+=(i?'L':'M')+f1(chx+r*Math.cos(a))+' '+f1(chy+r*Math.sin(a)); } return `<path d="${s}Z" fill="#F2C46B" stroke="#2B2926" stroke-width="1.4" stroke-linejoin="round"/>`; }
  return '';
}

/* render one character. mode: full | disc | bust ; pose: rest | wave | cheer | none */
function avatarSVG(key, o={}){
  const c=CH[key], P=PAL[o.colour||c.colour], id=uid(), g='g'+id;
  const limb='var(--limb)';
  const mode=o.mode||'full', pose=o.pose||(mode==='full'?'rest':'none');
  const d=c.draw(P,g,id);
  const vb = mode==='disc' ? (c.crop||'2 -6 116 116') : mode==='bust' ? '0 -10 120 112' : '0 -12 120 140';
  let limbs='', front='';
  if(mode==='full' && pose!=='none'){
    const [lx,ly,rx,ry]=c.arms;
    const arm=(x,y,ex,ey,cls='')=>`<g ${cls}><path d="M${x} ${y} Q ${(x+ex)/2+(ex<x?-3:3)} ${(y+ey)/2-2} ${ex} ${ey}" stroke="${limb}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="6.6" fill="${limb}"/><circle cx="${ex-2}" cy="${ey-2}" r="2" fill="#fff" opacity=".10"/></g>`;
    const L = pose==='cheer' ? arm(lx+4,ly,lx-12,ly-20) : arm(lx+4,ly,lx-9,ly+15);
    const R = pose==='cheer' ? arm(rx-4,ry,rx+12,ry-20) : pose==='wave' ? arm(rx-4,ry,rx+13,ry-18,`class="wave-arm" style="transform-origin:${rx-4}px ${ry}px"`) : arm(rx-4,ry,rx+9,ry+15);
    limbs += L + R;
    const [x1,x2,yb]=c.legs;
    [x1,x2].forEach((x,i)=>{ const dir=i?1:-1;
      limbs = `<path d="M${x} ${yb-6} L${x+dir*1.5} ${118}" stroke="${limb}" stroke-width="7.2" stroke-linecap="round"/>`
        +`<path d="M${x-8+dir*2} ${124} Q ${x-8+dir*2} ${115} ${x+dir*2} ${115} Q ${x+9+dir*3} ${115} ${x+10+dir*3} ${121} Q ${x+10+dir*3} ${124} ${x+7+dir*2} ${124}Z" fill="${limb}"/>` + limbs; });
    limbs = `<ellipse cx="60" cy="125" rx="30" ry="3.6" fill="#000" opacity=".22"/>` + limbs;
  }
  const tilt = c.tilt ? `transform="rotate(${c.tilt} 60 60)"` : '';
  const masked = c.mask ? `mask="url(#m${id})"` : '';
  const band = o.acc==='headphones' ? `<path d="M${c.visor[0]-c.visor[2]/2-5} ${c.visor[1]} C ${c.visor[0]-c.visor[2]/2-4} ${c.top[1]-8}, ${c.visor[0]+c.visor[2]/2+4} ${c.top[1]-8}, ${c.visor[0]+c.visor[2]/2+5} ${c.visor[1]}" fill="none" stroke="#2B2926" stroke-width="4.2" stroke-linecap="round"/>` : '';
  const body = `<g ${tilt}>${band}${d.back||''}<g ${masked}><path d="${d.main}" fill="url(#${g})" stroke="url(#${g})" stroke-width="2.4" stroke-linejoin="round"/><g clip-path="url(#c${id})">${d.over||''}<path d="M10 -10 L70 -10 L10 60Z" fill="#fff" opacity=".07"/></g></g>${d.front||''}
    <g><rect x="${c.visor[0]-c.visor[2]/2}" y="${c.visor[1]-c.visor[3]/2}" width="${c.visor[2]}" height="${c.visor[3]}" rx="${c.visor[3]/2}" fill="url(#v${id})"/>
    <rect x="${c.visor[0]-c.visor[2]/2+.5}" y="${c.visor[1]-c.visor[3]/2+.5}" width="${c.visor[2]-1}" height="${c.visor[3]-1}" rx="${c.visor[3]/2}" fill="none" stroke="#000" stroke-opacity=".35"/>

    ${eyesSVG(c.visor, o.eyes||c.eyes)}</g>${accSVG(o.acc, c, P)}</g>`;
  const defs = `<defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P[1]}"/><stop offset=".48" stop-color="${P[0]}"/><stop offset="1" stop-color="${P[2]}"/></linearGradient>

  return `<svg ${o.x!=null?`x="${o.x}" y="${o.y}"`:''} width="${w}" height="${h}" viewBox="${vb}" class="${o.cls||''}" aria-label="${c.name}" role="img">${defs}${limbs}${inner}${front}</svg>`;
}

        <div style="min-width:0"><div style="font:700 15px/20px 'Hanken Grotesk';color:#F4F0E6">Aarav saved you a seat in Chai Circle</div><div style="font:500 13px/18px 'Hanken Grotesk';color:#BDB6A6;margin-top:2px">Accountancy on MockMob. Code <b class="num" style="color:#D2F000;letter-spacing:.06em">K7P 2M9</b></div></div>
      </div>
      <div class="t-cap muted" style="margin-top:6px">This is the card your friends see in WhatsApp.</div>
      <button class="key" style="margin-top:14px">${ico('share',20,2)}Invite on WhatsApp</button>
      <div style="display:flex;gap:10px;margin-top:10px">
        <div class="key2" style="flex:1">${ico('qr',18,2)}Show QR</div>
        <div class="key2" style="flex:1">${ico('copy',18,2)}Copy code</div>
      </div>
    </div>
  </div>
  <div class="fade-under" style="height:90px"></div>
  ${bottomBar('mob')}`;

/* S6c — join with a code, keyboard open, field and key stay above it */
function keyboard(){
  const rows=['1234567890','QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  const k=(c,w=30)=>`<div style="width:${w}px;height:40px;border-radius:6px;background:var(--keycap);display:grid;place-items:center;font:500 18px 'Hanken Grotesk';color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.25)">${c}</div>`;
  return `<div style="position:absolute;left:0;right:0;bottom:0;height:268px;background:var(--keyb);padding:10px 4px 0;display:flex;flex-direction:column;gap:9px;z-index:8">
    ${rows.map((r,i)=>`<div style="display:flex;justify-content:center;gap:5px">${i===3?k('⇧',44):''}${[...r].map(c=>k(c)).join('')}${i===3?k('⌫',44):''}</div>`).join('')}
    <div style="display:flex;justify-content:center;gap:5px">${k('?123',52)}${k(',',30)}${k('',150)}${k('.',30)}<div style="width:62px;height:40px;border-radius:20px;background:#D2F000;display:grid;place-items:center;color:#0B1000">${ico('check',20,2.4)}</div></div></div>`;
}
S.s6c = t => `${statusBar()}
  <div class="hdr" style="height:56px"><div class="iconbtn">${ico('back',24,2)}</div><div class="grow t-sub">Join a Mob</div><div class="t-label" style="display:flex;gap:6px;align-items:center;padding-right:4px">${ico('scan',20,2)}Scan QR</div></div>
  <div class="pad">
    <div class="t-body ink2">Type the 6-character code your friend sent.</div>
    <div style="display:flex;gap:8px;margin-top:12px" aria-label="Code, 6 characters">
      ${'K7P2M9'.split('').map((c,i)=>`<div style="flex:1;height:58px;border-radius:14px;display:grid;place-items:center;font:800 26px 'Bricolage Grotesque';font-stretch:75%;background:var(--raised);border:${i===5?'2px solid var(--ink)':'1px solid var(--lineStrong)'};${i===2?'margin-right:8px':''}">${c}</div>`).join('')}
    </div>
    <div style="margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--sunken);display:flex;gap:12px;align-items:center">
      <div style="display:flex">${['patang','naav','pip'].map((k,i)=>`<span style="margin-left:${i?-10:0}px">${disc(k,34,{colour:M[['riya','kabir','zoya'][i]].colour,acc:M[['riya','kabir','zoya'][i]].acc})}</span>`).join('')}</div>
      <div><div class="t-label">Chai Circle, Accountancy</div><div class="t-cap muted">Riya, Kabir and Zoya are in. 2 seats left.</div></div>
    </div>
    <button class="key" style="margin-top:14px">Join Chai Circle</button>
    <div class="t-cap muted" style="text-align:center;margin-top:12px">Sitting together? Tap Scan QR and point it at their screen.</div>
  </div>
  ${keyboard()}`;

/* ---------------- screen registry ---------------- */
const SCREENS = [
  ['s1','S1 Mob home, the den','What does a first-time student think this screen wants from them? "My friends are here; Riya sent me a sprint, so I tap Play."'],
  ['s2','S2 Play picker','"Pick a game. Kabir is here and plays live; the others get 24 hours. Start the race."'],
  ['s3','S3 In play, Riya’s sprint','"Answer this question. Riya and Kabir played earlier; Zoya is playing right now."'],
  ['s4','S4 Results','"I came first on time. Now we fix question 4 together, or rematch."'],
  ['s5','S5 Character picker','"Pick who I am in the Mob, give it a colour and one extra, then tap Use."'],
  ['s6a','S6a Start a Mob','"Keep or shuffle the name, pick the subject, start."'],
  ['s6b','S6b A Mob of one','"Nobody else is here yet. Send the WhatsApp invite."'],
  ['s6c','S6c Join with a code','"Type the code, check it is the right Mob, join."'],
];
function phone(id, theme){ return `<div class="phone ${theme}" data-s="${id}" data-theme="${theme}">${S[id](theme)}</div>`; }

/* ---------------- avatar sheet ---------------- */
function avatarSheet(theme){
  return `<div class="sheet ${theme}" style="background:var(--ground)"><h1>The paper folk</h1>
   <div class="sl">24 originals in Mobi’s family. Each is a piece of exam stationery, folded into a friend: a soft paper body, Mobi’s dark visor with capsule eyes, rubber-hose arms and boots. 20 are open to everyone; 4 come from Mob quests (cosmetic only, never sold).</div>
   <div class="sgrid">${ORDER.map(k=>{ const c=CH[k]; return `<div class="scard">${c.unlock?`<div class="lk">${ico('lock',12,2)}Mob quest</div>`:''}${avatarSVG(k,{mode:'full',pose:'rest',w:132,delay:-(ORDER.indexOf(k)*370)})}<div class="nm">${c.name}</div><div class="ln">${c.line}</div>
     <div style="display:flex;gap:4px;margin-top:8px">${COLOURS.map(cl=>`<span style="width:10px;height:10px;border-radius:50%;background:${PAL[cl][0]};${cl===c.colour?'box-shadow:0 0 0 1.5px var(--raised),0 0 0 3px var(--ink)':''}"></span>`).join('')}</div>
     ${c.unlock?`<div class="t-cap muted" style="margin-top:6px">${c.unlock}</div>`:''}</div>`; }).join('')}</div>
   <div style="display:flex;gap:18px;margin-top:22px;align-items:center;flex-wrap:wrap">
     <div class="t-label ink2" style="width:150px">Same character, eight papers and one extra each</div>
     ${COLOURS.map((cl,i)=>avatarSVG('cutting',{mode:'full',pose:'rest',w:92,colour:cl,acc:['','headphones','cap','specs','scarf','pin','',''][i],still:true})).join('')}
   </div></div>`;
}

/* ---------------- mount ---------------- */
function mount(){
  const root=document.getElementById('root');
  if(Q.get('solo')){ document.body.classList.add('solo'); root.innerHTML=phone(Q.get('solo'), Q.get('theme')||'night'); }
  else if(Q.get('sheet')){ root.innerHTML=avatarSheet(Q.get('theme')||'night'); }
  else if(Q.get('contact')){
    root.innerHTML=`<div class="contact">${['night','day'].map(th=>SCREENS.map(([id,l])=>`<div><div class="cl">${l}, ${th==='night'?'Night':'Day'}</div>${phone(id,th)}</div>`).join('')).join('')}</div>`;
  } else {
    root.innerHTML=`<div class="gal"><h1>The Den</h1>
      <div class="lede">The Mob gets a home: a lamp-lit den where every friend is a paper character at the same table. What you see there is only what really happened: who practised today, who is here now, what the Mob earned together.</div>
      <div class="note">Mock-up for the owner’s pick (R8). All names and numbers are illustrative fixtures. 360 x 780 dp, Night and Day. Tap a sticker on S4 to react; tap a character on S5 to choose it.</div>
      ${SCREENS.map(([id,l,r2])=>`<div class="row"><h2>${l}</h2><div class="r2">${r2}</div>
        ${id==='s4'?'<button class="gbtn" onclick="replay(\'s4\')">Replay the reveal</button>':''}${id==='s1'?'<button class="gbtn" onclick="replay(\'s1\')">Replay the lobby</button>':''}
        <div class="pair"><div><div class="lab">Night</div>${phone(id,'night')}</div><div><div class="lab">Day</div>${phone(id,'day')}</div></div></div>`).join('')}
      <div class="row"><h2>The paper folk, 24 characters</h2></div>${avatarSheet('night')}${avatarSheet('day')}
    </div>`;
  }
  wire();
}
function replay(id){ document.querySelectorAll(`.phone[data-s="${id}"]`).forEach(p=>p.getAnimations({subtree:true}).forEach(a=>{a.cancel();a.play();})); }

/* interactions: reaction sticker flies to Riya; picker swaps the character */
function react(ph, i, auto){
  const st = ph.querySelectorAll('.stk')[i]; const pod = ph.querySelector('svg[id^="podium"]'); if(!st||!pod) return;
  const pr=ph.getBoundingClientRect(), sr=st.getBoundingClientRect(), dr=pod.getBoundingClientRect();
  const el=document.createElement('div'); el.className='react-fly'; el.innerHTML=sticker(STICKERS[i],i,40);
  const sx=sr.left-pr.left+3, sy=sr.top-pr.top, tx=dr.left-pr.left+ (50+16) , ty=dr.top-pr.top+ 30;
  el.style.left=sx+'px'; el.style.top=sy+'px'; ph.appendChild(el);
  const dx=tx-sx, dy=ty-sy;
  el.animate([{transform:'translate(0,0) scale(1) rotate(0)'},{transform:`translate(${dx*.5}px,${dy*.62-40}px) scale(1.25) rotate(-10deg)`,offset:.55},{transform:`translate(${dx}px,${dy}px) scale(1.12) rotate(-8deg)`,offset:.86},{transform:`translate(${dx}px,${dy}px) scale(.92) rotate(-6deg)`}],
    {duration:620,easing:'cubic-bezier(.15,.5,.5,1)',fill:'forwards',delay:auto?0:0});
  return el;
}
function pick(ph, k){
  const t=ph.dataset.theme, stage=ph.querySelector(`#pk-stage-${t}`), nm=ph.querySelector(`#pk-name-${t}`), lnn=ph.querySelector(`#pk-line-${t}`);
  if(CH[k].unlock) return;
  ph.querySelectorAll('.pk-tile').forEach(x=>x.style.border = x.dataset.k===k ? '2px solid #D2F000' : '1px solid var(--line)');
  const old=stage.firstElementChild; old.classList.add('pk-out');
  setTimeout(()=>{ stage.innerHTML=avatarSVG(k,{mode:'full',pose:'wave',w:132,colour:k==='dart'?'teal':undefined,acc:'cap'}); stage.firstElementChild.classList.add('pk-in');
    nm.textContent=CH[k].name; lnn.textContent=CH[k].line; ph.querySelector('.key').textContent='Use '+CH[k].name; },200);
}
function wire(){
  document.querySelectorAll('.phone[data-s="s4"] .stk').forEach(s=>s.addEventListener('click',e=>{ const ph=s.closest('.phone'); react(ph,+s.dataset.i); }));
  document.querySelectorAll('.phone[data-s="s5"] .pk-tile').forEach(s=>s.addEventListener('click',()=>pick(s.closest('.phone'),s.dataset.k)));
}

/* frame tools for the capture script */
window.__scrub = (ms) => { document.getAnimations().forEach(a=>{ a.pause(); a.currentTime = ms; }); document.querySelectorAll('svg').forEach(s=>{ try{ s.pauseAnimations(); s.setCurrentTime(ms/1000);}catch(e){} }); };
window.__still = () => { document.getAnimations().forEach(a=>{ const it=a.effect.getComputedTiming().iterations; if(it===Infinity){ a.pause(); a.currentTime=0; } else a.finish(); }); document.querySelectorAll('svg').forEach(s=>{ try{s.pauseAnimations(); s.setCurrentTime(0);}catch(e){} }); };
window.__react = (i) => { const ph=document.querySelector('.phone[data-s="s4"]'); return !!react(ph,i,true); };
window.__pick = (k) => { const ph=document.querySelector('.phone[data-s="s5"]'); pick(ph,k); };
mount();
</script>
</body>
</html>
