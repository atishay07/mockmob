:root{
  --e-glide:cubic-bezier(.15,.5,.5,1); --e-out:cubic-bezier(.23,1,.32,1); --e-emph:cubic-bezier(.16,1,.3,1);
  --e-exit:cubic-bezier(.4,.3,.8,.6); --e-sweep:cubic-bezier(.45,0,.55,1); --e-settle:cubic-bezier(.34,1.18,.64,1);
  --e-pop:cubic-bezier(.34,1.36,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0A09;color:#F4F0E6;font-family:Hanken,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- theme tokens (from APP/lib/core/theme/mm_colors.dart) ---------- */
.ph[data-theme=night]{
  --ground:#12110E;--raised:#1B1A16;--raised2:#25231E;--sunken:#0D0C0A;--line:#312E27;--lineStrong:#4A453B;
  --ink:#F4F0E6;--ink2:#BDB6A6;--ink3:#A09989;--ink4:#6A645A;--volt:#D2F000;--voltInk:#0B1000;--voltEdge:#9DB400;
  --accentText:#D2F000;--good:#C6E86E;--bad:#FFA396;--warn:#EDB75A;--lamp:#F2A93B;
  --glass:rgba(27,26,22,.62);--edgeTop:rgba(255,246,228,.14);--scrim:rgba(8,7,5,.6);
  --shadow:0 1px 1px rgba(0,0,0,.25),0 18px 36px -20px rgba(0,0,0,.6);
  --hillA:#191813;--hillB:#201E19;--hillC:#27241F;--trail:#2E2B25;--trailEdge:#3E3A32;--stone:#2A2722;--stoneTop:#35322B;
  --moon:#F4F0E6;--sel:#D2F000;--limb:#3A3631;--limbHi:#6A6358;--kb:#1F1E1B;--kbKey:#3A3833;--kbInk:#F4F0E6;
  --m-blue:#6E8BFF;--m-teal:#3FC6A8;--m-amber:#F2A93B;--m-rose:#FF7A8A;--m-violet:#B98CFF;--m-sky:#56B8F0;--m-coral:#E58E5A;--m-green:#9FBF4A;
}
.ph[data-theme=day]{
  --ground:#F3EFE6;--raised:#FFFDF8;--raised2:#E9E4D8;--sunken:#EAE5DA;--line:#D8D1C2;--lineStrong:#BDB4A2;
  --ink:#17150F;--ink2:#454036;--ink3:#655F53;--ink4:#8A8375;--volt:#D2F000;--voltInk:#0B1000;--voltEdge:#9DB400;
  --accentText:#526700;--good:#3D6600;--bad:#B0291F;--warn:#845400;--lamp:#F2A93B;
  --glass:rgba(255,253,248,.72);--edgeTop:rgba(255,255,255,.8);--scrim:rgba(23,21,15,.4);
  --shadow:0 1px 2px rgba(42,32,16,.06),0 14px 30px -18px rgba(42,32,16,.2);
  --hillA:#ECE7DC;--hillB:#E4DED1;--hillC:#DAD3C4;--trail:#FFFDF8;--trailEdge:#CFC7B6;--stone:#E2DCCD;--stoneTop:#F7F3EA;
  --moon:#F2C46B;--sel:#526700;--limb:#262421;--limbHi:#45413B;--kb:#E4E1DA;--kbKey:#FFFFFF;--kbInk:#17150F;
  --m-blue:#3550C8;--m-teal:#0E7C66;--m-amber:#9A5B00;--m-rose:#B4243A;--m-violet:#6A3BC4;--m-sky:#0B6A9E;--m-coral:#A14A12;--m-green:#55741A;
}

/* ---------- type roles (mm_type.dart) ---------- */
.t-hero{font-family:BCond;font-size:52px;line-height:47px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.t-head{font-family:BHead;font-size:28px;line-height:31px;letter-spacing:-.02em}
.t-title{font-family:BTitle;font-size:22px;line-height:27px;letter-spacing:-.015em}
.t-sub{font-weight:700;font-size:17px;line-height:22px}
.t-btn{font-weight:600;font-size:16px;line-height:20px}
.t-label{font-weight:600;font-size:13px;line-height:18px}
.t-body{font-size:16px;line-height:24px}
.t-small{font-size:14px;line-height:20px}
.t-cap{font-size:13px;line-height:18px}
.num{font-variant-numeric:tabular-nums}
.ink2{color:var(--ink2)}.ink3{color:var(--ink3)}.acc{color:var(--accentText)}

/* ---------- gallery ---------- */
.gal{max-width:1640px;margin:0 auto;padding:40px 24px 80px}
.gal h1{font-family:BHead;font-size:40px;line-height:44px;letter-spacing:-.02em}
.gal .lede{color:#BDB6A6;font-size:16px;line-height:24px;max-width:760px;margin-top:10px}
.gal .note{display:inline-block;margin-top:14px;font-size:13px;color:#A09989;border:1px solid #312E27;border-radius:999px;padding:4px 12px}
.row{margin-top:56px}
.row h2{font-family:BTitle;font-size:22px}
.row .r2{color:#A09989;font-size:14px;margin-top:4px;max-width:900px}
.row .tools{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.row .tools button{border:1px solid #4A453B;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:#F4F0E6}
.row .tools button:hover{border-color:#D2F000}
.pair{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.bezel{padding:10px;border-radius:44px;background:#1E1C18;box-shadow:0 0 0 1px #2E2B25,0 30px 60px -30px rgba(0,0,0,.8)}
.bezel .ph{border-radius:34px}
.sheet24{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:18px}
.cell{background:#1B1A16;border:1px solid #312E27;border-radius:20px;padding:14px 12px 16px;text-align:center}
.cell .nm{font-family:BTitle;font-size:18px;margin-top:4px}
.cell .ob{font-size:12px;color:#A09989}
.cell .ln{font-size:13px;line-height:18px;color:#BDB6A6;margin-top:6px}
.cell .lk{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;color:#EDB75A;border:1px solid #4A453B;border-radius:999px;padding:2px 8px}

/* ---------- phone ---------- */
.ph{position:relative;width:360px;height:780px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:Hanken,sans-serif;isolation:isolate}
.sb{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 22px;font-size:13px;font-weight:600;color:var(--ink)}
.sb .ic{display:flex;gap:6px;align-items:center}
.pad{padding:0 16px}
.hdr{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px}
.hdr .me{width:40px;height:40px;border-radius:50%;background:var(--raised2);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.hdr .ttl{flex:1;min-width:0}
.askm{height:40px;border-radius:999px;border:1px solid var(--lineStrong);display:flex;align-items:center;gap:6px;padding:0 14px 0 8px;font-weight:600;font-size:14px;color:var(--ink);background:var(--raised)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--raised2)}
.key{height:56px;border-radius:18px;background:var(--volt);color:var(--voltInk);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;width:100%;box-shadow:inset 0 -2px 0 var(--voltEdge)}
.key2{height:56px;border-radius:18px;border:1.5px solid var(--lineStrong);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;width:100%;background:var(--raised)}
.txtbtn{font-weight:600;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--lineStrong)}
.hair{height:1px;background:var(--line)}

/* bottom bar (owner H5: keep as is) */
.bar{position:absolute;left:16px;right:16px;bottom:14px;height:64px;border-radius:999px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 var(--edgeTop),0 0 0 1px var(--line),var(--shadow);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;z-index:20}
.bar .it{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:15px;color:var(--ink2);height:52px;justify-content:center;border-radius:999px;margin:0 2px}
.bar .it.on{background:var(--raised2);color:var(--ink)}
.bar .it.on svg{color:var(--accentText)}
.bar .start{width:64px;height:64px;border-radius:50%;background:var(--volt);color:var(--voltInk);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;justify-self:center;transform:translateY(-6px);box-shadow:0 0 0 4px var(--ground),inset 0 -2px 0 var(--voltEdge)}
.fade-bottom{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to bottom,transparent,var(--ground) 60%);z-index:10;pointer-events:none}

/* ---------- avatars ---------- */
.av{display:block;overflow:visible}
.av .eyes{transform-box:fill-box;transform-origin:center}
.av .bodyw{transform-box:fill-box;transform-origin:50% 100%}

/* ---------- S1 lobby ---------- */
.scene{position:relative;width:328px;margin:0 16px;border-radius:24px;overflow:hidden;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.scene svg.land{position:absolute;inset:0}
.grp{position:absolute;display:flex;align-items:flex-end;z-index:3}
.mem{width:60px;display:flex;flex-direction:column;align-items:center;position:relative}
.mem .tag{margin-top:2px;display:flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 6px;border-radius:999px;background:var(--raised);box-shadow:0 0 0 1px var(--line);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.mem .tag.you{color:var(--voltInk);background:var(--volt);box-shadow:none}
.lant{width:9px;height:12px;flex:none}
.streak{position:absolute;left:12px;top:12px;z-index:4;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 var(--edgeTop),0 0 0 1px var(--line);font-size:13px;font-weight:600}
.flaglbl{position:absolute;z-index:4;font-family:BCond;font-size:22px;line-height:22px;color:var(--ink);text-align:right}
.flaglbl small{display:block;font-family:Hanken;font-size:11px;line-height:14px;font-weight:600;color:var(--ink3)}
.mile{position:absolute;z-index:2;font-size:11px;font-weight:700;color:var(--ink3);transform:translate(-50%,-50%);background:var(--sunken);padding:0 3px;border-radius:4px}
.quest{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.qbar{height:8px;border-radius:999px;background:var(--raised2);overflow:hidden;margin-top:10px;box-shadow:inset 0 0 0 1px var(--line)}
.qbar i{display:block;height:100%;background:var(--volt);border-radius:999px}
.peek{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.peek .pi{width:40px;height:40px;border-radius:12px;background:var(--raised2);display:grid;place-items:center;flex:none}

/* lobby motion */
.ph.play .ink{animation:ink 700ms var(--e-glide) 150ms both}
@keyframes ink{from{stroke-dashoffset:var(--P)}to{stroke-dashoffset:0}}
.ph.play .grp .mem{animation:hopIn 420ms var(--e-settle) both;animation-delay:calc(620ms + var(--i)*60ms)}
@keyframes hopIn{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:none}}
.ph.play .grp .mem .bodyw{animation:breath 3200ms var(--e-sweep) infinite alternate;animation-delay:calc(var(--i)*-800ms)}
@keyframes breath{from{transform:scaleY(1)}to{transform:scaleY(1.022) translateY(-.4px)}}
.ph.play .grp .mem .eyes{animation:blink var(--bl) linear infinite;animation-delay:calc(var(--i)*-1300ms)}
@keyframes blink{0%,93%{transform:scaleY(1)}95%{transform:scaleY(.12)}97.5%,100%{transform:scaleY(1)}}
.ph.play .pennant{animation:wave 2800ms var(--e-sweep) infinite alternate;transform-box:fill-box;transform-origin:0 50%}
@keyframes wave{from{transform:skewY(-4deg) scaleX(.96)}to{transform:skewY(3deg) scaleX(1)}}
.ph.play .lit .glow{animation:flick 2400ms var(--e-sweep) infinite alternate}
@keyframes flick{from{opacity:.55}to{opacity:1}}
.ph.play .here{animation:herePulse 1600ms var(--e-sweep) infinite alternate}
@keyframes herePulse{from{r:5;opacity:.5}to{r:9;opacity:0}}
.ph.play .qbar i{animation:qfill 700ms var(--e-glide) 150ms both}
@keyframes qfill{from{width:0}}

/* ---------- sheets ---------- */
.dim{position:absolute;inset:0;background:var(--scrim);z-index:30}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--raised);border-radius:32px 32px 0 0;box-shadow:inset 0 1px 0 var(--edgeTop),0 -10px 40px -10px rgba(0,0,0,.4)}
.handle{width:40px;height:4px;border-radius:2px;background:var(--lineStrong);margin:10px auto 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:44px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--raised2);color:var(--ink);box-shadow:0 0 0 1px var(--lineStrong)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.tile{border-radius:24px;background:var(--ground);box-shadow:inset 0 0 0 1px var(--line);padding:14px 14px 14px;position:relative}
.tile.sel{box-shadow:inset 0 0 0 2px var(--sel)}
.tile .tick{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--volt);display:grid;place-items:center}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.lrow .li{width:40px;height:40px;border-radius:12px;background:var(--raised2);display:grid;place-items:center;flex:none}
.mini{display:flex;gap:6px;align-items:center}
.mini i{width:22px;height:14px;border-radius:5px;background:var(--stone);box-shadow:inset 0 0 0 1px var(--trailEdge)}
.mini i.f{background:var(--volt);box-shadow:inset 0 -2px 0 var(--voltEdge)}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--ink2);background:var(--raised)}
.pill.on{border-color:var(--ink);color:var(--ink)}

/* ---------- S3 play ---------- */
.track{position:relative;height:96px;margin:0 16px;border-radius:20px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.track .road{position:absolute;left:22px;right:22px;top:66px;height:10px;border-radius:999px;background:var(--trail);box-shadow:inset 0 0 0 1px var(--trailEdge)}
.track .road i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--volt)}
.track .st{position:absolute;top:61px;width:20px;height:20px;margin-left:-10px;border-radius:7px;background:var(--stoneTop);box-shadow:inset 0 0 0 1px var(--trailEdge);font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--ink3)}
.track .st.done{background:var(--volt);color:var(--voltInk);box-shadow:inset 0 -2px 0 var(--voltEdge)}
.track .rider{position:absolute;bottom:34px;margin-left:-20px;width:40px;display:flex;flex-direction:column;align-items:center}
.track .rider.ghost{opacity:.55}
.track .rider .rl{font-size:10px;font-weight:700;line-height:12px;color:var(--ink2);white-space:nowrap;margin-bottom:1px}
.opt{display:flex;gap:12px;align-items:center;min-height:56px;padding:12px 14px;border-radius:18px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);font-size:16px;line-height:22px}
.opt b{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;background:var(--raised2);flex:none}
.opt.on{box-shadow:inset 0 0 0 2px var(--ink)}
.opt.on b{background:var(--ink);color:var(--ground)}
.ph.play .rider.live{animation:rideLive 1600ms var(--e-out) 300ms both}
@keyframes rideLive{from{transform:translateX(-58px)}to{transform:none}}
.ph.play .rider.ghost{animation:rideGhost 2200ms var(--e-out) 200ms both}
@keyframes rideGhost{from{transform:translateX(-58px)}to{transform:none}}

/* ---------- S4 results ---------- */
.pod{position:relative;height:300px;margin:0 16px}
.pod .col{position:absolute;bottom:72px;width:76px;display:flex;flex-direction:column;align-items:center}
.pod .stoneR{width:68px;border-radius:14px 14px 4px 4px;background:var(--stone);box-shadow:inset 0 0 0 1px var(--trailEdge);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;position:relative;transform-origin:50% 100%}
.pod .stoneR::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;border-radius:14px 14px 0 0;background:var(--stoneTop)}
.pod .stoneR.top{background:var(--volt);box-shadow:inset 0 -3px 0 var(--voltEdge)}
.pod .stoneR.top::before{background:#E2FA2E}
.pod .stoneR .sc{position:relative;font-family:BCond;font-size:32px;line-height:32px;color:var(--ink);font-variant-numeric:tabular-nums}
.pod .stoneR.top .sc{color:var(--voltInk)}
.pod .stoneR .of{position:relative;font-size:11px;font-weight:600;color:var(--ink3);line-height:13px}
.pod .stoneR.top .of{color:#2B3300}
.pod .ground{position:absolute;left:0;right:0;bottom:71px;height:2px;background:var(--line)}
.pod .nm{position:absolute;top:238px;width:76px;text-align:center}
.pod .nm b{display:block;font-size:13px;font-weight:700;line-height:16px}
.pod .nm span{display:block;font-size:11.5px;line-height:15px;color:var(--ink2);margin-top:2px}
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
.cnt{counter-reset:n var(--n)}
.cnt::after{content:counter(n)}
.stk{display:flex;gap:8px;overflow:hidden;padding:2px 16px}
.stkr{flex:none;height:40px;padding:0 12px 0 6px;border-radius:14px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.stkr svg{flex:none}
.rtag{position:absolute;z-index:6;display:flex;align-items:center;gap:4px;height:26px;padding:0 9px 0 5px;border-radius:10px;background:var(--raised);box-shadow:0 0 0 1px var(--lineStrong),var(--shadow);font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.fix{margin:0 16px;border-radius:24px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);padding:14px 14px 14px 12px;display:flex;gap:10px}
.ph.play .rv-t{animation:fadeUp 260ms var(--e-out) both}
.ph.play .rv-t2{animation:fadeUp 260ms var(--e-out) 120ms both}
.ph.play .rv-stone{animation:rise 420ms var(--e-emph) both;animation-delay:calc(300ms + var(--o)*120ms)}
@keyframes rise{from{transform:scaleY(.12);opacity:.0}30%{opacity:1}to{transform:none;opacity:1}}
.ph.play .rv-av{animation:hop 460ms var(--e-pop) both;animation-delay:calc(640ms + var(--o)*120ms)}
@keyframes hop{0%{opacity:0;transform:translateY(-30px) scale(.95)}60%{opacity:1}100%{opacity:1;transform:none}}
.ph.play .rv-sc{animation:count 520ms var(--e-out) both;animation-delay:calc(1060ms + var(--o)*60ms)}
@keyframes count{from{--n:0}to{--n:var(--to)}}
.ph.play .rv-win .eyes-open{animation:eyeSwapA 900ms steps(1) 1500ms both}
.ph.play .rv-win .eyes-happy{animation:eyeSwapB 900ms steps(1) 1500ms both}
@keyframes eyeSwapA{from{opacity:0}to{opacity:0}}
@keyframes eyeSwapB{from{opacity:1}to{opacity:1}}
.rv-win .eyes-happy{opacity:0}
.ph.play .rv-winhop{animation:winHop 420ms var(--e-pop) 1500ms both}
@keyframes winHop{0%{transform:none}40%{transform:translateY(-10px) scale(1.04)}100%{transform:none}}
.ph.play .fleck{animation:fleck 760ms var(--e-out) 1500ms both}
@keyframes fleck{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.fleck{opacity:0}
.ph.play .rv-hl{animation:fadeUp 240ms var(--e-out) both;animation-delay:calc(1640ms + var(--o)*45ms)}
.ph.play .rv-fix{animation:riseIn 360ms var(--e-emph) 1950ms both}
.ph.play .rv-rx{animation:fadeUp 200ms var(--e-out) 2200ms both}
.ph.play .rv-keys{animation:fadeUp 240ms var(--e-out) 2250ms both}
.ph.play .rv-tag{animation:tagPop 420ms var(--e-pop) 2900ms both}
@keyframes tagPop{0%{opacity:0;transform:translateY(8px) scale(.9)}100%{opacity:1;transform:none}}
.ph.play .rv-fly{animation:fly 420ms var(--e-emph) 2500ms both}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.9)}15%{opacity:1}70%{opacity:1;transform:translate(calc(var(--fx)*.55),calc(var(--fy)*.55 - 40px)) scale(1.06)}100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.7)}}
.rv-fly{opacity:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ---------- S5 avatar picker ---------- */
.stage{height:168px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.stage .plinth{width:150px;height:22px;border-radius:50%;background:var(--stone);box-shadow:inset 0 2px 0 var(--stoneTop);margin-top:-12px}
.swatch{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch.on{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.accb{width:48px;height:48px;border-radius:14px;background:var(--ground);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex:none}
.accb.on{box-shadow:inset 0 0 0 2px var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gt{height:86px;border-radius:18px;background:var(--ground);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;position:relative;cursor:pointer}
.gt .gn{font-size:11px;font-weight:600;color:var(--ink2);margin-top:1px}
.gt.on{box-shadow:inset 0 0 0 2px var(--sel)}
.gt.lock .gn{color:var(--ink4)}
.gt .lockb{position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:6px;background:var(--raised2);display:grid;place-items:center}
.avIn{animation:avIn 380ms var(--e-pop) both}
@keyframes avIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:none}}
.avOut{animation:avOut 180ms var(--e-exit) both}
@keyframes avOut{to{opacity:0;transform:translateY(6px) scale(.96)}}

/* ---------- S6 ---------- */
.share{border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px var(--line),var(--shadow);background:#12110E;color:#F4F0E6}
.codebox{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.codebox i{height:56px;border-radius:14px;background:var(--ground);box-shadow:inset 0 0 0 1px var(--lineStrong);display:grid;place-items:center;font-style:normal;font-family:BCond;font-size:30px;color:var(--ink)}
.codebox i.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.kb{position:absolute;left:0;right:0;bottom:0;height:262px;background:var(--kb);z-index:40;padding:8px 4px 20px}
.kb .kr{display:flex;gap:5px;justify-content:center;margin-bottom:8px}
.kb .kk{height:44px;flex:1;max-width:32px;border-radius:7px;background:var(--kbKey);display:grid;place-items:center;font-size:18px;color:var(--kbInk)}
.kb .kk.w{max-width:52px;font-size:13px}
.kb .kk.sp{max-width:none;flex:5}
.found{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--ground);box-shadow:inset 0 0 0 1px var(--line)}
.stack{display:flex}
.stack>*{margin-left:-10px;border-radius:50%;background:var(--raised2);box-shadow:0 0 0 2px var(--raised)}
.stack>*:first-child{margin-left:0}
.namechip{height:40px;padding:0 14px;border-radius:14px;background:var(--ground);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.namechip.on{box-shadow:inset 0 0 0 2px var(--ink);background:var(--raised2)}
.seat{width:46px;height:52px;border-radius:14px;border:1.5px dashed var(--lineStrong);display:grid;place-items:center;color:var(--ink3)}

/* reduced motion: paint end states */
@media (prefers-reduced-motion:reduce){.ph.play *{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}}
/* solo mode */
body.solo{background:transparent}
body.solo .ph{border-radius:0}
.strip{display:flex;gap:12px;padding:16px;background:#0B0A09;flex-wrap:nowrap}
.strip .fr{display:flex;flex-direction:column;gap:6px;align-items:center}
.strip .fr span{font-size:13px;color:#A09989;font-weight:600}
.contact{display:grid;grid-template-columns:repeat(8,360px);gap:24px 20px;padding:28px;background:#0B0A09}
.contact .cl{font-size:15px;font-weight:700;color:#F4F0E6;margin-bottom:8px}
.contact .ph{border-radius:24px}
</style>

// procedural bodies
function starPts(cx,cy,R,r){const P=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?r:R;P.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)])}return P}
function bodyFor(f){
  if(f.star){const P=starPts(50,54,42,19),out=[];for(let i=0;i<10;i+=2){const tip=P[i],L=P[(i+9)%10],Rr=P[(i+1)%10];const left=tip[0]<=50;out.push([left?'l':'a',`50,54 ${L.join(',')} ${tip.join(',')}`]);out.push([left?'a':'s',`50,54 ${tip.join(',')} ${Rr.join(',')}`])}return out}
  if(f.fan){const out=[];const c=[50,86],R=48;const n=8;for(let i=0;i<n;i++){const a1=(200+i*(140/n))*Math.PI/180,a2=(200+(i+1)*(140/n))*Math.PI/180;const p1=[c[0]+R*Math.cos(a1),c[1]+R*Math.sin(a1)],p2=[c[0]+R*Math.cos(a2),c[1]+R*Math.sin(a2)];out.push([i<n/2?(i%2?'a':'l'):(i%2?'s':'a'),`${c.join(',')} ${p1.map(v=>v.toFixed(1)).join(',')} ${p2.map(v=>v.toFixed(1)).join(',')}`])}out.push(['k','46,80 54,80 53,96 47,96']);return out}
  if(f.pin){const out=[];const c=[50,46],R=40;const tn=['l','a','s','a'];for(let k=0;k<4;k++){const a=(-90+k*90)*Math.PI/180,b=(-90+k*90+90)*Math.PI/180;const tip=[c[0]+R*Math.cos(a),c[1]+R*Math.sin(a)];const side=[c[0]+R*.62*Math.cos(b-0.35),c[1]+R*.62*Math.sin(b-0.35)];const mid=[c[0]+R*.7*Math.cos(a+0.5),c[1]+R*.7*Math.sin(a+0.5)];out.push([tn[k],`${c.join(',')} ${tip.map(v=>v.toFixed(1)).join(',')} ${mid.map(v=>v.toFixed(1)).join(',')}`]);out.push([tn[(k+1)%4]==='l'?'a':'s',`${c.join(',')} ${mid.map(v=>v.toFixed(1)).join(',')} ${side.map(v=>v.toFixed(1)).join(',')}`])}return out}
  return f.b;
}
function bbox(b){let x0=1e9,x1=-1e9,y1=-1e9,y0=1e9;b.filter(([,p])=>p.trim()[0]!=='M').forEach(([,p])=>p.trim().split(/\s+/).forEach(q=>{const[x,y]=q.split(',').map(Number);x0=Math.min(x0,x);x1=Math.max(x1,x);y1=Math.max(y1,y);y0=Math.min(y0,y)}));return{x0,x1,y1,y0}}

function eyesSvg(v,mood,round,col){const[cx,cy,w,h]=v;const dx=w*.21,eh=h*.56,ew=Math.max(3.4,h*.3);const ink=col||'#FFFAEE';const one=(x,m)=>{
  if(round)return m==='happy'?`<path d="M${x-4} ${cy+1.5} Q${x} ${cy-4} ${x+4} ${cy+1.5}" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`:`<circle cx="${x}" cy="${cy+.5}" r="${h*.26}" fill="${ink}"/><circle cx="${x+1}" cy="${cy-.6}" r="${h*.08}" fill="#151413"/>`;
  if(m==='happy')return `<path d="M${x-ew*.8} ${cy+2} Q${x} ${cy-eh*.55} ${x+ew*.8} ${cy+2}" fill="none" stroke="${ink}" stroke-width="2.3" stroke-linecap="round"/>`;
  if(m==='focus')return `<rect x="${x-ew/2}" y="${cy-eh*.18}" width="${ew}" height="${eh*.62}" rx="${ew/2}" fill="${ink}"/>`;
  if(m==='wow')return `<circle cx="${x}" cy="${cy}" r="${ew*.72}" fill="${ink}"/>`;
  if(m==='sleepy')return `<path d="M${x-ew*.8} ${cy+1} H${x+ew*.8}" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`;
  return `<rect x="${x-ew/2}" y="${cy-eh/2}" width="${ew}" height="${eh}" rx="${ew/2}" fill="${ink}"/>`};
  return mood==='wink'?one(cx-dx,'happy')+one(cx+dx,'open'):one(cx-dx,mood)+one(cx+dx,mood)}

function accSvg(acc,v,top){const[cx,cy,w,h]=v;
  if(acc==='phones'){const L=cx-w/2-2.5,R=cx+w/2+2.5,T=Math.min(top-5,cy-h/2-14);return `<path d="M${L} ${cy} C${L} ${T}, ${R} ${T}, ${R} ${cy}" fill="none" stroke="#262421" stroke-width="3.2" stroke-linecap="round"/><rect x="${L-4}" y="${cy-7}" width="8" height="14" rx="3.5" fill="#262421"/><rect x="${R-4}" y="${cy-7}" width="8" height="14" rx="3.5" fill="#262421"/><circle cx="${L}" cy="${cy}" r="1.6" fill="#D2F000"/><circle cx="${R}" cy="${cy}" r="1.6" fill="#D2F000"/>`}
  if(acc==='scarf'){const y=cy+h/2+5;return `<rect x="${cx-w/2-5}" y="${y}" width="${w+10}" height="7" rx="3.5" fill="#F2A93B"/><path d="M${cx+w/2-6} ${y+5} l3 13 h6 l-2 -13z" fill="#D98E22"/><path d="M${cx-w/2} ${y+3.5} H${cx+w/2}" stroke="#FFFAEE" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>`}
  if(acc==='pencil'){const x=cx+w/2-2,y=cy-h/2-4;return `<g transform="translate(${x} ${y}) rotate(-38)"><rect x="-3" y="-20" width="6" height="22" rx="1" fill="#F2C46B"/><rect x="-3" y="-24" width="6" height="5" rx="1.5" fill="#FF7A8A"/><path d="M-3 2 L0 8 L3 2Z" fill="#E9D3B0"/><path d="M-1 6 L0 8 L1 6Z" fill="#262421"/></g>`}
  if(acc==='pin'){const x=cx-w/2+4,y=cy+h/2+9;const P=starPts(x,y,5.2,2.3).map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');return `<polygon points="${P}" fill="#F2C46B" stroke="#262421" stroke-width="1" stroke-linejoin="round"/>`}
  if(acc==='specs'){const dx=w*.21,r=h*.42;return `<circle cx="${cx-dx}" cy="${cy}" r="${r}" fill="none" stroke="#FFFAEE" stroke-width="1.2" opacity=".85"/><circle cx="${cx+dx}" cy="${cy}" r="${r}" fill="none" stroke="#FFFAEE" stroke-width="1.2" opacity=".85"/><path d="M${cx-dx+r} ${cy} H${cx+dx-r}" stroke="#FFFAEE" stroke-width="1.2" opacity=".85"/>`}
  return ''}

function av(id,o={}){
  const f=famById[id];const c=MC[o.c||'blue'];const t=tones(c);const size=o.size||64;const mood=o.mood||'open';
  const locked=!!o.locked;const L=locked?{a:'var(--raised2)',l:'var(--raised2)',s:'var(--stone)',d:'var(--stone)',k:'var(--stone)',w:'var(--raised2)',r:'var(--stone)',y:'var(--stone)'}:t;

  if(feet){const hy=hip[0],sp=hip[1];const col=locked?'var(--stone)':'var(--limb,#262421)';
    s+=`<g><path d="M${cx-sp} ${hy} L${cx-sp-2} 96 M${cx+sp} ${hy} L${cx+sp+2} 96" stroke="${col}" stroke-width="4.6" stroke-linecap="round"/><rect x="${cx-sp-11}" y="93" width="15" height="8" rx="4" fill="${col}"/><rect x="${cx+sp-4}" y="93" width="15" height="8" rx="4" fill="${col}"/>${locked?'':`<path d="M${cx-sp-8} 94.6 h7 M${cx+sp-1} 94.6 h7" stroke="var(--limbHi,#45413B)" stroke-width="1.2" stroke-linecap="round"/>`}</g>`}

  if(f.front&&!locked)s+=f.front(t);

    s+=`<rect x="${vx-w/2}" y="${vy-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="url(#visor)"/><path d="M${vx-w/2+h*.45} ${vy-h/2+2.2} H${vx+w/2-h*.45}" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="2" stroke-linecap="round"/>`;

function scene(o){

   <polygon points="190,${H*0.7} 270,${H*0.58} 300,${H*0.75}" fill="var(--hillC)" opacity=".8"/>
   <polygon points="0,${H*0.86} 120,${H*0.78} 240,${H*0.88} 328,${H*0.8} 328,${H} 0,${H}" fill="var(--hillC)"/>
   <polygon points="70,${H*0.42} 150,${H*0.52} 96,${H*0.5}" fill="var(--hillB)"/>`;
  const sky=o.day?`<circle cx="62" cy="58" r="14" fill="#F2C46B" opacity=".55"/>`:`<path d="M66 44 a15 15 0 1 0 12 24 a12 12 0 1 1 -12 -24z" fill="var(--moon)" opacity=".22"/>`;
  return `<div class="scene" style="height:${H}px" data-prog="${o.prog}" data-anchor="${o.anchor||''}">
   <svg class="land" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${sky}${hills}
    <path class="trail-edge" d="${o.d}" fill="none" stroke="var(--trailEdge)" stroke-width="24" stroke-linecap="round"/>
    <path class="trail-base" d="${o.d}" fill="none" stroke="var(--trail)" stroke-width="19" stroke-linecap="round"/>
    <path class="trail-dash" d="${o.d}" fill="none" stroke="var(--trailEdge)" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round" opacity=".9"/>
    <path class="ink" d="${o.d}" fill="none" stroke="var(--volt)" stroke-width="8" stroke-linecap="round"/>
    <g class="milestones"></g>
    <g class="flagg"></g>
   </svg>
   ${o.streak?`<div class="streak">${I.flag}<span>${o.streak}</span></div>`:''}
   <div class="flaglbl"></div>
   <div class="grp">${o.group}</div>
  </div>`}
function memberHTML(m,i,size=50){return `<div class="mem" style="--i:${i};--bl:${m.bl||'5s'}">${av(m.id,{c:m.c,acc:m.acc,size})}<div class="tag ${m.you?'you':''}">${lantern(m.lit)}<span>${m.n}</span></div></div>`}
function layoutScenes(root){
  root.querySelectorAll('.scene').forEach(sc=>{
    const p=sc.querySelector('.trail-base'),L=p.getTotalLength(),prog=+sc.dataset.prog;const P=Math.max(.001,L*prog);
    const ink=sc.querySelector('.ink');ink.style.strokeDasharray=`${P} ${L+20}`;ink.style.setProperty('--P',P);if(prog===0)ink.style.display='none';
    const ms=sc.querySelector('.milestones');let mh='';[[.25,'30'],[.5,'60'],[.75,'90']].forEach(([f,l])=>{const q=p.getPointAtLength(L*f);const done=f<=prog;mh+=`<g transform="translate(${q.x} ${q.y})"><rect x="-9" y="-7" width="18" height="14" rx="5" fill="${done?'#D2F000':'var(--stoneTop)'}" stroke="${done?'#9DB400':'var(--trailEdge)'}" stroke-width="1.2"/><text x="0" y="3.6" text-anchor="middle" font-size="9" font-weight="700" font-family="Hanken" fill="${done?'#0B1000':'var(--ink3)'}">${l}</text></g>`});ms.innerHTML=mh;
    const e=p.getPointAtLength(L);sc.querySelector('.flagg').innerHTML=`<g transform="translate(${e.x} ${e.y})"><path d="M0 0 V-34" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/><path class="pennant" d="M1 -34 h24 l-6 7 6 7 h-24z" fill="#D2F000" stroke="#9DB400" stroke-width="1"/><ellipse cx="0" cy="1" rx="8" ry="3" fill="var(--trailEdge)"/></g>`;
    const fl=sc.querySelector('.flaglbl');fl.innerHTML=sc.dataset.flag||'';fl.style.right=(328-e.x+12)+'px';fl.style.top=(e.y-34)+'px';
    const g=sc.querySelector('.grp');const at=sc.dataset.anchor?JSON.parse(sc.dataset.anchor):null;const q=at?{x:at[0],y:at[1]}:p.getPointAtLength(P);
    const w=g.offsetWidth,h=g.offsetHeight;let left=Math.min(Math.max(q.x-w/2,6),328-w-6);g.style.left=left+'px';g.style.top=(q.y-h+27)+'px';
  })}

  <div class="fix rv-fix" style="margin-top:14px"><div style="flex:none;margin-top:2px">${mobi(40,'open')}</div><div style="flex:1"><div class="t-label">The question your Mob missed most</div><div class="t-small ink2" style="margin-top:3px">On question 4, three of you picked B. Fix it together now, and each of you gets one fresh question on it on Wednesday.</div></div></div>
  <div class="rv-keys" style="position:absolute;left:16px;right:16px;bottom:24px;display:flex;gap:10px"><button class="key2" style="width:128px">${I.rematch}&nbsp;Rematch</button><button class="key" style="flex:1">Fix it together</button></div>`}

const ACC=[['none','None'],['phones','Headphones'],['scarf','Scarf'],['pencil','Pencil'],['pin','Star pin'],['specs','Glasses']];
function S5(th,sel='fennec',col='amber',acc='scarf'){
  const f=famById[sel];
  const tiles=FAM.slice(0,12).map(x=>`<div class="gt ${x.id===sel?'on':''} ${x.lock?'lock':''}" data-pick="${x.id}">${x.lock?`<span class="lockb">${I.lock}</span>`:''}${av(x.id,{c:x.id===sel?col:MCK[FAM.indexOf(x)%8],size:52,locked:!!x.lock,feet:false})}<span class="gn">${x.name}</span></div>`).join('');
  return `${statusBar()}<div style="opacity:.5">${S1full(th).replace(statusBar(),'')}</div><div class="dim"></div>
  <div class="sheet" style="top:40px">
   <div class="handle"></div>
   <div class="pad" style="display:flex;justify-content:space-between;align-items:baseline"><div class="t-head" style="font-size:26px">Your character</div><span class="t-cap ink3">Only your Mob sees it</span></div>
   <div class="stage"><div class="stageAv">${av(sel,{c:col,acc,size:120,mood:'happy'})}</div><div class="plinth"></div></div>
   <div style="text-align:center;margin-top:8px"><div class="t-title stageName">${f.name} <span class="t-small ink3">the ${f.obj}</span></div><div class="t-small ink2 stageLine" style="margin-top:2px">${f.line}</div></div>
   <div class="pad" style="margin-top:14px"><div style="display:flex;gap:9px;justify-content:space-between">${MCK.map(k=>`<span class="swatch ${k===col?'on':''}" data-col="${k}" style="background:${MC[k]}"></span>`).join('')}</div></div>
   <div class="pad" style="margin-top:12px;display:flex;gap:8px;justify-content:space-between">${ACC.map(([k,l])=>`<span class="accb ${k===acc?'on':''}" data-acc="${k}" title="${l}">${k==='none'?`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink3)" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M6.5 17.5l11-11"/></svg>`:`<svg viewBox="0 0 40 40" width="34" height="34">${accPreview(k)}</svg>`}</span>`).join('')}</div>
   <div class="pad" style="margin-top:16px;display:flex;justify-content:space-between"><span class="t-label">All 24 characters</span><span class="t-cap ink3">8 unlock with Mob quests</span></div>
   <div class="pad grid" style="margin-top:8px">${tiles}</div>
   <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 16px 22px;background:var(--raised);box-shadow:0 -1px 0 var(--line)"><button class="key useKey">Use ${f.name}</button></div>
  </div>`}
function accPreview(k){
  if(k==='phones')return `<path d="M9 24 C9 6 31 6 31 24" fill="none" stroke="var(--ink2)" stroke-width="3" stroke-linecap="round"/><rect x="5" y="20" width="8" height="12" rx="3.5" fill="var(--ink2)"/><rect x="27" y="20" width="8" height="12" rx="3.5" fill="var(--ink2)"/>`;
  if(k==='scarf')return `<rect x="6" y="15" width="28" height="8" rx="4" fill="#F2A93B"/><path d="M24 21 l3 13 h6 l-2 -13z" fill="#D98E22"/>`;
  if(k==='pencil')return `<g transform="translate(20 21) rotate(-40)"><rect x="-3.5" y="-14" width="7" height="22" rx="1" fill="#F2C46B"/><rect x="-3.5" y="-18" width="7" height="5" rx="1.5" fill="#FF7A8A"/><path d="M-3.5 8 L0 15 L3.5 8Z" fill="#E9D3B0"/><path d="M-1.2 12.5 L0 15 L1.2 12.5Z" fill="#262421"/></g>`;
  if(k==='pin'){const P=starPts(20,21,12,5.2).map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');return `<polygon points="${P}" fill="#F2C46B" stroke="#262421" stroke-width="1.2" stroke-linejoin="round"/>`}
  if(k==='specs')return `<circle cx="12" cy="20" r="6.5" fill="none" stroke="var(--ink2)" stroke-width="2"/><circle cx="28" cy="20" r="6.5" fill="none" stroke="var(--ink2)" stroke-width="2"/><path d="M18.5 20 H21.5" stroke="var(--ink2)" stroke-width="2"/>`;
  return ''}

function S6a(th){
  const names=['Quiet Comets','Steady Kites','Bright Lanterns','Swift Cranes','Midnight Mangoes','Brave Pencils'];
  return `${statusBar()}
  <div class="hdr" style="height:48px"><button style="width:40px;height:40px;display:grid;place-items:center;margin-left:-8px" aria-label="Back">${I.back}</button><div class="t-sub" style="flex:1">Start a Mob</div></div>
  <div class="pad">
   <div style="position:relative;height:88px;border-radius:20px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-bottom:12px">
     <svg width="328" height="88" viewBox="0 4 328 88" style="position:absolute;inset:0"><polygon points="0,70 80,52 170,66 250,48 328,60 328,96 0,96" fill="var(--hillB)"/><path d="M60 84 C120 92 170 70 210 60 S260 40 286 30" fill="none" stroke="var(--trailEdge)" stroke-width="14" stroke-linecap="round"/><path d="M60 84 C120 92 170 70 210 60 S260 40 286 30" fill="none" stroke="var(--trail)" stroke-width="10" stroke-linecap="round"/><path d="M286 30 V2" stroke="var(--ink)" stroke-width="2"/><path class="pennant" d="M287 3 h22 l-5 6 5 6 h-22z" fill="#D2F000" stroke="#9DB400"/></svg>
     <div style="position:absolute;left:24px;bottom:4px">${av(ME.id,{c:ME.c,size:46})}</div>
     <div style="position:absolute;left:84px;top:14px"><div class="t-cap ink3">Your Mob's flag reads</div><div class="t-title">Quiet Comets</div></div>
   </div>
   <div class="t-head">Name your Mob</div>
   <div class="t-small ink2" style="margin-top:4px">Pick one you like. Every name comes from our list, so names stay friendly.</div>
   <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${names.map((n,i)=>`<span class="namechip ${i===0?'on':''}">${n}</span>`).join('')}</div>
   <button class="txtbtn" style="margin-top:10px;display:flex;align-items:center;gap:6px;text-decoration:none">${I.shuffle}<span style="text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--lineStrong)">Show six more</span></button>
   <div class="hair" style="margin:14px 0 12px"></div>
   <div class="t-label">Subject for your Mob's papers</div>
   <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><span class="chip on">Economics</span><span class="chip">Accountancy</span><span class="chip">English</span><span class="chip">Business Studies</span></div>
   <div class="hair" style="margin:14px 0 10px"></div>
   <div style="display:flex;align-items:center;gap:12px">${av(ME.id,{c:ME.c,size:54})}<div style="flex:1"><div class="t-label">You join as Fennec</div><div class="t-cap ink3">First name in the Mob: Ananya</div></div><span class="txtbtn">Change</span></div>
   <div class="t-cap ink3" style="margin-top:10px">A Mob is 2 to 5 friends. Only your Mob sees your name and character, and MockMob never asks for your contacts.</div>
  </div>
  <div style="position:absolute;left:16px;right:16px;bottom:24px"><button class="key">Start the Quiet Comets</button></div>`}

function qrSvg(n=25,size=96){let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#FFFDF8"/>`;let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#17150F"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#FFFDF8"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#17150F"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!inF&&rnd()>.52)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#17150F"/>`}
  s+=fin(0,0)+fin(n-7,0)+fin(0,n-7)+`</svg>`;return s}

function S6b(th){
  const seats=[0,1,2,3].map(()=>`<div class="mem" style="--i:0"><div class="seat">+</div><div class="tag" style="background:transparent;box-shadow:none;color:var(--ink4)">Seat</div></div>`).join('');
  const grp=memberHTML({...ME,lit:false},0,48)+seats;
  return `${statusBar()}
  <div class="hdr"><div class="me">${av(ME.id,{c:ME.c,size:34,feet:false})}</div><div class="ttl"><div class="t-head" style="font-size:26px;line-height:28px">Quiet Comets</div><div class="t-cap ink3">Economics, just you so far</div></div><div class="askm">${mobiHead(22)}Ask Mobi</div></div>
  <div style="height:8px"></div>
  ${scene({h:206,prog:0,d:'M44 150 C40 112 110 112 170 110 C250 108 300 84 270 40',group:grp,anchor:'[168,176]',day:th==='day'}).replace('data-prog','data-flag="" data-prog')}
  <div class="pad" style="margin-top:14px">
   <div class="t-title">Bring one friend to start the trail</div>
   <div class="t-small ink2" style="margin-top:4px">Your first quest begins when a friend joins. A Mob plays best with 2 to 5 friends.</div>
   <div class="share" style="margin-top:12px;display:flex;gap:12px;padding:12px;align-items:center">
     <div style="background:#1B1A16;border-radius:14px;padding:6px 4px 0">${av(ME.id,{c:ME.c,size:48})}</div>
     <div style="flex:1;min-width:0"><div style="font-family:BTitle;font-size:16px;line-height:20px">Ananya started the Quiet Comets on MockMob</div><div style="font-size:12px;line-height:16px;color:#BDB6A6;margin-top:3px">Join with code <b style="color:#D2F000;letter-spacing:.06em">K7P 2M9</b></div></div>
     <div style="border-radius:8px;overflow:hidden;flex:none">${qrSvg(25,58)}</div>
   </div>
   <div class="t-cap ink3" style="margin-top:6px">This is the card your friends see in WhatsApp.</div>
   <div style="margin-top:12px"><button class="key">${I.wa}Invite on WhatsApp</button></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><button class="key2" style="height:48px;font-size:14px;gap:6px">${I.qr}Show QR code</button><button class="key2" style="height:48px;font-size:14px;gap:6px">${I.copy}Copy code</button></div>
  </div>
  <div class="fade-bottom" style="height:90px"></div>
  ${bar('mob')}`}

function S6c(th){
  const kr=(s)=>`<div class="kr">${s.split('').map(c=>`<span class="kk">${c}</span>`).join('')}</div>`;
  return `${statusBar()}<div style="opacity:.45">${S6a(th).replace(statusBar(),'')}</div><div class="dim"></div>
  <div class="sheet" style="bottom:262px;border-radius:32px 32px 0 0">
   <div class="handle"></div>
   <div class="pad" style="padding-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="t-head" style="font-size:26px">Join a friend's Mob</div><button aria-label="Close" style="width:40px;height:40px;display:grid;place-items:center;margin-right:-8px">${I.x}</button></div>
    <div class="t-small ink2" style="margin-top:4px">Type the 6-character code from their invite.</div>
    <div class="codebox" style="margin-top:14px"><i>K</i><i>7</i><i>P</i><i>2</i><i>M</i><i class="cur">9</i></div>
    <div class="found" style="margin-top:12px"><div class="stack">${MOB.filter(m=>!m.you).map(m=>`<span>${av(m.id,{c:m.c,size:30,feet:false})}</span>`).join('')}</div><div style="flex:1;min-width:0"><div class="t-label">Quiet Comets</div><div class="t-cap ink3">Economics, 3 of 5 seats taken</div></div></div>
    <div style="margin-top:12px"><button class="key">Join the Quiet Comets</button></div>
    <div style="display:flex;justify-content:center;margin-top:12px"><span class="txtbtn" style="display:flex;gap:6px;align-items:center;text-decoration:none">${I.scan}<span style="text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--lineStrong)">Scan their QR code instead</span></span></div>
   </div>
  </div>
  <div class="kb">${kr('1234567890')}${kr('QWERTYUIOP')}<div class="kr" style="padding:0 16px">${'ASDFGHJKL'.split('').map(c=>`<span class="kk">${c}</span>`).join('')}</div><div class="kr"><span class="kk w">&#8679;</span>${'ZXCVBNM'.split('').map(c=>`<span class="kk">${c}</span>`).join('')}<span class="kk w">&#9003;</span></div><div class="kr"><span class="kk w">?123</span><span class="kk">,</span><span class="kk sp"></span><span class="kk">.</span><span class="kk w" style="background:var(--volt);color:#0B1000">Go</span></div></div>`}

/* ================= registry ================= */
const SCREENS=[
 {k:'s1',t:'S1 Mob home, the lobby',r2:'R2: "My friends and I are walking to a flag this week. The yellow button plays Riya\'s sprint."',f:S1full},
 {k:'s2',t:'S2 Play picker',r2:'R2: "Pick how to play. Send a sprint now, or play live with Riya because she is here."',f:S2},
 {k:'s3',t:'S3 In play',r2:'R2: "Answer this question. Riya is a step ahead right now, and Kabir\'s faded run is behind me."',f:S3},
 {k:'s4',t:'S4 Results with avatars',r2:'R2: "Riya won, everyone got a line, and the button fixes the question we all got wrong."',f:S4},
 {k:'s5',t:'S5 Avatar picker',r2:'R2: "Choose who I am in the Mob, and tweak the colour and one extra."',f:S5},
 {k:'s6a',t:'S6a Create a Mob',r2:'R2: "Pick a name from the list and a subject, then start."',f:S6a},
 {k:'s6b',t:'S6b A Mob of one, invite',r2:'R2: "It is just me. Send this card on WhatsApp or show the code."',f:S6b},
 {k:'s6c',t:'S6c Join with a code',r2:'R2: "Type my friend\'s 6-character code; it found their Mob, so press Join."',f:S6c},
];

function phone(k,th,extra=''){const S=SCREENS.find(s=>s.k===k);return `<div class="ph play" data-theme="${th}" data-k="${k}" ${extra}>${S.f(th)}</div>`}

function seek(root,t){(root.getAnimations?root.getAnimations({subtree:true}):document.getAnimations()).forEach(a=>{a.pause();a.currentTime=t})}
function replay(el){el.classList.remove('play');void el.offsetWidth;el.classList.add('play');layoutScenes(el)}

const qs=new URLSearchParams(location.search);
const app=document.getElementById('app');
const only=qs.get('only'),th=qs.get('theme')||'night',t=qs.get('t');
function afterFonts(fn){document.fonts.ready.then(()=>requestAnimationFrame(()=>requestAnimationFrame(fn)))}

if(only==='avatars'){
  document.body.classList.add('solo');
  app.innerHTML=`<div class="gal" style="padding:28px;max-width:1240px"><h1 style="font-size:32px">The Folds: Mobi's family of 24</h1><p class="lede" style="font-size:14px">Every character is one sheet of paper folded into a shape, with Mobi's dark visor, capsule eyes and black boots. Paper colour is the member's Mob colour. Locked ones open with Mob quests, never with money.</p><div class="sheet24">${FAM.map((f,i)=>`<div class="cell"><div style="display:flex;justify-content:center">${av(f.id,{c:MCK[i%8],size:104,acc:['none','none','phones','none','none','scarf','none','pin','none','none','specs','none'][i%12]})}</div><div class="nm">${f.name}</div><div class="ob">the ${f.obj}</div><div class="ln">${f.line}</div>${f.lock?`<span class="lk">Unlocks: ${f.lock}</span>`:''}</div>`).join('')}</div></div>`;
  afterFonts(()=>{document.body.dataset.ready=1});
}else if(only==='contact'){
  document.body.classList.add('solo');
  app.innerHTML=`<div class="contact">${['night','day'].map(T=>SCREENS.map(S=>`<div><div class="cl">${S.t}, ${T==='night'?'Night':'Day'}</div>${phone(S.k,T)}</div>`).join('')).join('')}</div>`;
  afterFonts(()=>{document.querySelectorAll('.ph').forEach(p=>layoutScenes(p));seek(document,9000);document.body.dataset.ready=1});
}else if(only==='strip'){
  document.body.classList.add('solo');
  const times=(qs.get('times')||'0,400,800').split(',').map(Number);
  app.innerHTML=`<div class="strip">${times.map(tt=>`<div class="fr">${phone(qs.get('k'),th,`data-t="${tt}"`)}<span>${tt} ms</span></div>`).join('')}</div>`;
  afterFonts(()=>{document.querySelectorAll('.ph').forEach(p=>{layoutScenes(p);seek(p,+p.dataset.t)});document.body.dataset.ready=1});
}else if(only){
  document.body.classList.add('solo');
  app.innerHTML=phone(only,th);
  afterFonts(()=>{const p=document.querySelector('.ph');layoutScenes(p);seek(p,t==null?9000:+t);document.body.dataset.ready=1});
}else{
  app.innerHTML=`<div class="gal"><h1>The Trail</h1><p class="lede">The Mob walks one shared trail each week. Every question any of you practises moves the whole group toward the flag, and every game you play together leaves a mark on it. Illustrative data: names, scores and codes are made up for the mock-up.</p><span class="note">Mock-up only, 360 x 780 dp, Night and Day. Tap Replay to see the motion; tap tiles in S5 to pick a character.</span>
  ${SCREENS.map(S=>`<section class="row"><h2>${S.t}</h2><p class="r2">${S.r2}</p><div class="tools"><button data-replay="${S.k}">Replay motion</button></div><div class="pair"><div class="bezel">${phone(S.k,'night')}</div><div class="bezel">${phone(S.k,'day')}</div></div></section>`).join('')}
  <section class="row"><h2>The Folds: all 24 characters</h2><p class="r2">Original folded-paper characters in Mobi's family. Each has a name and a one-line study personality; 8 unlock with Mob quests.</p><div class="sheet24">${FAM.map((f,i)=>`<div class="cell"><div style="display:flex;justify-content:center">${av(f.id,{c:MCK[i%8],size:96})}</div><div class="nm">${f.name}</div><div class="ob">the ${f.obj}</div><div class="ln">${f.line}</div>${f.lock?`<span class="lk">Unlocks: ${f.lock}</span>`:''}</div>`).join('')}</div></section></div>`;
  afterFonts(()=>document.querySelectorAll('.ph').forEach(p=>layoutScenes(p)));
  document.addEventListener('click',e=>{
    const r=e.target.closest('[data-replay]');if(r){document.querySelectorAll(`.ph[data-k="${r.dataset.replay}"]`).forEach(replay);return}
    const ph=e.target.closest('.ph');if(!ph||ph.dataset.k!=='s5')return;
    const pick=e.target.closest('[data-pick]'),cl=e.target.closest('[data-col]'),ac=e.target.closest('[data-acc]');
    if(!pick&&!cl&&!ac)return;
    const cur=ph.dataset.sel||'fennec',col=cl?cl.dataset.col:(ph.dataset.col||'amber'),acc=ac?ac.dataset.acc:(ph.dataset.acc||'scarf');
    let sel=pick?pick.dataset.pick:cur;if(famById[sel].lock){pick.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:240,easing:'ease-out'});const ln=ph.querySelector('.stageLine');ln.textContent='Unlocks when your Mob does this: '+famById[sel].lock+'.';return}
    ph.dataset.sel=sel;ph.dataset.col=col;ph.dataset.acc=acc;
    const st=ph.querySelector('.stageAv');st.classList.remove('avIn');st.classList.add('avOut');
    setTimeout(()=>{st.innerHTML=av(sel,{c:col,acc,size:120,mood:'happy'});st.classList.remove('avOut');void st.offsetWidth;st.classList.add('avIn')},180);
    ph.querySelector('.stageName').innerHTML=`${famById[sel].name} <span class="t-small ink3">the ${famById[sel].obj}</span>`;ph.querySelector('.stageLine').textContent=famById[sel].line;ph.querySelector('.useKey').textContent='Use '+famById[sel].name;
    ph.querySelectorAll('.gt').forEach(g=>g.classList.toggle('on',g.dataset.pick===sel));ph.querySelectorAll('.swatch').forEach(g=>g.classList.toggle('on',g.dataset.col===col));ph.querySelectorAll('.accb').forEach(g=>g.classList.toggle('on',g.dataset.acc===acc));
  });
}
</script>
