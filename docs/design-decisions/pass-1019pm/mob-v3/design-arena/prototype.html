<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mob v3 Den Arena</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* =====================================================================
   Mob v3, "Den Arena". Clickable prototype with real motion.
   Tokens: APP/lib/core/theme (mm_colors.dart), motion_tokens.g.dart,
   BRAND-MOTION-KIT.md. Fixture is illustrative and consistent.
   Assets load from ./assets so characters can be swapped as files:
   assets/chars/<key>.webp, else assets/chars/fallback/<key>.svg.
   ===================================================================== */
.night{
  --ground:#12110E; --raised:#1B1A16; --raised2:#25231E; --sunken:#0D0C0A; --floor:#0F0E0C;
  --line:#312E27; --lineStrong:#4A453B; --ink:#F4F0E6; --ink2:#BDB6A6; --ink3:#A09989; --ink4:#6A645A;
  --volt:#D2F000; --voltInk:#0B1000; --voltEdge:#9DB400; --accentText:#D2F000; --voltGlow:rgba(210,240,0,.14);
  --good:#C6E86E; --goodSurf:rgba(198,232,110,.12); --goodBorder:rgba(198,232,110,.55);
  --wrongSurf:#2A1614; --wrongBorder:#7D3128; --wrongText:#FFC9C2;
  --lamp:#F2A93B; --rim:#F2B865; --pool:.26;
  --glass:rgba(27,26,22,.74); --edge:rgba(255,246,228,.12); --scrim:rgba(8,7,5,.62);
  --shadow:0 1px 1px rgba(0,0,0,.25),0 18px 36px -20px rgba(0,0,0,.45);
  --paper:#EDE5D3; --paperInk:#2A251F; --paperEdge:#BDB29C; --felt:#1A1814;
  --m-blue:#6E8BFF; --m-teal:#3FC6A8; --m-amber:#F2A93B; --m-rose:#FF7A8A; --m-violet:#B98CFF; --m-sky:#56B8F0; --m-coral:#E58E5A; --m-green:#9FBF4A;
  --tint:#1B1A16; --keycap:#34312B; --keyb:#1E1D19;
}
.day{
  --ground:#F3EFE6; --raised:#FFFDF8; --raised2:#E9E4D8; --sunken:#EAE5DA; --floor:#EEEAE0;
  --line:#D8D1C2; --lineStrong:#BDB4A2; --ink:#17150F; --ink2:#454036; --ink3:#655F53; --ink4:#8A8375;
  --volt:#D2F000; --voltInk:#0B1000; --voltEdge:#9DB400; --accentText:#526700; --voltGlow:rgba(210,240,0,.22);
  --good:#3D6600; --goodSurf:#EEF5DC; --goodBorder:#8DB33A;
  --wrongSurf:#FBE9E7; --wrongBorder:#B93225; --wrongText:#B0291F;
  --lamp:#F2A93B; --rim:#F2C46B; --pool:.17;
  --glass:rgba(255,253,248,.82); --edge:rgba(255,255,255,.85); --scrim:rgba(23,21,15,.40);
  --shadow:0 1px 2px rgba(42,32,16,.06),0 14px 30px -18px rgba(42,32,16,.18);
  --paper:#FFFDF8; --paperInk:#2A251F; --paperEdge:#CFC6B4; --felt:#E7E1D3;
  --m-blue:#3550C8; --m-teal:#0E7C66; --m-amber:#9A5B00; --m-rose:#B4243A; --m-violet:#6A3BC4; --m-sky:#0B6A9E; --m-coral:#A14A12; --m-green:#55741A;
  --tint:#FFFDF8; --keycap:#FFFDF8; --keyb:#E3DED3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0A08}
body{font-family:'Hanken',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#F4F0E6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
.num,.fig{font-variant-numeric:tabular-nums}
.t-hero{font:700 96px/86px 'BCond';letter-spacing:-1px;font-variant-numeric:tabular-nums}
.t-figure{font:700 52px/47px 'BCond';font-variant-numeric:tabular-nums}
.t-fig{font-family:'BCond';font-weight:700;font-variant-numeric:tabular-nums}
.t-display{font:650 36px/38px 'BHead';letter-spacing:-.8px}
.t-headline{font:650 28px/31px 'BHead';letter-spacing:-.5px}
.t-title{font:620 22px/27px 'BTitle';letter-spacing:-.3px}
.t-sub{font:700 17px/22px 'Hanken'}
.t-body{font:400 16px/24px 'Hanken'}
.t-q{font:500 17px/26px 'Hanken'}
.t-small{font:400 14px/20px 'Hanken'}
.t-cap{font:400 13px/18px 'Hanken'}
.t-label{font:600 13px/18px 'Hanken'}
.ink2{color:var(--ink2)} .ink3{color:var(--ink3)} .acc{color:var(--accentText)}
b{font-weight:700;color:var(--ink)}

/* ---------- phone ---------- */
.phone{position:relative;width:360px;height:780px;overflow:hidden;background:var(--ground);color:var(--ink);flex:none;isolation:isolate}
.scr{position:absolute;inset:0}
.status{position:absolute;top:0;left:0;right:0;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 24px;font:600 13px/1 'Hanken';color:var(--ink);z-index:30}
.status .ico{display:flex;gap:6px;align-items:center}
.status.on-img{color:#F4F0E6}
.hdr{position:absolute;top:32px;left:0;right:0;height:56px;display:flex;align-items:center;gap:4px;padding:0 8px;z-index:25}
.hdr .ib{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;color:var(--ink)}
.hdr .tt{flex:1;min-width:0}
.hdr .tt .t1{font:620 18px/22px 'BTitle';letter-spacing:-.2px}
.hdr .tt .t2{font:400 13px/18px 'Hanken';color:var(--ink2)}
.livepill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 9px;border-radius:14px;background:var(--raised2);font:700 13px/1 'Hanken'}
.livepill i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.clockpill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--raised);border:1px solid var(--line);font:700 16px/1 'BCond';font-variant-numeric:tabular-nums;letter-spacing:.2px}

.key{height:56px;border-radius:999px;background:var(--volt);color:var(--voltInk);font:650 16px/20px 'Hanken';display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.08),0 1px 0 var(--voltEdge),0 10px 24px -14px rgba(157,180,0,.7);position:relative;overflow:hidden}
.key2{height:48px;border-radius:999px;background:var(--raised);color:var(--ink);font:600 15px/20px 'Hanken';display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--lineStrong);padding:0 18px;white-space:nowrap}
.key.off{background:var(--raised2);color:var(--ink3);box-shadow:none}
.tbtn{height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 15px/20px 'Hanken';color:var(--ink);text-decoration:underline;text-decoration-color:var(--lineStrong);text-underline-offset:5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--raised2);font:600 13px/1 'Hanken';color:var(--ink);white-space:nowrap}
.card{background:var(--raised);border-radius:24px;box-shadow:var(--shadow);position:relative}
.night .card{box-shadow:inset 0 1px 0 rgba(255,246,228,.05),var(--shadow)}
.day .card{border:1px solid var(--line)}
.hair{height:1px;background:var(--line)}
.note{position:absolute;z-index:60;left:50%;transform:translateX(-50%);top:4px;height:24px;padding:0 10px;border-radius:12px;background:#F2A93B;color:#1B1306;font:700 12px/24px 'Hanken';white-space:nowrap;border:1px dashed rgba(0,0,0,.45)}

/* dock (the app's bar, unchanged) */
.bar{position:absolute;left:16px;right:16px;bottom:12px;height:64px;border-radius:32px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-around;z-index:40}
.night .bar{border-color:rgba(255,246,228,.10)}
.bar .slot{width:58px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12px/15px 'Hanken';color:var(--ink2)}
.bar .slot.on{background:var(--raised2);color:var(--ink);font-weight:700}
.night .bar .slot.on svg{color:var(--volt)}
.bar .start{width:64px;height:64px;border-radius:50%;background:var(--volt);color:var(--voltInk);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 12px/14px 'Hanken';margin-top:-4px;box-shadow:0 0 0 1px var(--voltEdge),0 10px 20px -10px rgba(0,0,0,.5)}

/* ---------- characters ---------- */
.fw{position:absolute;width:0;height:0}                 /* anchor at the feet */
.fw .sh{position:absolute;left:-30px;top:-7px;width:60px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.42),rgba(0,0,0,0));}
.day .fw .sh{background:radial-gradient(closest-side,rgba(59,42,18,.22),rgba(59,42,18,0))}
.fw .fx{position:absolute;bottom:0;left:0;transform-origin:50% 100%}
.fw .fb{position:absolute;bottom:0;left:0;transform:translateX(-50%);transform-origin:50% 100%}
.fw img{height:100%;width:auto;max-width:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
.night .fw.lit img{filter:drop-shadow(0 0 0 transparent) drop-shadow(-1px -1px 0 rgba(242,184,101,.18))}
.tag{position:absolute;transform:translateX(-50%);white-space:nowrap;font:700 13px/18px 'Hanken';color:var(--ink);text-align:center}
.tag .sub{display:block;font:500 12px/15px 'Hanken';color:var(--ink2)}
.on-img .tag,.night .tag.on-img{color:#F4F0E6;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.day .tag.on-img{color:var(--ink);text-shadow:0 1px 2px rgba(255,253,248,.9)}
.head{position:relative;border-radius:50%;overflow:hidden;flex:none;display:inline-block}
.head img{position:absolute;left:50%;top:0;height:200%;width:auto;transform:translate(-50%,-6%)}
.head.fbk img{height:220%;transform:translate(-50%,-4%)}
.ring{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--mc)}
.herepill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;background:rgba(18,17,14,.78);color:#F4F0E6;font:700 12px/1 'Hanken'}
.herepill i{width:7px;height:7px;border-radius:50%;background:#C6E86E}

/* ---------- den ---------- */
.den{position:absolute;left:0;right:0;top:0;overflow:hidden}
.den .img{position:absolute;inset:-2px;background-size:cover;background-position:50% 64%}
.den .dim{position:absolute;inset:0;background:#000;opacity:0}
.den .pool{position:absolute;left:50%;width:420px;height:150px;margin-left:-210px;border-radius:50%;background:radial-gradient(closest-side,rgba(242,169,59,.42),rgba(242,169,59,0));mix-blend-mode:screen;opacity:.0}
.day .den .pool{background:radial-gradient(closest-side,rgba(242,196,107,.45),rgba(242,196,107,0));mix-blend-mode:multiply}
.den .topscrim{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(rgba(10,9,7,.66),rgba(10,9,7,0))}
.day .den .topscrim{background:linear-gradient(rgba(243,239,230,.92),rgba(243,239,230,0))}
.den .floorfade{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(rgba(18,17,14,0),var(--ground))}
.denhdr{position:absolute;top:32px;left:0;right:0;height:60px;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;z-index:25}
.denhdr .nm{font:650 24px/28px 'BTitle';letter-spacing:-.4px;display:flex;align-items:center;gap:4px}
.denhdr .sb{font:500 13px/18px 'Hanken';color:var(--ink2)}
.night .denhdr .nm,.night .denhdr{color:#F4F0E6}
.night .denhdr .sb{color:#CFC8B8}
.chainchip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:18px;background:rgba(18,17,14,.62);border:1px solid rgba(255,246,228,.14);color:#F4F0E6;font:700 17px/1 'BCond';backdrop-filter:blur(12px)}
.day .chainchip{background:rgba(255,253,248,.85);border-color:var(--line);color:var(--ink)}
.chainchip small{font:600 12px/1 'Hanken';color:inherit;opacity:.8}
.askm{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:rgba(18,17,14,.62);border:1px solid rgba(255,246,228,.14)}
.day .askm{background:rgba(255,253,248,.85);border-color:var(--line)}
.askm img{height:30px}

/* pennant (the Mob chain) */
.pennant{position:absolute;transform-origin:50% 0}
.pennant .cord{position:absolute;left:50%;top:-18px;width:1px;height:18px;background:rgba(255,246,228,.35)}
.day .pennant .cord{background:rgba(23,21,15,.25)}
.shelf{position:absolute;height:6px;border-radius:2px;background:linear-gradient(#5A4632,#3A2D20);box-shadow:0 6px 10px -4px rgba(0,0,0,.5)}
.day .shelf{background:linear-gradient(#C9B593,#A99272)}

/* ---------- quest strip ---------- */
.qbar{position:relative;height:12px;border-radius:6px;background:var(--raised2);overflow:hidden}
.qbar .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ink2)}
.segbar{display:flex;gap:3px;height:14px}
.segbar i{flex:1;border-radius:3px;background:var(--raised2);position:relative}
.segbar i.on{background:var(--ink2)}
.night .segbar i.on{background:#CFC8B8}

/* ---------- lanes (race track) ---------- */
.lanes{position:absolute;left:12px;right:12px;border-radius:24px;background:var(--felt);padding:10px 10px 8px;overflow:hidden}
.night .lanes{background:linear-gradient(#1C1A16,#161512);box-shadow:inset 0 1px 0 rgba(255,246,228,.06)}
.lanes .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,246,228,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,246,228,.035) 1px,transparent 1px);background-size:12px 12px;pointer-events:none}
.day .lanes .grid{background-image:linear-gradient(rgba(23,21,15,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(23,21,15,.045) 1px,transparent 1px)}
.lane{position:relative;height:42px;display:flex;align-items:center}
.lanes.c4 .lane{height:37px}.lanes.c4 .lane .tok .head{width:30px!important;height:30px!important;left:-15px;top:-15px}.lanes.c4 .lane .strip{height:26px}
.lane+.lane{margin-top:4px}
.lane .who{width:64px;font:700 13px/16px 'Hanken';color:var(--ink);white-space:nowrap;overflow:visible}
.lane .who small{display:block;font:500 11px/14px 'Hanken';color:var(--ink3)}
.lane .strip{position:relative;flex:1;height:30px;border-radius:15px;background:var(--raised2)}
.night .lane .strip{background:#2A2722}
.lane.me .strip{background:var(--raised);box-shadow:inset 0 0 0 1px var(--lineStrong)}
.night .lane.me .strip{background:#34302A}
.lane .bub{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:1.5px solid var(--ink4);background:transparent}
.lane .bub.f{background:var(--mc);border-color:var(--mc)}
.lane .flag{position:absolute;top:3px;right:6px;width:2px;height:24px;background:var(--ink3)}
.lane .tok{position:absolute;top:50%;width:0;height:0}
.lane .tok .head{position:absolute;left:-17px;top:-17px;width:34px;height:34px;background:color-mix(in srgb,var(--mc) 28%,var(--tint));box-shadow:0 0 0 2px var(--mc),0 4px 10px -4px rgba(0,0,0,.6)}
.lane .tok.ghost .head{opacity:.78;box-shadow:0 0 0 2px var(--ground),0 0 0 3.5px var(--mc)}
.lane .tok .pen{position:absolute;left:12px;top:-36px;width:2px;height:30px;background:var(--ink2);transform-origin:50% 100%}
.lane .tok .pen b{position:absolute;left:2px;top:0;width:22px;height:15px;background:var(--mc);clip-path:polygon(0 0,100% 50%,0 100%);transform-origin:0 50%}
.lane .tim{position:absolute;right:28px;top:50%;transform:translateY(-50%);font:600 11px/1 'Hanken';color:var(--ink3);white-space:nowrap}
.pacechip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--raised2);font:700 12px/1 'Hanken';color:var(--ink)}

/* ---------- options ---------- */
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px 8px 9px;border-radius:16px;background:var(--raised);border:1.5px solid var(--line);font:500 16px/22px 'Hanken';box-shadow:0 2px 0 var(--line)}
.night .opt{background:#1E1C18;border-color:#35322B;box-shadow:0 2px 0 #0B0A08}
.opt .lt{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;background:var(--raised2);font:700 13px/1 'Hanken';color:var(--ink2);flex:none}
.opt.sel{border-color:var(--ink);box-shadow:0 2px 0 var(--ink3)}
.opt.sel .lt{background:var(--ink);color:var(--ground)}
.opt.right{background:var(--goodSurf);border-color:var(--goodBorder)}
.opt.right .lt{background:var(--good);color:var(--ground)}
.opt.wrong{background:var(--wrongSurf);border-color:var(--wrongBorder)}
.opt.wrong .lt{background:var(--wrongBorder);color:#fff}
.opt .clip{position:absolute;right:-6px;top:-10px;width:16px;height:30px}
.opt .tick{position:absolute;right:14px;top:50%;margin-top:-12px}
.opt .mk{position:absolute;right:46px;top:50%;margin-top:-10px;font:700 15px/20px 'BCond';color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- podium ---------- */
.plinth{position:absolute;bottom:0;transform-origin:50% 100%;border-radius:10px 10px 0 0;background:linear-gradient(var(--paper),color-mix(in srgb,var(--paper) 86%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.08)}
.plinth .lines{position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 9px,rgba(42,37,31,.10) 9px 10px);border-radius:inherit}
.plinth .numr{position:absolute;left:0;right:0;top:12px;text-align:center;font:700 40px/40px 'BCond';color:var(--paperInk)}
.plinth .fold{position:absolute;right:0;top:0;width:18px;height:18px;background:linear-gradient(225deg,var(--ground) 50%,rgba(0,0,0,.18) 50%,color-mix(in srgb,var(--paper) 70%,#000) 100%);border-top-right-radius:10px}
.plinth .sheen{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(105deg,rgba(255,255,255,0) 30%,rgba(242,184,101,.55) 48%,rgba(255,240,200,.75) 52%,rgba(255,255,255,0) 70%);background-size:300% 100%;background-position:120% 0;mix-blend-mode:soft-light;opacity:0}
.marks{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap}
.marks .n{font:700 13px/16px 'Hanken';color:var(--ink)}
.marks .v{font:700 15px/18px 'BCond';color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.sheetbg{position:absolute;inset:0;background:var(--scrim);z-index:45}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ground);border-radius:32px 32px 0 0;z-index:46;padding:10px 16px 16px;box-shadow:0 -10px 40px -10px rgba(0,0,0,.5)}
.night .sheet{background:#171612;box-shadow:inset 0 1px 0 rgba(255,246,228,.08),0 -10px 40px -10px rgba(0,0,0,.6)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--lineStrong);margin:0 auto 10px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0}
.row .ri{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--raised2);color:var(--ink);flex:none}
.row .rt{flex:1;min-width:0}
.row .rt .a{font:700 15px/20px 'Hanken'}
.row .rt .b{font:400 13px/18px 'Hanken';color:var(--ink2)}
.row.lock .ri{color:var(--ink3)}
.row.lock .rt .a{color:var(--ink2)}
.lockt{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--lineStrong);font:600 12px/1 'Hanken';color:var(--ink2);white-space:nowrap}
.minikey{height:36px;padding:0 14px;border-radius:18px;background:var(--raised2);font:650 14px/1 'Hanken';display:inline-flex;align-items:center;white-space:nowrap}
.minikey.v{background:var(--volt);color:var(--voltInk)}

/* ---------- stickers ---------- */
.stk{display:inline-flex;flex-direction:column;align-items:center;gap:4px;width:72px}
.stk .p{width:56px;height:56px;border-radius:14px;background:var(--paper);display:grid;place-items:center;transform:rotate(-3deg);box-shadow:0 2px 0 var(--paperEdge),0 8px 14px -8px rgba(0,0,0,.5);position:relative}
.stk .p:after{content:"";position:absolute;right:0;top:0;width:12px;height:12px;background:linear-gradient(225deg,var(--ground) 50%,var(--paperEdge) 50%);border-top-right-radius:14px}
.stk span{font:600 13px/16px 'Hanken';color:var(--ink);text-align:center}

/* ---------- misc ---------- */
.seal{position:absolute}
.canvas{position:absolute;inset:0;pointer-events:none;z-index:50}
.wash{position:absolute;inset:0;pointer-events:none;z-index:48;background:var(--volt);opacity:0}
.spot{position:absolute;inset:0;pointer-events:none}
.kbd{position:absolute;left:0;right:0;bottom:0;height:268px;background:var(--keyb);padding:8px 4px 0;z-index:30}
.kbd .r{display:flex;justify-content:center;gap:5px;margin-bottom:9px}
.kbd .k{width:32px;height:42px;border-radius:6px;background:var(--keycap);display:grid;place-items:center;font:400 19px/1 'Hanken';color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.codebox{width:44px;height:56px;border-radius:12px;background:var(--raised);border:1.5px solid var(--line);display:grid;place-items:center;font:700 26px/1 'BCond';color:var(--ink)}
.codebox.cur{border-color:var(--ink)}
.dash{border:1.5px dashed var(--lineStrong);border-radius:50%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;text-align:center}
.cal .h{font:600 11px/16px 'Hanken';color:var(--ink3)}
.cal .d{height:36px;display:grid;place-items:center;position:relative;font:600 13px/1 'Hanken';color:var(--ink3)}
.cal .d .c{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.cal .d.p .c{background:var(--raised2);color:var(--ink)}
.cal .d.p .c svg{position:absolute;right:2px;bottom:2px}
.cal .d.r .c{background:transparent;border:1.5px dashed var(--lineStrong);color:var(--ink2)}
.cal .d.t .c{background:var(--volt);color:var(--voltInk);font-weight:800}
.cal .d.run:before{content:"";position:absolute;left:0;right:0;top:50%;height:32px;margin-top:-16px;background:color-mix(in srgb,var(--raised2) 55%,transparent);z-index:-1}
.cal .d.run.s:before{left:50%} .cal .d.run.e:before{right:50%}
.ms{display:flex;align-items:flex-start;justify-content:space-between;position:relative}
.ms .st{width:56px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1}
.ms .st .b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 18px/1 'BCond';background:var(--raised2);color:var(--ink2);border:1.5px solid var(--line)}
.ms .st.done .b{background:var(--paper);color:var(--paperInk);border-color:var(--paperEdge)}
.ms .st.now .b{background:var(--volt);color:var(--voltInk);border-color:var(--voltEdge)}
.ms .st.next .b{border-style:dashed;border-color:var(--lineStrong);background:transparent;color:var(--ink)}
.ms .st span{font:500 11px/14px 'Hanken';color:var(--ink2);text-align:center}
.ms .path{position:absolute;left:28px;right:28px;top:21px;height:2px;background:var(--line)}
.ms .path i{position:absolute;left:0;top:0;bottom:0;background:var(--ink3)}
.shelfrow{position:relative;display:flex;justify-content:space-around;align-items:flex-end;height:104px;padding:0 4px}
.shelfrow:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:8px;border-radius:2px;background:linear-gradient(#4A3A2A,#2E241A);box-shadow:0 10px 14px -8px rgba(0,0,0,.6)}
.day .shelfrow:after{background:linear-gradient(#D4C2A2,#B8A27F);box-shadow:0 8px 12px -8px rgba(59,42,18,.35)}
.slotc{display:flex;flex-direction:column;align-items:center;width:92px;position:relative}
.slotc .lbl{font:700 13px/16px 'Hanken';margin-top:12px;text-align:center}
.slotc .rule{font:400 12px/15px 'Hanken';color:var(--ink2);text-align:center;margin-top:2px}
.sil{filter:brightness(0) invert(1) opacity(.16)}
.day .sil{filter:brightness(0) opacity(.18)}
.wa{background:#0B141A;border-radius:18px;padding:10px;color:#E9EDEF}
.day .wa{background:#EFEAE2;color:#111B21}
.wa .bub2{background:#005C4B;border-radius:12px 4px 12px 12px;padding:8px;margin-left:36px}
.day .wa .bub2{background:#D9FDD3}
.lc{position:absolute;inset:0;pointer-events:none}
.focusring:focus-visible{outline:2px solid var(--ink);outline-offset:2px}


.flow{position:absolute;left:16px;right:16px;display:flex;flex-direction:column}
.night{--segOn:#CFC8B8}.day{--segOn:#454036}
.segbar i.on{background:var(--segOn)!important}
.head img{height:190%!important;transform:translate(-50%,-12%)!important}
.head.fbk img{height:230%!important;transform:translate(-50%,-22%)!important}
.den .fw,.den .tag,.den .den-here{z-index:2}
.den .tag{text-shadow:0 1px 3px rgba(0,0,0,.6)}
.day .den .tag{text-shadow:0 1px 2px rgba(255,253,248,.9)}
.day .den .tag .sub{color:#454036}
.night .den .tag .sub{color:#E3DCCB}
/* day-specific: moments dim with warm ink, never grey */
.night{--link:#EDE5D3}.day{--link:#CBBE9F}
.day .cd-scrim,.day .pd-scrim,.day .rv-scrim{background:#3B2A12!important;filter:opacity(.28)}
.day .chain-links-bg{background:transparent}

.app{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:28px}
.side{width:300px;color:#E9E3D6;font:500 14px/20px 'Hanken'}
.side h1{font:650 26px/30px 'BHead';margin-bottom:6px}
.side p{color:#A09989;margin-bottom:12px}
.side h2{font:700 13px/18px 'Hanken';color:#BDB6A6;margin:16px 0 6px}

<script>
/* =====================================================================
   1. CONFIG: assets, cast, fixture (illustrative, consistent)
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.has('capture');
if (CAPTURE) document.body.classList.add('capture');
const RM_FORCED = Q.get('rm') === '1';
const RM = () => RM_FORCED || matchMedia('(prefers-reduced-motion: reduce)').matches;

const ART = n => `assets/art/${n}`;
/* The cast. Swap a character by replacing assets/chars/<key>.webp (any transparent image, feet at the bottom). */
const CH = {
  dart:   {name:'Dart',    fb:'dart',    line:'Answers first, then checks every answer twice.'},
  patang: {name:'Patang',  fb:'patang',  line:'Rises fastest when the wind is against it.'},

/* Fixture: Thursday 22 Oct. Chai Circle, Accountancy. Join order: Aarav (you, started it, Free), Riya (Pro), Kabir, Zoya. */
const M = {
  you:  {name:'Aarav', short:'You',   ch:'dart',   mc:'sky'},
  riya: {name:'Riya',  short:'Riya',  ch:'patang', mc:'rose'},
  kabir:{name:'Kabir', short:'Kabir', ch:'naav',   mc:'blue'},
  zoya: {name:'Zoya',  short:'Zoya',  ch:'hop',    mc:'teal'},

/* Riya's sprint (async, opened 2:05 PM, open 24 hours). Seconds per question and pick (r right, w wrong, s skip). */
const RUN = {
  riya: {p:'rrrsr', t:[38,35,44,18,29], at:'2:10 PM'},   /* 20 marks, 2:44 */
  you:  {p:'rrrwr', t:[30,34,41,52,17], at:'8:40 PM'},   /* 19 marks, 2:54 */
  kabir:{p:'rrrwr', t:[26,42,55,33,31], at:'4:55 PM'},   /* 19 marks, 3:07 (changed Q3) */
  zoya: {p:'wrrwr', t:[20,25,24,35,36], at:'6:30 PM'},   /* 13 marks, 2:20 */
};
const marks = k => [...RUN[k].p].reduce((s,c)=>s+(c==='r'?5:c==='w'?-1:0),0);
const answered = k => [...RUN[k].p].filter(c=>c!=='s').length;
/* progress in questions (0..5, fractional) at elapsed second T of a run */
function prog(k,T){ let acc=0; const t=RUN[k].t; for(let i=0;i<t.length;i++){ if(T<acc+t[i]) return i+(T-acc)/t[i]; acc+=t[i]; } return 5; }
const arrive = (k,q) => RUN[k].t.slice(0,q).reduce((a,b)=>a+b,0);
/* Quest: questions answered in Mob games this week. Mob paper Mon-Tue: 37. Sprint before you: 4+5+5 = 14. */
const QUEST = {target:60, paper:37};
QUEST.beforeYou = QUEST.paper + answered('riya') + answered('kabir') + answered('zoya'); /* 51 */
QUEST.afterYou  = QUEST.beforeYou + answered('you');                                     /* 56 */
QUEST.afterLive = QUEST.afterYou + 5 + 5 + 4;                                            /* 70: live rematch, Riya 5, Kabir 5, you 4 */
(function selfCheck(){
  const ok = marks('riya')===20 && marks('you')===19 && marks('kabir')===19 && marks('zoya')===13 &&
    QUEST.beforeYou===51 && QUEST.afterYou===56 && QUEST.afterLive===70 &&
    Math.floor(prog('you',72))===2 && Math.floor(prog('kabir',72))===2 && Math.floor(prog('riya',72))===1 && Math.floor(prog('zoya',72))===3;
  if(!ok) console.error('fixture self-check failed');
})();

/* =====================================================================
   2. MOTION TOKENS (motion_tokens.g.dart + kit section 6)
   ===================================================================== */
const C = {
  glide:'cubic-bezier(.15,.5,.5,1)', out:'cubic-bezier(.23,1,.32,1)', emph:'cubic-bezier(.16,1,.3,1)',
  exit:'cubic-bezier(.4,.3,.8,.6)', leave:'cubic-bezier(.5,0,.75,0)', sweep:'cubic-bezier(.45,0,.55,1)',
  drawer:'cubic-bezier(.32,.72,0,1)', inOut:'cubic-bezier(.77,0,.175,1)', lin:'linear'
};
const T = {press:100, release:140, exit:200, card:240, ink:260, engrave:280, glide:300, result:320, enter:360, emph:420,
  drawIn:450, milestone:500, roll:500, sweep:700, countUp:720, stagger:45, beat:600, t2:1200, t3:2000, t4:6000};
/* Springs as CSS linear() easings, simulated from (duration, bounce) the way Flutter's SpringDescription.withDurationAndBounce reads them */
function springEase(dur, bounce){
  const z = 1 - bounce, w = 2*Math.PI/(dur/1000), wd = w*Math.sqrt(Math.max(1e-6,1-z*z));
  const x = t => z>=0.999 ? 1-(1+w*t)*Math.exp(-w*t) : 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));
  let end = dur/1000; for(let t=dur/1000; t<4; t+=0.005){ let ok=true; for(let s=t; s<t+0.25; s+=0.01){ if(Math.abs(1-x(s))>0.004){ok=false;break;} } if(ok){end=t;break;} }
  const n=48, pts=[]; for(let i=0;i<=n;i++){ const t=end*i/n; pts.push((i===n?1:x(t)).toFixed(4)); }
  return {e:`linear(${pts.join(',')})`, d:Math.round(end*1000)};
}
const SP = {
  smooth:springEase(360,.12), snappy:springEase(220,0), settle:springEase(420,0), iconPop:springEase(420,.18),
  celebrate:springEase(520,.22), release:springEase(300,.1)
};

/* =====================================================================
   3. TIMELINE: every moment is seekable (frame strips) and skippable (any tap, 200 ms)
   ===================================================================== */
class TL {
  constructor(){ this.anims=[]; this.fns=[]; this.dur=0; this.t=0; this.rate=1; this.raf=0; this.done=null; }
  a(el, kf, o={}){ if(!el) return this; const els = el.length!==undefined && !(el instanceof Element) ? [...el] : [el];
    els.forEach((e,i)=>{ const at=(o.at||0)+(o.st||0)*i; const d=o.d||T.card; const it=o.it||1;
      const an=e.animate(kf,{duration:d, delay:at, easing:o.e||C.out, fill:'both', iterations:it, direction:o.dir||'normal', composite:o.comp||'replace'});
      an.pause(); an.currentTime=0; this.anims.push(an); this.dur=Math.max(this.dur, at+d*it); });
    return this; }
  f(fn, at=0, d=0){ this.fns.push({fn,at,d}); this.dur=Math.max(this.dur, at+d); fn(0,0); return this; }
  seek(t){ this.t=t; for(const a of this.anims) a.currentTime=t; for(const x of this.fns){ const p = x.d ? Math.max(0,Math.min(1,(t-x.at)/x.d)) : (t>=x.at?1:0); x.fn(p,t); } }
  play(onDone){ this.done=onDone; let last=performance.now(); this.rate=1; this.seek(0);
    const step=(now)=>{ const dt=now-last; last=now; const nt=Math.min(this.dur, this.t+dt*this.rate); this.seek(nt);
      if(nt<this.dur) this.raf=requestAnimationFrame(step); else { this.raf=0; this.done&&this.done(); } };
    this.raf=requestAnimationFrame(step); return this; }
  skip(){ if(!this.raf) return; const rem=this.dur-this.t; if(rem>200) this.rate=rem/200; }
  end(){ cancelAnimationFrame(this.raf); this.raf=0; this.seek(this.dur); }
}
window.__TL = null;

/* deterministic particles: paper bits, glints, ring bursts (kit section 6: cap 60, 600 to 1400 ms, gravity plus 12% drag) */
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s^=s>>>17; s^=s<<5; return ((s>>>0)%100000)/100000; }; }
class Burst {
  constructor(canvas){ this.cv=canvas; this.cx=canvas.getContext('2d'); this.items=[]; const dpr=window.devicePixelRatio||1; canvas.width=360*dpr; canvas.height=780*dpr; this.cx.setTransform(dpr,0,0,dpr,0,0); }
  bits(at, x, y, n, o={}){ const r=rng(o.seed||7); const pal=o.pal||['#EDE5D3','#F2A93B','#D2F000'];
    for(let i=0;i<n;i++){ const a=(o.a0??-170)+r()*((o.a1??-10)-(o.a0??-170)); const sp=(o.sp||220)*(0.45+r()*0.75); const rad=a*Math.PI/180;
      this.items.push({k:'bit', floor:o.floor??9999, at:at+r()*(o.jit||60), x, y, vx:Math.cos(rad)*sp, vy:Math.sin(rad)*sp, life:600+r()*800, w:4+r()*4, h:3+r()*3, rot:r()*6.28, vr:(r()-.5)*14, c:pal[Math.floor(r()*pal.length)], fl:r()*6.28}); } return this; }
  glints(at, x, y, n, rad, o={}){ const r=rng(o.seed||11); for(let i=0;i<n;i++){ const a=i/n*6.283+r()*.4; const d=rad*(0.7+r()*0.5);
      this.items.push({k:'gl', at:at+i*(o.st||30), x:x+Math.cos(a)*d, y:y+Math.sin(a)*d, life:560+r()*300, s:5+r()*5, c:o.c||'#FFF3D0'}); } return this; }
  ring(at, x, y, r0, r1, o={}){ this.items.push({k:'ring', at, x, y, r0, r1, life:o.d||420, c:o.c||'#D2F000', w:o.w||3}); return this; }
  draw(t){ const c=this.cx; c.clearRect(0,0,360,780); for(const p of this.items){ const tau=(t-p.at)/1000; if(tau<0) continue; const L=p.life/1000; if(tau>L) continue; const u=tau/L;
      if(p.k==='bit'){ const k=2.2, g=520; const fx=(1-Math.exp(-k*tau))/k; const x=p.x+p.vx*fx, y=p.y+p.vy*fx+0.5*g*tau*tau; if(y>p.floor) continue; const rot=p.rot+p.vr*tau; const flut=Math.cos(p.fl+tau*16);
        c.save(); c.globalAlpha=u<.7?1:1-(u-.7)/.3; c.translate(x,y); c.rotate(rot); c.scale(1,Math.max(.15,Math.abs(flut))); c.fillStyle=p.c; c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(0,-p.h/2,p.w/2,p.h); c.restore(); }
      else if(p.k==='gl'){ const s=p.s*Math.sin(Math.PI*u); c.save(); c.translate(p.x,p.y); c.globalAlpha=Math.sin(Math.PI*u); c.fillStyle=p.c; c.beginPath();
        c.moveTo(0,-s); c.quadraticCurveTo(s*.12,-s*.12,s,0); c.quadraticCurveTo(s*.12,s*.12,0,s); c.quadraticCurveTo(-s*.12,s*.12,-s,0); c.quadraticCurveTo(-s*.12,-s*.12,0,-s); c.fill(); c.restore(); }
      else if(p.k==='ring'){ const e=1-Math.pow(1-u,3); const rr=p.r0+(p.r1-p.r0)*e; c.save(); c.globalAlpha=(1-u)*.9; c.strokeStyle=p.c; c.lineWidth=p.w*(1-u*.6); c.beginPath(); c.arc(p.x,p.y,rr,0,6.283); c.stroke(); c.restore(); } } }
}

  pause:'<rect x="6.5" y="5" width="3.5" height="14" rx="1"/><rect x="14" y="5" width="3.5" height="14" rx="1"/>',
};
const ico = (n,s=24,sw=1.8,x='') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${x} aria-hidden="true">${I[n]}</svg>`;
const mc = k => `var(--m-${M[k].mc})`;

function statusBar(time, onImg){ return `<div class="status ${onImg?'on-img':''}"><span class="num">${time}</span><span class="ico">

  <svg width="9" height="14" viewBox="0 0 9 14"><rect x="0" y="1.5" width="9" height="12.5" rx="1.6" fill="currentColor"/><rect x="2.5" y="0" width="4" height="2" rx=".6" fill="currentColor"/></svg></span></div>`; }
function dock(active='mob'){ const s=(k,l)=>`<div class="slot ${active===k?'on':''}">${ico(k,24,1.8)}<span>${l}</span></div>`;
  return `<nav class="bar" aria-label="Main">${s('today','Today')}${s('practice','Practice')}<div class="start"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Start</div>${s('mob','Mob')}${s('you','You')}</nav>`; }

/* a character standing with feet at (x,y); h = figure height */
function fig(ch, x, y, h, o={}){ const fb=isFb(ch);
  return `<div class="fw ${o.cls||''}" ${o.id?`id="${o.id}"`:''} style="left:${x}px;top:${y}px">
    <div class="sh" style="transform:scaleX(${(o.shw||1)})"></div>
    <div class="fx"><div class="fb" style="height:${fb?h*1.16:h}px;${fb?`margin-bottom:-${h*0.05}px`:''}"><img src="${charSrc(ch)}" alt="${o.alt||CH[ch].name}" style="${o.sil?'':''}" class="${o.sil?'sil':''}"></div></div></div>`; }
function head(ch, s, o={}){ return `<span class="head ${isFb(ch)?'fbk':''} ${o.cls||''}" style="width:${s}px;height:${s}px;background:${o.bg||`color-mix(in srgb, ${o.mc||'var(--raised2)'} 26%, var(--tint))`};${o.ring?`box-shadow:0 0 0 2px var(--ground),0 0 0 4px ${o.ring}`:''};${o.ghost?'opacity:.8':''}"><img src="${charSrc(ch)}" alt="" style="${o.img||''}"></span>`; }
const mhead = (k,s,o={}) => head(M[k].ch, s, Object.assign({mc:mc(k)}, o));

/* the Mob chain pennant: stitched paper, one volt stitch per week */
function pennant(weeks, o={}){ const w=o.w||64, h=o.h||88, n=Math.max(weeks, o.slots||weeks);
  const st = [...Array(n)].map((_,i)=>{ const y=16+i*((h-40)/Math.max(1,n)); const on=i<weeks; return `<path class="stitch ${on?'':'off'}" data-i="${i}" d="M10 ${y.toFixed(1)} L${w-10} ${(y+3).toFixed(1)}" stroke="${on?'#D2F000':'rgba(42,37,31,.35)'}" stroke-width="${on?3:1.6}" stroke-linecap="round" ${on?'':'stroke-dasharray="3 4"'} pathLength="1"/>`; }).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="${weeks} weeks in a row">
    <defs><linearGradient id="pg${o.id||''}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6EFDF"/><stop offset="1" stop-color="#D9CDB4"/></linearGradient></defs>
    <path d="M2 2 H${w-2} V${h-22} L${w/2} ${h-2} L2 ${h-22} Z" fill="url(#pg${o.id||''})" stroke="#BDB29C" stroke-width="1"/>
    <path d="M6 6 H${w-6} V${h-24} L${w/2} ${h-7} L6 ${h-24} Z" fill="none" stroke="rgba(42,37,31,.28)" stroke-width="1" stroke-dasharray="2.5 3"/>

/* folded paper parcel (4 flaps) for the reveal */
function parcel(w=150){ return `<div class="parcel" style="position:relative;width:${w}px;height:${w*0.78}px;perspective:600px">

  <div class="pc-rays" style="position:absolute;left:50%;top:50%;width:${w*2.4}px;height:${w*2.4}px;margin:-${w*1.2}px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,214,140,.32) 0deg 6deg,rgba(255,214,140,0) 6deg 22deg);-webkit-mask:radial-gradient(closest-side,#000 20%,transparent 100%);mask:radial-gradient(closest-side,#000 20%,transparent 100%);opacity:0;mix-blend-mode:screen"></div>

  ${['t','r','b','l'].map(s=>{ const tri={t:'polygon(0 0,100% 0,50% 58%)',r:'polygon(100% 0,100% 100%,44% 50%)',b:'polygon(0 100%,100% 100%,50% 44%)',l:'polygon(0 0,0 100%,56% 50%)'}[s];
    const org={t:'50% 0',r:'100% 50%',b:'50% 100%',l:'0 50%'}[s]; const sh={t:'#EADFC8',r:'#DCCEB2',b:'#E4D7BC',l:'#D3C4A6'}[s];
    return `<div class="pc-f pc-${s}" style="position:absolute;inset:0;clip-path:${tri};transform-origin:${org};background:linear-gradient(${s==='t'?180:s==='b'?0:s==='l'?90:270}deg,${sh},#C9B892);border-radius:10px"></div>`; }).join('')}

const sticker = (glyph,label)=>`<div class="stk"><div class="p">${glyph}</div><span>${label}</span></div>`;

  teach:`<svg width="34" height="34" viewBox="0 0 34 34"><path d="M4 9c5-2 9-1 13 2 4-3 8-4 13-2v17c-5-2-9-1-13 2-4-3-8-4-13-2z" fill="none" stroke="#2A251F" stroke-width="2.6" stroke-linejoin="round"/><path d="M17 11v17" stroke="#2A251F" stroke-width="2.6"/></svg>`,
  again:`<svg width="34" height="34" viewBox="0 0 34 34"><path d="M7 16a10 10 0 0 1 17-6.5L27 12M27 6v6h-6M27 18a10 10 0 0 1-17 6.5L7 22M7 28v-6h6" fill="none" stroke="#2A251F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  proud:`<svg width="34" height="34" viewBox="0 0 34 34"><path d="M17 4l3.8 8 8.7 1.1-6.4 6 1.7 8.6L17 23.5l-7.8 4.2 1.7-8.6-6.4-6 8.7-1.1z" fill="#2A251F"/></svg>`,

};
function qr(n=25, s=4){ let r=''; let seed=17; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const fin=(x,y)=>`<rect x="${x*s}" y="${y*s}" width="${7*s}" height="${7*s}" fill="currentColor"/><rect x="${(x+1)*s}" y="${(y+1)*s}" width="${5*s}" height="${5*s}" fill="var(--raised)"/><rect x="${(x+2)*s}" y="${(y+2)*s}" width="${3*s}" height="${3*s}" fill="currentColor"/>`;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9); if(!inF && rnd()>.52) r+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="currentColor"/>`; }
  return `<svg width="${n*s}" height="${n*s}" viewBox="0 0 ${n*s} ${n*s}" aria-label="QR code for K7P 2M9">${r}${fin(0,0)}${fin(n-7,0)}${fin(0,n-7)}</svg>`; }

/* the den stage (generated room, lamp light, the Mob at the floor) */
function denStage(o={}){ const h=o.h||372; const th=o.theme;

  const seats = o.seats || ['you','riya','kabir','zoya']; const n=seats.length + (o.open||0);
  const span = Math.min(316, 80*n), x0 = 180 - span/2 + span/n/2, gy = h - (o.tagRoom||44);

    return fig(ch, x, gy, o.fh||100, {cls:'den-fig lit', id:o.ids?`df-${k}`:''}) + here + tg; }).join('');
  const open = [...Array(o.open||0)].map((_,i)=>{ const x=x0+(seats.length+i)*span/n; return `<div class="den-seat" style="position:absolute;left:${x-24}px;top:${gy-62}px;width:48px;height:62px;border:1.5px dashed ${th==='night'?'rgba(255,246,228,.5)':'rgba(23,21,15,.38)'};border-radius:24px 24px 12px 12px;display:grid;place-items:center;color:${th==='night'?'#E9E3D6':'#454036'};z-index:2" aria-label="Open seat">${ico('plus',20,1.8)}</div>`; }).join('');

    ${figs}${open}
  </div>`; }

function denHeader(o){ return `<div class="denhdr">

      <span class="nm">${o.name||'Chai Circle'}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 10l5 5 5-5"/></svg></span>

function chainTabs(on){ return `<div role="tablist" style="position:absolute;left:16px;right:16px;top:92px;height:44px;border-radius:22px;background:var(--raised2);display:flex;padding:4px">

function chainLinks(n=7, o={}){ /* the paper chain: interlocked links; today's link is the one lit thing */
  const days=o.days||['F','S','S','M','T','W','T']; let out='';
  for(let i=0;i<n;i++){ const x=8+i*42, last=i===n-1, y=i%2?5:0;

      ${o.labels!==false?`<text x="25" y="${y+46}" text-anchor="middle" font-family="Hanken" font-weight="600" font-size="11" fill="var(--ink3)">${days[i]}</text>`:''}</g>`; }
  return `<svg width="${16+n*42+10}" height="${o.labels===false?40:58}" viewBox="0 0 ${16+n*42+10} ${o.labels===false?40:58}" style="overflow:visible" aria-label="The last 7 days of your chain">${out}</svg>`; }

function calDays(){ /* Oct 2026 starts on a Thursday. Chain: 9 to 22, with 14 rested. Today is 22. */
  let out=''; for(let i=0;i<3;i++) out+=`<div class="d"></div>`;
  const prac=[2,3,5,6,7,9,10,11,12,13,15,16,17,18,19,20,21,22];
  for(let d=1; d<=31; d++){ let cls='';
    if(d===22) cls='t run e'; else if(d===14) cls='r run'; else if(prac.includes(d)) cls='p'+(d>=9?' run':'')+(d===9?' s':'');
    if(cls.includes('run') && (d===12||d===19)) cls+=' s'; if(cls.includes('run') && (d===11||d===18)) cls+=' e';
    out+=`<div class="d ${cls}"><div class="c" style="${d>22?'color:var(--ink4)':''}">${d===14?ico('moon',14,2):d}</div></div>`; }
  return out; }

/* =====================================================================
   6. MOMENTS (kit section 6). Each builds a TL on the mounted screen.
   ===================================================================== */
const $ = (s,r=document) => r.querySelector(s); const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const MOMENTS = {};
function mo(id, meta, fn){ MOMENTS[id]={...meta, fn}; }
function rmFade(tl, els, at=0){ tl.a(els, [{opacity:0},{opacity:1}], {at, d:120, e:C.out}); return tl; }
function burstOf(ph){ const cv=$('canvas.canvas',ph); if(!cv) return null; const b=new Burst(cv); return b; }

/* 1. Enter the Den (T2, 1100) */
mo('enterDen', {screen:'denQuiet', t:'Enter the Den', tier:'T2 1100 ms'}, (ph, tl, rm) => {
  const img=$('.den-img',ph), dim=$('.den-dim',ph), pool=$('.den-pool',ph);
  if(rm){ rmFade(tl, ph.querySelector('.scr')); return; }
  tl.a(dim, [{opacity:.62},{opacity:0}], {at:0, d:420, e:C.glide});                       /* light first */
  tl.a(pool, [{opacity:0, transform:'scale(.6)'},{opacity:.9, transform:'scale(1)'}], {at:0, d:420, e:C.glide});
  tl.a(img, [{transform:'translateY(14px) scale(1.03)'},{transform:'translateY(0) scale(1)'}], {at:120, d:T.enter, e:C.emph});
  $$('.den-fig .fx',ph).forEach((f,i)=>{ tl.a(f, [{transform:'translateY(14px) scale(.92)', opacity:0},{transform:'translateY(0) scale(1)', opacity:1}], {at:200+i*T.stagger, d:SP.iconPop.d, e:SP.iconPop.e});
    tl.a(f.parentElement.querySelector('.sh'), [{opacity:0, transform:'scaleX(.4)'},{opacity:1, transform:'scaleX(1)'}], {at:320+i*T.stagger, d:300, e:C.out}); });
  tl.a($$('.den-tag',ph), [{opacity:0, transform:'translate(-50%,4px)'},{opacity:1, transform:'translate(-50%,0)'}], {at:420, st:T.stagger, d:T.engrave, e:C.out});
  tl.a($$('.den-played',ph), [{opacity:0, transform:'translateY(-6px) rotate(-8deg)'},{opacity:1, transform:'none'}], {at:520, st:T.stagger, d:T.card, e:C.out});
  tl.a($('.den-pennant',ph), [{transform:'rotate(-7deg)'},{transform:'rotate(4deg)'},{transform:'rotate(-2deg)'},{transform:'rotate(0)'}], {at:160, d:900, e:C.out});
  tl.a($$('.denhdr > *',ph), [{opacity:0, transform:'translateY(-6px)'},{opacity:1, transform:'none'}], {at:160, st:T.stagger, d:T.enter, e:C.emph});
  tl.a($('.den-card',ph), [{opacity:0, transform:'translateY(24px)'},{opacity:1, transform:'none'}], {at:420, d:T.enter, e:C.emph});
  tl.a($('.den-quest',ph), [{opacity:0, transform:'translateY(16px)'},{opacity:1, transform:'none'}], {at:465, d:T.enter, e:C.emph});
  /* idle starts at 700: breathe 1200 ms, phase offset 120 ms per character (2 cycles shown here) */
  $$('.den-fig .fb',ph).forEach((f,i)=> tl.a(f, [{transform:'translateX(-50%) scaleY(1)'},{transform:'translateX(-50%) scaleY(1.02)'},{transform:'translateX(-50%) scaleY(1)'}], {at:700+i*120, d:T.t2, e:C.sweep, it:2}));
});

/* 2. Go live (T2, 900) then joiners hop in */
mo('goLive', {screen:'denLive', next:'ready', t:'Go live', tier:'T2 900 ms + one hop per joiner'}, (ph, tl, rm) => {
  const key=$('.go-live-key',ph); const r=key.getBoundingClientRect(), pr=ph.getBoundingClientRect(); const cx=r.left-pr.left+r.width/2, cy=r.top-pr.top+r.height/2;
  const wash=document.createElement('div'); wash.className='wash'; ph.appendChild(wash);
  if(rm){ tl.a(wash,[{opacity:0},{opacity:.12},{opacity:0}],{at:0,d:240}); tl.f(p=>{ if(p>=1&&!ph.dataset.sw){ ph.dataset.sw=1; swapTo(ph,'ready'); } }, 240, 1); return; }
  tl.a(key, [{transform:'scale(1)'},{transform:'scale(.96)'}], {at:0, d:T.press, e:SP.snappy.e});
  tl.a(key, [{transform:'scale(.96)'},{transform:'scale(1)'}], {at:180, d:SP.release.d, e:SP.release.e, comp:'replace'});
  tl.a(wash, [{opacity:1, clipPath:`circle(0px at ${cx}px ${cy}px)`},{opacity:1, clipPath:`circle(900px at ${cx}px ${cy}px)`}], {at:180, d:T.enter, e:C.out});
  $$('.den-fig .fx',ph).forEach((f,i,a)=>{ const dir = i < a.length/2 ? 4 : -4; tl.a(f, [{transform:'rotate(0)'},{transform:`rotate(${dir}deg)`}], {at:180, d:240, e:C.out}); });
  /* the wash recedes to a 6% volt tint over the room, then clears once everyone has hopped in */
  tl.a(wash, [{opacity:1},{opacity:1, offset:.16},{opacity:.06, offset:.30},{opacity:.06, offset:.55},{opacity:0, offset:.80},{opacity:0}], {at:0, d:2900, e:C.lin});
  tl.f(p=>{ if(p>=1 && !ph.dataset.sw){ ph.dataset.sw=1; swapTo(ph,'ready',{noIdle:true}); } }, 540, 1);
  /* joiners hop in on the beat: Riya, Kabir, then you */
  tl.f((p,t)=>{ const seats=$$('.rd-seat',ph); if(!seats.length) return;
    seats.forEach((s,i)=>{ const t0=900+i*T.beat; const u=Math.max(0,Math.min(1,(t-t0)/560)); const fx=s.querySelector('.fx'); const tg=s.querySelector('.rd-tag'); const rd=s.querySelector('.rd-ready');
      if(!fx) return; const hop = u<=0?null: u<1 ? Math.sin(Math.PI*Math.min(1,u/0.8)) : 0;
      const sq = u>0.8&&u<1 ? Math.sin(Math.PI*(u-0.8)/0.2) : 0;
      fx.style.opacity = u<=0?0:1; fx.style.transform = u<=0?'translateY(40px)':`translateY(${(-hop*38).toFixed(1)}px) scale(${(1+sq*.08).toFixed(3)},${(1-sq*.12).toFixed(3)})`;
      if(tg){ tg.style.opacity = u<0.6?0:Math.min(1,(u-0.6)/0.3); }
      if(rd){ const v=s.dataset.k==='you'?0:1; rd.style.opacity = u<0.9?0:v; } }); }, 900, 1900);
});

/* 3. Countdown (3.0 s on the beat) */
mo('countdown', {screen:'countdown', t:'Countdown 3, 2, 1, Go', tier:'3000 ms (time is information)'}, (ph, tl, rm) => {
  const nums=$$('.cd-n',ph), go=$('.cd-go',ph), watch=$('.cd-watch',ph), arc=$('.cd-arc',ph), q=$('.cd-q',ph), scr=$('.cd-scrim',ph);
  nums.forEach(n=>n.style.opacity=0);
  if(rm){ nums.forEach((n,i)=>{ tl.a(n,[{opacity:0},{opacity:1}],{at:i*600,d:120}); tl.a(n,[{opacity:1},{opacity:0}],{at:i*600+480,d:120}); }); tl.a(go,[{opacity:0},{opacity:1}],{at:1800,d:120}); tl.a(q,[{opacity:0},{opacity:1}],{at:2400,d:120}); return; }
  tl.a(scr, [{opacity:0},{opacity:.45}], {at:0, d:1800, e:C.lin});
  nums.forEach((n,i)=>{ const at=i*T.beat;
    tl.a(n, [{opacity:0, transform:'scale(1.25)'},{opacity:1, transform:'scale(1)'}], {at, d:180, e:C.out});
    tl.a(n, [{opacity:1, transform:'scale(1)'},{opacity:0, transform:'scale(.92)'}], {at:at+460, d:140, e:C.leave, comp:'replace'});
    tl.a(watch, [{transform:`rotate(${i%2?1.5:-1.5}deg)`},{transform:`rotate(${i%2?-1.5:1.5}deg)`}], {at, d:T.beat, e:C.inOut});
    tl.a(arc, [{strokeDashoffset:1},{strokeDashoffset:0}], {at, d:T.beat, e:C.lin});
    $$('.cd-p',ph).forEach((p,j)=> tl.a(p, [{transform:'translateY(0) scale(1)'},{transform:'translateY(-8px) scale(1.04,.96)'},{transform:'translateY(0) scale(1)'}], {at:at+j*30, d:360, e:C.out}));
  });
  tl.a(watch, [{transform:'rotate(1.5deg)'},{transform:'rotate(0)'}], {at:1800, d:200, e:C.out});
  tl.a(go, [{opacity:0, transform:'scale(1.25)'},{opacity:1, transform:'scale(1)'}], {at:1800, d:180, e:C.out});
  const b=burstOf(ph); if(b){ b.ring(1800, 180, 300, 30, 150, {d:420, c:'#D2F000', w:4}).glints(1820, 180, 300, 8, 96, {st:20}); tl.f((p,t)=>b.draw(t), 0, 3000); }
  tl.a([watch, $('.cd-row',ph), $('.cd-cap',ph)], [{opacity:1, transform:'translateY(0)'},{opacity:0, transform:'translateY(-12px)'}], {at:2300, d:T.exit, e:C.exit});
  tl.a(scr, [{opacity:.45},{opacity:0}], {at:2300, d:300, e:C.out, comp:'replace'});
  tl.a(q, [{opacity:0, transform:'translateY(14px)'},{opacity:1, transform:'translateY(0)'}], {at:2400, d:T.glide, e:C.glide});
});

/* 4. Answer lock-in (T1, 320) and a friend's lock-in pennant */
mo('lockIn', {screen:'race', t:'Answer lock-in', tier:'T1 320 ms'}, (ph, tl, rm) => {
  const opts=$$('.opt',ph); const sel=opts[1]; const key=$('.rc-key',ph);
  sel.classList.remove('sel'); $('.clip',sel)?.remove();
  const clip=document.createElementNS('http://www.w3.org/2000/svg','svg'); clip.setAttribute('class','clip'); clip.setAttribute('viewBox','0 0 16 30'); clip.innerHTML='<path d="M5 2h6a3 3 0 0 1 3 3v19a4 4 0 0 1-8 0V8" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>'; sel.appendChild(clip);
  const kab=$('.lane[data-k="kabir"] .pen',ph), kabSub=$('.lane[data-k="kabir"] .who small',ph);
  kab.style.display='block';
  tl.f(p=>{ sel.classList.toggle('sel', p>=1); key.textContent = p>=1 ? 'Lock in B' : 'Pick an answer'; key.classList.toggle('off', p<1); }, 300, 1);
  if(rm){ tl.a(clip,[{opacity:0},{opacity:1}],{at:900,d:120}); tl.a(opts.filter(o=>o!==sel),[{opacity:1},{opacity:.6}],{at:900,d:120}); tl.a(kab,[{opacity:0},{opacity:1}],{at:1500,d:120}); return; }
  tl.a(sel, [{transform:'scale(1)'},{transform:'scale(.96)'},{transform:'scale(1)'}], {at:200, d:240, e:C.out});
  tl.a($('.lt',sel), [{transform:'translateY(0)'},{transform:'translateY(2px)'},{transform:'translateY(0)'}], {at:200, d:240, e:C.out});
  tl.a(key, [{transform:'scale(1)'},{transform:'scale(.96)'},{transform:'scale(1)'}], {at:800, d:240, e:C.out});
  tl.a(clip, [{opacity:0, transform:'translateY(-8px)'},{opacity:1, transform:'translateY(0)'}], {at:900, d:140, e:SP.snappy.e});
  tl.a(opts.filter(o=>o!==sel), [{opacity:1},{opacity:.6}], {at:900, d:160, e:C.out});
  tl.a($('.lane[data-k="you"] .tok .head',ph), [{transform:'rotate(0)'},{transform:'rotate(-3deg)'},{transform:'rotate(0)'}], {at:900, d:240, e:C.out});

  const live=$('.qd-live',ph); tl.f(p=>{ const v=QUEST.afterYou+(QUEST.target-QUEST.afterYou)*Math.min(1,p); live.textContent=Math.round(v); segsEl.forEach((s,i)=>{ const on=v>=(i+1)*per; s.classList.toggle('on',on); s.style.background = (!on && v>i*per) ? `linear-gradient(90deg,var(--ink2) ${(v-i*per)/per*100}%,var(--raised2) 0)` : ''; }); }, 120, 600);
  tl.a(wrap, [{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}], {at:700, d:300, e:C.out});
  segsEl.forEach((s,i)=> tl.a(s, [{transform:'translateY(0)', boxShadow:'0 0 0 0 rgba(210,240,0,0)'},{transform:'translateY(-1px)', boxShadow:'0 0 10px 2px rgba(210,240,0,.35)'},{transform:'translateY(0)', boxShadow:'0 0 0 0 rgba(210,240,0,0)'}], {at:760+i*T.stagger/2, d:300, e:C.out}));
  tl.a(wrap, [{opacity:1, transform:'scale(1)'},{opacity:0, transform:'scale(.6,.2)'}], {at:1080, d:200, e:C.exit, comp:'replace'});
  tl.a(seal, [{opacity:0, transform:'scale(1.4) rotate(-8deg)'},{opacity:1, transform:'scale(1) rotate(2deg)', offset:.5},{opacity:1, transform:'scale(1) rotate(0)'}], {at:1120, d:SP.celebrate.d, e:C.out});
  tl.a(title, [{opacity:0, clipPath:'inset(0 100% 0 0)'},{opacity:1, clipPath:'inset(0 0 0 0)'}], {at:1160, d:T.engrave, e:C.out});
  tl.a(sub, [{opacity:0, transform:'translateY(6px)'},{opacity:1, transform:'none'}], {at:1260, d:T.enter, e:C.emph});
  tl.a($$('.qd-heads > div',ph), [{opacity:0, transform:'translateY(10px) scale(.92)'},{opacity:1, transform:'none'}], {at:1300, st:T.stagger, d:SP.iconPop.d, e:SP.iconPop.e});
  tl.a(par, [{opacity:0, transform:'translateY(40px) rotate(-6deg)'},{opacity:1, transform:'translateY(0) rotate(0)'}], {at:1400, d:SP.celebrate.d, e:SP.celebrate.e});
  tl.a(key, [{opacity:0, transform:'translateY(12px)'},{opacity:1, transform:'none'}], {at:1600, d:T.enter, e:C.emph});
  const b=burstOf(ph); if(b){ b.glints(1140,180,212,12,110,{st:18}).ring(1100,180,212,40,150,{c:'#F2A93B',d:500}).bits(1120,180,212,16,{seed:31,sp:220,floor:322}); tl.f((p,t)=>b.draw(t),0,2600); }
  tl.f(()=>{},0,2200);
});

/* 11. Personal milestone (T3): 14 days */
mo('streakMilestone', {screen:'milestone', t:'Milestone: 14 days in a row', tier:'T3 2000 ms'}, (ph, tl, rm) => {
  const lk=$$('.ml-links .lk',ph), num=$('.ml-num',ph), mobi=$('.ml-mobi',ph), title=$('.ml-title',ph), sub=$('.ml-sub',ph), page=$('.ml-page',ph), spot=$('.ml-spot',ph);
  if(rm){ tl.a([...lk,num,mobi,title,sub,page],[{opacity:0},{opacity:1}],{at:0,d:120}); return; }
  tl.a(spot, [{opacity:.2},{opacity:1}], {at:0, d:300, e:C.glide});
  lk.forEach((l,i)=>{ const last=i===lk.length-1; tl.a(l, [{opacity:0, transform:`translate(${l.getAttribute('transform').match(/\(([^,]+)/)[1]}px,-18px) rotate(${last?-14:-6}deg)`},{opacity:1, transform:l.getAttribute('transform')+' rotate(0)'}], {at:120+i*70, d:last?520:300, e:last?SP.celebrate.e:C.out}); });
  tl.f(p=>{ num.textContent = p<0.45 ? '13' : '14'; }, 600, 500);
  tl.a(num, [{transform:'scale(1)'},{transform:'scale(1)'},{transform:'scale(1.25)', offset:.46},{transform:'scale(1)'}], {at:600, d:SP.celebrate.d+200, e:C.out});
  tl.a(mobi, [{opacity:0, transform:'translateY(18px) scale(.92)'},{opacity:1, transform:'none'}], {at:820, d:SP.iconPop.d, e:SP.iconPop.e});
  tl.a([title,sub], [{opacity:0, transform:'translateY(8px)'},{opacity:1, transform:'none'}], {at:1000, st:80, d:T.enter, e:C.emph});
  tl.a(page, [{opacity:0, transform:'perspective(600px) rotateX(70deg)'},{opacity:1, transform:'perspective(600px) rotateX(0)'}], {at:1300, d:T.emph, e:C.emph});
  const b=burstOf(ph); if(b){ b.glints(940,180,262,8,60,{st:24}).bits(900,180,262,20,{seed:41,sp:240,a0:-170,a1:-10,floor:318,pal:['#EDE5D3','#F2A93B','#D2F000']}); tl.f((p,t)=>b.draw(t),0,2400); }
  tl.f(()=>{},0,2000);
});

/* =====================================================================
   7. MOUNT, NAVIGATE, PLAY
   ===================================================================== */
let THEME = Q.get('theme')||'night'; const ph = $('#ph');
function mount(id, o={}){ ph.className = `phone ${THEME}`; delete ph.dataset.sw; delete ph.dataset.w; delete ph.dataset.ws; ph.__w2=null; ph.__wrong=null;
  ph.innerHTML = `<div class="scr" data-s="${id}">${S[id](THEME)}</div>`; ph.dataset.s=id; wire(); if(!o.noIdle) idle(); markSide(id); }
function swapTo(ph, id, o={}){ const keep=[...ph.querySelectorAll('.wash')]; mount(id, o); keep.forEach(w=>ph.appendChild(w)); }
function wire(){ $$('[data-go]',ph).forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); if(window.__TL&&window.__TL.raf){ window.__TL.skip(); return; }
  const m=b.dataset.moment; const to=b.dataset.go; if(m && MOMENTS[m]){ if(MOMENTS[m].screen===ph.dataset.s) play(m); else { mount(MOMENTS[m].screen||to,{noIdle:true}); play(m); } } else { mount(to); const em=Object.entries(MOMENTS).find(([k,v])=>v.screen===to && v.auto); } })); }
ph.addEventListener('click',()=>{ if(window.__TL&&window.__TL.raf) window.__TL.skip(); });   /* any tap skips a show moment to its end in 200 ms */
let idleTimer=0; function idle(){ clearTimeout(idleTimer); if(RM()) return;
  $$('.den-fig .fb',ph).forEach((f,i)=>f.animate([{transform:'translateX(-50%) scaleY(1)'},{transform:'translateX(-50%) scaleY(1.02)'},{transform:'translateX(-50%) scaleY(1)'}],{duration:T.t2, delay:i*120, iterations:Infinity, easing:C.sweep}));
  idleTimer=setTimeout(()=>ph.getAnimations({subtree:true}).forEach(a=>{ if(a.effect.getComputedTiming().iterations===Infinity) a.cancel(); }), 10000); }   /* loops stop 10 s after the last touch */
function build(m){ const M_=MOMENTS[m]; const tl=new TL(); M_.fn(ph, tl, RM()); return tl; }
function play(m, done){ if(window.__TL) window.__TL.end(); const tl=build(m); window.__TL=tl; tl.play(()=>{ done&&done(); }); return tl; }
/* capture API for the recorder */
window.__mount = (id, theme) => { THEME=theme||THEME; mount(id,{noIdle:true}); };
window.__prep = (m, theme) => { THEME=theme||THEME; if(window.__TL) window.__TL.end(); mount(MOMENTS[m].screen,{noIdle:true}); const tl=build(m); window.__TL=tl; tl.seek(0); return tl.dur; };
window.__seek = t => { window.__TL.seek(t); };
window.__still = (id, theme) => { THEME=theme||THEME; const st=SCREEN_META[id].still; if(!st){ mount(id,{noIdle:true}); return 0; } if(window.__TL) window.__TL.end(); mount(id,{noIdle:true}); const tl=build(st[0]); window.__TL=tl; tl.seek(st[1]==='end'?tl.dur:st[1]); return 1; };
window.__play = () => new Promise(r=>{ window.__TL.play(r); });
window.__screens = () => Object.entries(SCREEN_META).map(([id,m])=>({id,...m}));
window.__moments = () => Object.entries(MOMENTS).map(([id,m])=>({id,screen:m.screen,t:m.t,tier:m.tier}));

/* side panel */
function markSide(id){ $$('#side button[data-s]').forEach(b=>b.classList.toggle('on', b.dataset.s===id)); }
function side(){ const sd=$('#side'); if(CAPTURE){ sd.innerHTML=''; return; }
  sd.innerHTML = `<h1>Mob v3, Den Arena</h1><p>Clickable prototype. Tap the keys to move through the loop; a moment plays on its screen. Any tap skips a moment. Reduced motion: your system setting, or <a href="?rm=1" style="color:#D2F000">?rm=1</a>.</p>
    <div class="tg"><button id="tn">Night</button><button id="td">Day</button></div>
    <h2>Signature moments</h2>${Object.entries(MOMENTS).map(([k,m])=>`<button data-m="${k}">${m.t}<br><span style="color:#8A8375;font-size:12px">${m.tier}</span></button>`).join('')}
    <h2>Screens</h2>${Object.entries(SCREEN_META).map(([k,m])=>`<button data-s="${k}">${m.n} ${m.t}</button>`).join('')}`;
  $$('#side button[data-s]').forEach(b=>b.onclick=()=>mount(b.dataset.s));
  $$('#side button[data-m]').forEach(b=>b.onclick=()=>{ mount(MOMENTS[b.dataset.m].screen,{noIdle:true}); play(b.dataset.m); });
  $('#tn').onclick=()=>{ THEME='night'; mount(ph.dataset.s); }; $('#td').onclick=()=>{ THEME='day'; mount(ph.dataset.s); }; }
side();
const start = Q.get('s') || 'denQuiet';
if(!CAPTURE){ mount(start,{noIdle:true}); if(Q.get('m')) play(Q.get('m')); else if(start==='denQuiet') play('enterDen'); }
else mount(start,{noIdle:true});
</script>
