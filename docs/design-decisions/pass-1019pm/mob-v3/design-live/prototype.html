<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mob v3 Den Live</title>
<meta name="description" content="Clickable motion prototype of the Mob v3 'Den Live' direction. 360 x 780 dp, Night and Day. Every name, mark and time is an illustrative fixture.">
<style>
@font-face{font-family:'BCond';src:url(assets/fonts/BricolageCondensed-Bold.ttf);font-weight:700}
@font-face{font-family:'BHead';src:url(assets/fonts/BricolageHeadline-SemiBold.ttf);font-weight:600}
@font-face{font-family:'BTitle';src:url(assets/fonts/BricolageTitle-SemiBold.ttf);font-weight:600}
@font-face{font-family:'Hanken';src:url(assets/fonts/HankenGrotesk-Regular.ttf);font-weight:400}
@font-face{font-family:'Hanken';src:url(assets/fonts/HankenGrotesk-Medium.ttf);font-weight:500}
@font-face{font-family:'Hanken';src:url(assets/fonts/HankenGrotesk-SemiBold.ttf);font-weight:600}
@font-face{font-family:'Hanken';src:url(assets/fonts/HankenGrotesk-Bold.ttf);font-weight:700}

/* ---------- tokens: exact app values (mm_colors.dart), Night default ---------- */
.night{
  --ground:#12110E; --raised:#1B1A16; --raised2:#25231E; --sunken:#0D0C0A; --floor:#0F0E0C;
  --line:#312E27; --lineStrong:#4A453B; --ink:#F4F0E6; --ink2:#BDB6A6; --ink3:#A09989; --ink4:#6A645A;
  --volt:#D2F000; --voltInk:#0B1000; --voltEdge:#9DB400; --accentText:#D2F000; --voltGlow:rgba(210,240,0,.14);
  --good:#C6E86E; --goodSurf:#1C2410; --goodBorder:#5E7A1E; --wrongSurf:#2A1614; --wrongBorder:#7D3128; --wrongText:#FFC9C2;
  --lamp:#F2A93B; --lampA:.26; --rim:#F2B865;
  --glass:rgba(27,26,22,.72); --edge:rgba(255,246,228,.10); --scrim:rgba(8,7,5,.62);
  --shadow:0 1px 1px rgba(0,0,0,.25),0 18px 36px -20px rgba(0,0,0,.45);
  --wall:#171511; --grid:rgba(244,240,230,.035); --desk:#2A251F; --deskTop:#3A332A; --deskEdge:#4A4136;
  --paper:#EDE5D3; --paperInk:#1E1B15; --paperLine:#CFC5AF; --paperEdge:#BDB29C;
  --sky:#1A202C; --moon:#F4F0E6; --shade:#E9DFC8; --shadeIn:#7A5A2A;
  --m-teal:#3FC6A8; --m-rose:#FF7A8A; --m-blue:#6E8BFF; --m-violet:#B98CFF; --m-amber:#F2A93B; --m-sky:#56B8F0; --m-coral:#E58E5A; --m-green:#9FBF4A;
  --tint:#1B1A16; color-scheme:dark;
}
.day{
  --ground:#F3EFE6; --raised:#FFFDF8; --raised2:#E9E4D8; --sunken:#EAE5DA; --floor:#EEEAE0;
  --line:#D8D1C2; --lineStrong:#BDB4A2; --ink:#17150F; --ink2:#454036; --ink3:#655F53; --ink4:#8A8375;
  --volt:#D2F000; --voltInk:#0B1000; --voltEdge:#9DB400; --accentText:#526700; --voltGlow:rgba(210,240,0,.22);
  --good:#3D6600; --goodSurf:#EEF5DC; --goodBorder:#7FA02A; --wrongSurf:#FBE9E7; --wrongBorder:#B93225; --wrongText:#B0291F;
  --lamp:#F2C46B; --lampA:.17; --rim:#FFFFFF;
  --glass:rgba(255,253,248,.80); --edge:rgba(255,255,255,.85); --scrim:rgba(23,21,15,.38);
  --shadow:0 1px 2px rgba(42,32,16,.06),0 14px 30px -18px rgba(42,32,16,.18);
  --wall:#ECE5D6; --grid:rgba(23,21,15,.045); --desk:#CDBB9C; --deskTop:#DDCFB5; --deskEdge:#BBA683;
  --paper:#FFFDF8; --paperInk:#17150F; --paperLine:#E2DACB; --paperEdge:#CFC6B4;
  --sky:#CFE5F0; --moon:#F2C46B; --shade:#FFFDF8; --shadeIn:#E2B866;
  --m-teal:#0E7C66; --m-rose:#B4243A; --m-blue:#3550C8; --m-violet:#6A3BC4; --m-amber:#9A5B00; --m-sky:#0B6A9E; --m-coral:#A14A12; --m-green:#55741A;
  --tint:#FFFDF8; color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0A0A09;color:#F4F0E6;font-family:'Hanken',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.shot{background:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num,.fig{font-variant-numeric:tabular-nums}

/* ---------- prototype chrome (not part of the design) ---------- */
.proto{display:flex;gap:32px;padding:24px;min-height:100vh;align-items:flex-start;justify-content:center}
.nav{width:260px;flex:none;font:500 13px/18px 'Hanken';color:#BDB6A6;position:sticky;top:24px}
.nav h1{font:600 20px/24px 'BTitle';color:#F4F0E6;margin-bottom:4px}
.nav p{margin-bottom:14px;color:#A09989}
.nav h2{font:700 12px/16px 'Hanken';color:#F4F0E6;margin:16px 0 6px}
.nav .lnk{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:10px;color:#BDB6A6}
.nav .lnk:hover,.nav .lnk:focus-visible{background:#1B1A16;color:#F4F0E6;outline:none}
.nav .lnk.on{background:#25231E;color:#F4F0E6}
.nav .row{display:flex;gap:6px;flex-wrap:wrap}
.nav .tg{padding:6px 12px;border-radius:999px;border:1px solid #4A453B;color:#F4F0E6}
.nav .tg.on{background:#D2F000;color:#0B1000;border-color:#D2F000}
.cues{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;z-index:999}
.cue{font:600 12px/16px 'Hanken';background:#25231E;color:#F4F0E6;border:1px solid #4A453B;padding:6px 10px;border-radius:10px}
.phonewrap{position:relative}
.cap{font:500 12px/16px 'Hanken';color:#A09989;margin-top:10px;max-width:360px}

/* ---------- phone ---------- */
.phone{position:relative;width:360px;height:780px;overflow:hidden;background:var(--ground);color:var(--ink);border-radius:28px;flex:none;isolation:isolate}
body.shot .phone{border-radius:0}
.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 24px;font:600 13px/1 'Hanken';color:var(--ink);position:relative;z-index:30}
.status .ico{display:flex;gap:5px;align-items:center}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.pad{padding:0 16px}
.t-title{font:600 22px/27px 'BTitle';letter-spacing:-.2px}
.t-head{font:600 28px/31px 'BHead';letter-spacing:-.4px}
.t-disp{font:600 36px/38px 'BHead';letter-spacing:-.6px}
.t-sub{font:700 17px/22px 'Hanken'}
.t-body{font:400 16px/24px 'Hanken'}
.t-small{font:400 14px/20px 'Hanken'}
.t-cap{font:400 13px/18px 'Hanken'}
.t-label{font:600 13px/18px 'Hanken'}
.fig{font-family:'BCond';font-weight:700;letter-spacing:-.5px}
.ink2{color:var(--ink2)} .ink3{color:var(--ink3)} .acc{color:var(--accentText)}
.key{height:56px;border-radius:999px;background:var(--volt);color:var(--voltInk);font:600 16px/20px 'Hanken';display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 var(--voltEdge),0 10px 22px -14px rgba(157,180,0,.9);position:relative;transition:transform 100ms cubic-bezier(.23,1,.32,1)}
.key:active{transform:scale(.96)}
.key2{height:48px;border-radius:999px;background:var(--raised);color:var(--ink);font:600 15px/20px 'Hanken';display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--lineStrong);padding:0 18px;white-space:nowrap}
.tbtn{height:44px;display:flex;align-items:center;justify-content:center;gap:6px;font:600 15px/20px 'Hanken';color:var(--ink2);text-decoration:underline;text-decoration-color:var(--lineStrong);text-underline-offset:4px;width:100%}
.iconbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink)}
.hair{height:1px;background:var(--line)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--raised2);font:600 13px/1 'Hanken';color:var(--ink2);white-space:nowrap}
.pro{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--lineStrong);font:700 12px/1 'Hanken';color:var(--ink2)}
.sec{font:700 13px/18px 'Hanken';color:var(--ink3);margin:0 0 8px}
.topbar{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 6px;position:relative;z-index:6}
.topbar .grow{flex:1;min-width:0}
.topbar .tt{font:600 18px/22px 'BTitle'}
.topbar .st{font:400 13px/18px 'Hanken';color:var(--ink3)}

/* bottom bar: the app's own (owner H5: keep) */
.bar{position:absolute;left:16px;right:16px;bottom:12px;height:64px;border-radius:32px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-around;z-index:20}
.bar .slot{width:58px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12px/15px 'Hanken';color:var(--ink2)}
.bar .slot.on{background:var(--raised2);color:var(--ink);font-weight:700}
.night .bar .slot.on svg{color:var(--volt)}
.bar .start{width:64px;height:64px;border-radius:50%;background:var(--volt);color:var(--voltInk);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 12px/14px 'Hanken';margin-top:-4px;box-shadow:0 0 0 1px var(--voltEdge),0 10px 20px -10px rgba(0,0,0,.5)}

/* ---------- the den ---------- */
.den{position:relative;overflow:hidden;background:var(--wall);flex:none}
.den .grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;background-position:-1px -1px}
.den .cone{position:absolute;left:0;right:0;top:0;transform-origin:50% 0;pointer-events:none}
.den .cone i{position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--lamp) calc(var(--lampA)*140%),transparent),color-mix(in srgb,var(--lamp) calc(var(--lampA)*45%),transparent) 70%,transparent);clip-path:polygon(43% 0,57% 0,94% 100%,6% 100%)}
.den .pool{position:absolute;left:50%;width:330px;height:64px;margin-left:-165px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--lamp) calc(var(--lampA)*160%),transparent),transparent);pointer-events:none}
.den .lamp{position:absolute;left:50%;top:0;width:76px;margin-left:-38px;z-index:3}
.den .deskt{position:absolute;left:0;right:0;background:var(--deskTop);height:12px}
.den .deskf{position:absolute;left:0;right:0;bottom:0;background:var(--desk);border-top:1px solid var(--deskEdge)}
.den .deskf::after{content:'';position:absolute;left:0;right:0;top:0;height:100%;background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.05) 46px 47px)}
.ch{position:absolute;transform-origin:50% 100%;z-index:4}
.cimg{position:absolute;left:50%;bottom:0;height:100%;width:auto;max-width:none;transform:translateX(-50%);display:block;user-select:none;pointer-events:none}
.ch .br{position:relative;height:100%}
.ch .br{transform-origin:50% 92%}
.night .ch.lit .cimg{filter:drop-shadow(0 -1px 0 rgba(242,184,101,.35))}

.ch.away .cimg{filter:saturate(.55) brightness(.6)}
.day .ch.away .cimg{filter:saturate(.5) brightness(.95) opacity(.6)}
.shadow{position:absolute;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.42),transparent);z-index:3;transform-origin:50% 50%}
.day .shadow{background:radial-gradient(closest-side,rgba(59,42,18,.28),transparent)}
.ntag{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:5}
.ntag .nm{font:700 14px/18px 'Hanken';color:var(--ink);white-space:nowrap}
.here{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:999px;background:var(--raised2);font:600 12px/1 'Hanken';color:var(--ink);white-space:nowrap;border:1px solid var(--line)}
.here i{width:7px;height:7px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 2px color-mix(in srgb,var(--volt) 25%,transparent)}
.day .here i{background:#7FA02A}
.stampt{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:6px;background:var(--volt);color:var(--voltInk);font:700 12px/1 'Hanken';transform:rotate(-4deg);box-shadow:0 0 0 1.5px var(--voltInk) inset,0 3px 8px -4px rgba(0,0,0,.5)}
.pennant{position:absolute;z-index:2}
.shelf{position:absolute;z-index:2}
.seatgh{position:absolute;border:2px dashed var(--lineStrong);border-radius:22px 22px 10px 10px;display:grid;place-items:center;color:var(--ink3);z-index:3}

/* ---------- paper pieces ---------- */
.ticket{position:relative;background:var(--raised);border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);
  -webkit-mask:radial-gradient(circle 9px at 0 var(--notch,62px),transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% var(--notch,62px),transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 9px at 0 var(--notch,62px),transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% var(--notch,62px),transparent 98%,#000) right/51% 100% no-repeat}
.perf{position:absolute;left:14px;right:14px;height:0;border-top:2px dashed var(--line)}
.sticker{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 8px;border-radius:12px;background:var(--paper);color:var(--paperInk);font:700 13px/1 'Hanken';box-shadow:0 0 0 2px #FFFDF8,0 6px 14px -8px rgba(0,0,0,.6);white-space:nowrap}
.day .sticker{box-shadow:0 0 0 2px #FFFFFF,0 0 0 3px var(--line),0 6px 14px -8px rgba(42,32,16,.35)}
.sticker svg{flex:none}
.head{display:inline-block;border-radius:50%;flex:none;position:relative;overflow:hidden;background-repeat:no-repeat}
.head.ring{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--rc)}
.lockln{display:flex;align-items:center;gap:6px;font:500 13px/18px 'Hanken';color:var(--ink3)}

/* ---------- race strip ---------- */
.strip{position:relative;height:132px;margin:0 16px;border-radius:22px;background:var(--wall);border:1px solid var(--line);overflow:hidden}
.strip .grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
.strip .sglow{position:absolute;left:10%;right:10%;top:-40px;height:150px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--lamp) calc(var(--lampA)*120%),transparent),transparent)}
.strip .ruler{position:absolute;left:12px;right:12px;top:98px;height:20px;border-radius:5px;background:var(--paper);box-shadow:0 6px 10px -6px rgba(0,0,0,.5);background-image:repeating-linear-gradient(90deg,var(--paperLine) 0 1px,transparent 1px 8px);background-size:100% 6px;background-repeat:repeat-x;background-color:var(--paper)}
.strip .rq{position:absolute;top:100px;width:22px;height:16px;margin-left:-11px;border-radius:5px;font:700 12px/16px 'Hanken';text-align:center;color:#5C5545;z-index:2}
.strip .rq.done{background:#1E1B15;color:#FFFDF8}
.strip .flag{position:absolute;right:30px;top:66px;width:26px;height:32px;z-index:2}
.strip .rf{position:absolute;top:18px;width:46px;margin-left:-23px;display:flex;flex-direction:column;align-items:center;z-index:3}
.strip .rf .rl{font:700 12px/14px 'Hanken';color:var(--ink);white-space:nowrap;margin-bottom:2px}
.strip .rf .rc{width:46px;height:58px;position:relative;transform-origin:50% 100%}

.strip .rf .rs{position:absolute;bottom:-3px;left:8px;right:8px;height:6px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.4),transparent)}
.strip .rf.ghost .rc{opacity:.42;filter:grayscale(.4)}
.strip .rf .pen{position:absolute;left:-14px;top:4px;width:26px;height:40px;z-index:4}
.strip .rf.ghost .rl{color:var(--ink3);font-weight:600}
/* ---------- question ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:center;font:600 13px/18px 'Hanken';color:var(--ink3)}
.qtext{font:400 17px/26px 'Hanken';color:var(--ink)}
.opt{position:relative;display:flex;align-items:center;gap:12px;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--raised);padding:0 14px;font:600 16px/20px 'Hanken';color:var(--ink);width:100%;text-align:left}
.opt .bb{width:26px;height:26px;border-radius:50%;border:2px solid var(--lineStrong);display:grid;place-items:center;font:700 12px/1 'Hanken';color:var(--ink3);flex:none}
.opt.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.opt.sel .bb{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.opt.right{background:var(--goodSurf);border-color:var(--goodBorder)}
.opt.right .bb{background:var(--good);border-color:var(--good);color:var(--ground)}
.opt.wrong{background:var(--wrongSurf);border-color:var(--wrongBorder)}
.opt.wrong .bb{background:transparent;border-color:var(--wrongBorder);color:var(--wrongText)}
.opt .clip{position:absolute;right:12px;top:-8px}
.opt .delta{margin-left:auto;font:700 15px/1 'BCond';color:var(--ink2)}
.tickp{position:absolute;right:16px;top:50%;margin-top:-11px}

/* ---------- podium ---------- */
.pblock{position:absolute;bottom:0;z-index:2;border-radius:12px 12px 0 0;background:var(--paper);transform-origin:50% 100%;box-shadow:inset 0 -14px 24px -18px rgba(0,0,0,.35)}
.night .pblock{background:#E4DBC6}
.pblock .pn{position:absolute;left:0;right:0;top:12px;text-align:center;font:700 34px/1 'BCond';color:#1E1B15}
.pblock .fold{position:absolute;right:0;top:0;width:0;height:0}
.pblock .sheen{position:absolute;inset:0;border-radius:12px 12px 0 0;overflow:hidden}
.pblock .sheen i{position:absolute;top:-20%;bottom:-20%;width:50%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,236,200,.85),transparent);transform:skewX(-14deg)}
.pname{position:absolute;text-align:center;transform:translateX(-50%);white-space:nowrap}
.pname b{display:block;font:700 15px/19px 'Hanken';color:var(--ink)}
.pname span{font:700 22px/24px 'BCond';color:var(--ink)}
.pname .row1{display:block}
.pname em{font:500 13px/18px 'Hanken';font-style:normal;color:var(--ink3)}

/* ---------- particles ---------- */
.bit{position:absolute;width:7px;height:5px;border-radius:1px;z-index:9;pointer-events:none}
.glint{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:9;pointer-events:none}

/* ---------- sheets and lists ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ground);border-radius:32px 32px 0 0;box-shadow:0 -20px 40px -20px rgba(0,0,0,.5);z-index:25}
.grab{width:40px;height:4px;border-radius:2px;background:var(--lineStrong);margin:10px auto 0}
.lrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0}
.lrow .ic{width:40px;height:40px;border-radius:12px;background:var(--raised2);display:grid;place-items:center;color:var(--ink);flex:none}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font:700 15px/20px 'Hanken'}
.lrow .tx span{display:block;font:400 13px/18px 'Hanken';color:var(--ink3)}
.lrow.locked .ic{color:var(--ink3)}
.lrow.locked .tx b{color:var(--ink2)}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--raised2);gap:4px}
.seg div{flex:1;height:36px;border-radius:999px;display:grid;place-items:center;font:600 14px/1 'Hanken';color:var(--ink2)}
.seg div.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.fmt{border-radius:18px;border:1px solid var(--line);background:var(--raised);padding:12px;display:flex;flex-direction:column;gap:6px;min-height:96px}
.fmt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.fmt b{font:700 15px/20px 'Hanken'} .fmt span{font:400 13px/18px 'Hanken';color:var(--ink3)}
.cmp{width:100%;border-collapse:collapse;font:500 13.5px/18px 'Hanken'}
.cmp td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cmp td:nth-child(2),.cmp td:nth-child(3){width:64px;text-align:center;color:var(--ink2)}
.cmp th{font:700 13px/18px 'Hanken';color:var(--ink3);text-align:center;padding-bottom:6px}
.cmp th:first-child{text-align:left}
.qbar{position:relative;height:14px;border-radius:999px;background:var(--raised2);overflow:hidden;display:flex;gap:2px}
.qbar i{display:block;height:100%;background:var(--volt);border-radius:2px}
.qbar i:first-child{border-radius:999px 2px 2px 999px}
.code6{display:flex;gap:6px}
.code6 b{width:44px;height:56px;border-radius:12px;background:var(--raised);border:1px solid var(--lineStrong);display:grid;place-items:center;font:700 30px/1 'BCond';color:var(--ink)}
.code6 b.gap{margin-left:8px}
.code6 b.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.link7{display:flex;gap:4px;align-items:flex-end}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal span{font:600 11px/14px 'Hanken';color:var(--ink3);padding-bottom:2px}
.cal i{height:30px;border-radius:9px;font:600 12px/30px 'Hanken';font-style:normal;color:var(--ink3);position:relative}
.cal i.p{background:var(--raised2);color:var(--ink)}
.cal i.c{background:color-mix(in srgb,var(--volt) 20%,var(--raised2));color:var(--ink);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--volt) 70%,transparent)}
.day .cal i.c{background:#E7EFC6;box-shadow:inset 0 -2px 0 #9DB400}
.cal i.r{background:var(--raised2);color:var(--ink2);border:1px dashed var(--lineStrong)}
.cal i.t{border:2px solid var(--ink);color:var(--ink);line-height:26px}
.cd-under .key,.cd-under .tbtn,.cd-under [data-sticker]{visibility:hidden}
.skipbtn{position:absolute;right:12px;top:40px;z-index:40;height:32px;padding:0 12px;border-radius:999px;background:var(--raised2);font:600 13px/1 'Hanken';color:var(--ink2);border:1px solid var(--line)}
.wrapline{text-wrap:pretty}
</style>
</head>
<body>
<div id="app"></div>
<div class="cues" id="cues" aria-hidden="true"></div>
<script>
/* =====================================================================
   MOB v3, "DEN LIVE". Clickable motion prototype.
   Every name, mark and time is an illustrative fixture, consistent on
   every screen. Monday 19 Oct. Chai Circle, Accountancy, 4 members in
   join order: Aarav (you, Free plan), Riya (Pro), Kabir, Zoya.
   Live sprint, opened by Riya at 8:02 PM; in the room: Riya, Kabir, you.
   Answers: Q1 B, Q2 A, Q3 B, Q4 C, Q5 D. CUET marks: +5, -1, 0.
     Riya  r s r r r  = 20 marks, finished in 2:10
     You   r r r w r  = 19 marks
     Kabir r s r w r  = 14 marks
   Personal chain 12 days (best 23), rest pass used Friday 16 Oct.
   Mob chain 4 weeks (best 6). Quest this week 41 of 60 questions.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const THEME0 = Q.get('theme') || 'night';
const SHOT = Q.get('shot') === '1';
const RM = Q.get('rm') === '1' || (Q.get('rm') !== '0' && matchMedia('(prefers-reduced-motion: reduce)').matches);
const CUES = Q.get('cues') !== '0';
if (SHOT) document.body.classList.add('shot');

/* ---------- characters: loaded from files so they can be swapped ----------
   A generated image at assets/chars/<file>.webp wins (one image for both
   themes). Otherwise the paper-folk fallback assets/chars/<theme>/<file>.png. */
const M = {
  you:   {name:'You',   real:'Aarav', ch:'dart',   col:'sky'},
  riya:  {name:'Riya',  ch:'patang', col:'rose'},
  kabir: {name:'Kabir', ch:'naav',   col:'blue'},
  zoya:  {name:'Zoya',  ch:'cutting', col:'coral'},
};
let theme = THEME0;
const charSrc = (file) => `assets/chars/${file}.webp`;
const charFallback = (file) => `assets/chars/${theme}/${file}.png`;
function charImg(file, cls=''){ return `<img class="cimg ${cls}" alt="" src="${charSrc(file)}" onerror="this.onerror=null;this.src='${charFallback(file)}'">`; }
const pose = (m, p) => M[m].ch; /* the generated set has one pose per character; poses come later */
/* head crop: a disc showing the top of the character */
function head(m, s=32, o={}){
  const file = o.file || M[m]?.ch || m;
  const col = o.col || (M[m] ? `var(--m-${M[m].col})` : 'var(--ink4)');
  return `<span class="head ${o.ring?'ring':''}" style="width:${s}px;height:${s}px;--rc:${col};background-color:color-mix(in srgb,${col} 26%,var(--raised2));${o.style||''}"><img alt="" src="${charSrc(file)}" onerror="this.onerror=null;this.src='${charFallback(file)}'" style="position:absolute;height:${s*1.75}px;width:auto;max-width:none;left:50%;top:${-s*.2}px;transform:translateX(-50%)"></span>`;
}

/* ---------- icons (lucide-style, 2 dp stroke) ---------- */
const I = {
  today:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/>',
  practice:'<circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M10 3h4M12 3v3.5"/>',
  mob:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="16.5" cy="9" r="2.6"/><path d="M15.6 14.1c2.7.1 4.9 2 4.9 4.9"/>',
  you:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>', back:'<path d="M15 5l-7 7 7 7"/>', down:'<path d="M7 10l5 5 5-5"/>', right:'<path d="M9 5l7 7-7 7"/>',
  lock:'<rect x="6" y="11" width="12" height="9" rx="2.5"/><path d="M8.5 11V8.5a3.5 3.5 0 0 1 7 0V11"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  sprint:'<path d="M3.5 12.5L20 5l-5.5 15-3.2-6.3z"/><path d="M11.3 13.7L20 5"/>',
  race:'<circle cx="12" cy="13.5" r="7"/><path d="M12 13.5l3-3M10 3h4"/>',
  custom:'<path d="M5 7h9M18 7h1M5 17h3M12 17h7"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/>',
  paper:'<rect x="5.5" y="3.5" width="13" height="17" rx="2"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/>',
  mock:'<rect x="6" y="3.5" width="12" height="16" rx="2"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/><path d="M4 7v12.5a1.5 1.5 0 0 0 1.5 1.5H15"/>',
  rematch:'<path d="M5 11a7 7 0 0 1 12-4.6L19 8M19 4v4h-4M19 13a7 7 0 0 1-12 4.6L5 16M5 20v-4h4"/>',
  ghost:'<path d="M6 20V11a6 6 0 0 1 12 0v9l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5z"/><circle cx="10" cy="11" r=".6" fill="currentColor"/><circle cx="14" cy="11" r=".6" fill="currentColor"/>',
  room:'<path d="M4 20h16M6 20V9l6-5 6 5v11"/><path d="M10 20v-5h4v5"/>',
  hand:'<path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V5a1.5 1.5 0 0 1 3 0v6M14 11V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5A5.5 5.5 0 0 1 6 17.2L4.5 14a1.4 1.4 0 0 1 2.3-1.5L8 14"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  sound:'<path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  share:'<circle cx="18" cy="5.5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="18.5" r="2.4"/><path d="M8.2 10.9l7.6-4.2M8.2 13.1l7.6 4.2"/>',
  copy:'<rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/>',
  scan:'<path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3M7 12h10"/>',
  chat:'<path d="M20 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-4.2A8 8 0 1 1 20 11.5z"/>',
  moon:'<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>',
  sticker:'<path d="M20 12V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6"/><path d="M20 12l-8 8M20 12h-5a3 3 0 0 0-3 3v5"/>',
  calendar:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  timer:'<circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V9.5M10 3h4"/>',
  bell:'<path d="M5 17h14M6.5 17a5.5 5.5 0 0 1 11 0M12 9.5V7.5M10.5 7.5h3"/><path d="M4 20h16"/>',
  insight:'<path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/>',
  theme:'<circle cx="12" cy="12" r="8"/><path d="M12 4v16M12 4a8 8 0 0 1 0 16"/>',
  flag:'<path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/>',
};
const ico = (n, s=24, sw=2, extra='') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${extra} aria-hidden="true">${I[n]}</svg>`;
/* four-point glint (EmblemSparkle shape) */
const glintSVG = (c='#FFF4D6') => `<svg viewBox="-10 -10 20 20" width="14" height="14"><path d="M0-10C1 -2 2 -1 10 0C2 1 1 2 0 10C-1 2 -2 1 -10 0C-2 -1 -1 -2 0-10Z" fill="${c}"/></svg>`;
/* paper clip */
const clipSVG = `<svg width="14" height="30" viewBox="0 0 14 30"><path d="M4 9V5a3 3 0 0 1 6 0v17a5 5 0 0 1-10 0V9" fill="none" stroke="#8F8A80" stroke-width="2.2" stroke-linecap="round"/><path d="M4 9V5a3 3 0 0 1 6 0v17a5 5 0 0 1-10 0V9" fill="none" stroke="#E9E4D8" stroke-width=".8" stroke-linecap="round" transform="translate(-.6 -.4)"/></svg>`;

function statusBar(time='8:02 PM'){ return `<div class="status"><span class="num">${time}</span><span class="ico">
  <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5L.6 3.8a10.5 10.5 0 0 1 14.8 0z" fill="currentColor"/></svg>
  <svg width="14" height="12" viewBox="0 0 14 12"><path d="M13 .5v11H1z" fill="currentColor"/></svg>
  <svg width="9" height="14" viewBox="0 0 9 14"><rect x="0" y="1.5" width="9" height="12.5" rx="1.6" fill="currentColor"/><rect x="2.5" y="0" width="4" height="2" rx=".6" fill="currentColor"/></svg></span></div>`; }
function bottomBar(active='mob'){
  const s=(k,l)=>`<div class="slot ${active===k?'on':''}">${ico(k,24,1.8)}<span>${l}</span></div>`;
  return `<nav class="bar" aria-label="Main">${s('today','Today')}${s('practice','Practice')}<div class="start"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Start</div>${s('mob','Mob')}${s('you','You')}</nav>`;
}

/* ---------- the Mob pennant (weekly chain): stitched paper, one volt stitch per week ---------- */
function pennantSVG(n=4, o={}){
  const w=o.w||58, h=o.h||78, st=o.stitches??n;
  let stitches='';
  for(let i=0;i<Math.min(st,8);i++){ const x=10+i*((w-20)/7); stitches+=`<path class="stitch s${i}" d="M${x} ${h-30} l4 -4" stroke="#D2F000" stroke-width="2.6" stroke-linecap="round"/>`; }
  return `<svg width="${w}" height="${h+8}" viewBox="0 -8 ${w} ${h+8}" overflow="visible" aria-hidden="true">
    <path d="M${w/2} -8 L${w/2} 0" stroke="var(--ink4)" stroke-width="1.5"/>
    <path d="M2 2 H${w-2} V${h-14} L${w/2} ${h} L2 ${h-14} Z" fill="var(--paper)" stroke="var(--paperEdge)" stroke-width="1"/>
    <path d="M6 6 H${w-6} V${h-16} L${w/2} ${h-5} L6 ${h-16} Z" fill="none" stroke="var(--paperLine)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M${w-14} 2 L${w-2} 14 L${w-14} 14 Z" fill="var(--paperLine)"/>
    ${o.nostitch?'':`<path class="newstitch" d="M${10+(Math.min(st,8)-1)*((w-20)/7)} ${h-30} l4 -4" stroke="#D2F000" stroke-width="2.6" stroke-linecap="round" pathLength="1" style="display:none"/>`}
    ${stitches}
  </svg>`;
}

/* ---------- the den scene ---------- */
/* o: h, deskY, lamp ('on','dim','narrow'), chars [{m, x, w, pose, away, lit, tag, here, stamp, cls}], wall {pennant, shelf, window, slips}, seats [x...] */
function den(o){
  const h=o.h||300, dy=o.deskY||h-74, lamp=o.lamp||'on';
  const cone = lamp==='dim' ? '' : `<div class="cone" style="height:${dy+6}px;${lamp==='narrow'?'transform:scaleX(.7)':''}"><i></i></div><div class="pool" style="top:${dy-30}px"></div>`;
  const shadeFill = lamp==='dim' ? 'var(--deskEdge)' : 'var(--shade)';
  const lampSVG = `<div class="lamp" style="height:${Math.min(70,dy-120)}px"><svg width="76" height="${Math.min(70,dy-120)}" viewBox="0 0 76 ${Math.min(70,dy-120)}" overflow="visible">
     <line x1="38" y1="0" x2="38" y2="${Math.min(70,dy-120)-22}" stroke="var(--ink4)" stroke-width="1.5"/>
     <path d="M24 ${Math.min(70,dy-120)-22} h28 l10 18 h-48z" fill="${shadeFill}" />
     <path d="M14 ${Math.min(70,dy-120)-4} h48" stroke="${lamp==='dim'?'var(--ink4)':'var(--shadeIn)'}" stroke-width="2"/>
     ${lamp==='dim'?'':`<ellipse cx="38" cy="${Math.min(70,dy-120)-2}" rx="9" ry="3.5" fill="#FFF3D6"/>`}
   </svg></div>`;
  const wall = o.wall||{};
  let deco='';
  if(wall.window) deco+=`<svg class="win" style="position:absolute;left:22px;top:22px" width="66" height="58" viewBox="0 0 66 58"><rect x="1" y="1" width="64" height="56" rx="8" fill="var(--sky)" stroke="var(--deskEdge)" stroke-width="2"/><path d="M33 1v56M1 29h64" stroke="var(--deskEdge)" stroke-width="2"/><path d="M49 12a7 7 0 1 0 6 10 5.5 5.5 0 0 1-6-10z" fill="var(--moon)"/></svg>`;
  if(wall.pennant) deco+=`<div class="pennant" style="left:${wall.window?100:22}px;top:14px" data-pennant>${pennantSVG(wall.pennant)}<div style="position:absolute;left:0;right:0;top:12px;text-align:center;color:#1E1B15"><div class="fig pn-num" style="font-size:30px;line-height:30px;height:30px;overflow:hidden">${wall.pennant}</div><div style="font:700 11px/13px 'Hanken'">weeks</div></div></div>`;
  if(wall.shelf) deco+=`<div class="shelf" style="right:18px;top:54px;width:104px"><div style="display:flex;gap:6px;align-items:flex-end;padding:0 8px;height:34px"><img src="assets/art/token-held.webp" width="30" alt=""><img src="assets/art/foil-seal.webp" width="30" alt=""><span style="width:28px;height:28px;border:1.5px dashed var(--lineStrong);border-radius:50%"></span></div><div style="height:5px;border-radius:2px;background:var(--deskEdge);box-shadow:0 4px 6px -3px rgba(0,0,0,.4)"></div></div>`;
  (wall.slips||[]).forEach(s=>{ deco+=`<div style="position:absolute;left:${s.x}px;top:${s.y}px;transform:rotate(${s.r||-3}deg);background:var(--paper);color:#1E1B15;border-radius:6px;padding:6px 9px 7px;font:600 12px/15px 'Hanken';box-shadow:0 6px 12px -8px rgba(0,0,0,.6);z-index:2;white-space:nowrap"><span style="position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:${s.pin||'var(--m-rose)'};box-shadow:0 1px 2px rgba(0,0,0,.4)"></span>${s.t}</div>`; });
  let seats=''; (o.seats||[]).forEach(x=>{ seats+=`<div class="seatgh" style="left:${x-25}px;top:${dy-72}px;width:50px;height:72px">${ico('plus',20,2)}</div>`; });
  let chars='', tags='';
  (o.chars||[]).forEach((c,i)=>{
    const w=c.w||76, hh=c.h||(w*1.32);
    chars+=`<div class="shadow ${c.cls||''}-sh" data-sh="${c.m}" style="left:${c.x-w*.32}px;top:${dy-3}px;width:${w*.64}px"></div>`;
    chars+=`<div class="ch ${c.away?'away':''} ${c.lit===false?'':'lit'} ${c.cls||''}" data-ch="${c.m}" style="left:${c.x-w/2}px;top:${dy+3-hh}px;width:${w}px;height:${hh}px"><div class="br">${charImg(pose(c.m,c.pose))}</div></div>`;
    if(c.tag!==false){
      tags+=`<div class="ntag" data-tag="${c.m}" style="left:${c.x}px;top:${dy+12}px"><span class="nm">${c.label||M[c.m].name}</span>${c.here?`<span class="here" data-here="${c.m}"><i></i>${c.here===true?'Here':c.here}</span>`:''}${c.stamp?`<span class="stampt" data-stamp="${c.m}">${ico('check',13,3)}${c.stamp}</span>`:''}${c.sub?`<span class="t-cap ink3" style="text-align:center;line-height:16px">${c.sub}</span>`:''}</div>`;
    }
  });
  return `<div class="den" style="height:${h}px" data-den>
    <div class="grid"></div>${cone}${deco}${lampSVG}
    <div class="deskt" style="top:${dy}px"></div><div class="deskf" style="top:${dy+12}px"></div>
    ${seats}${chars}${tags}${o.extra||''}
  </div>`;
}

/* ---------- screens ---------- */
const S = {};
const DEN_HEADER = (sub='Accountancy, 4 of you') => `<div class="topbar" style="padding-left:16px">
  ${head('you',40,{ring:false})}
  <div class="grow"><div style="display:flex;align-items:center;gap:2px"><span class="t-title">Chai Circle</span>${ico('down',20,2,'style="color:var(--ink3)"')}</div><div class="st">${sub}</div></div>
  <button class="pill" style="height:40px;padding:0 14px 0 6px;background:var(--raised);border:1px solid var(--line);color:var(--ink)"><img src="assets/art/mobi-greet.webp" alt="" style="width:30px;height:30px;object-fit:cover;object-position:50% 18%;border-radius:50%">Ask Mobi</button>
</div>`;

/* 01 The den, live: friends are in a room */
S['den-live'] = () => `${statusBar('8:03 PM')}${DEN_HEADER()}
  ${den({h:312, deskY:230, lamp:'on', wall:{pennant:4, shelf:true}, chars:[
    {m:'zoya', x:48, away:true, lit:false},
    {m:'riya', x:136, pose:'wave', here:'Host'},
    {m:'kabir', x:224, here:true},
    {m:'you', x:310, here:true, label:'You'}]})}
  <div class="pad" style="margin-top:-6px;position:relative;z-index:6" data-rise>
    <div class="ticket" style="--notch:82px;padding:14px 16px 14px">
      <div style="display:flex;gap:12px;align-items:center">
        <img src="assets/art/hybrid-stopwatch.webp" alt="" width="44" style="flex:none;margin:-4px 0">
        <div style="flex:1"><div class="t-sub" style="display:flex;align-items:center;gap:8px"><span class="here livedot" style="height:22px;padding:0 7px 0 5px;border:0"><i></i>Live</span>Riya's sprint</div><div class="t-cap ink3" style="margin-top:2px">Opened 8:02 PM. 5 questions, about 4 minutes.</div></div>
      </div>
      <div class="perf" style="top:82px"></div>
      <div style="height:22px"></div>
      <button class="key" data-go="ready">Join the room</button>
      <div class="t-cap ink3" style="text-align:center;margin-top:10px">Anyone who misses it can play until 8:02 PM tomorrow.</div>
    </div>
  </div>
  <button class="pad" data-go="week" style="display:flex;align-items:center;gap:12px;margin-top:14px;text-align:left;width:100%">
    <span class="t-label" style="flex:none">This week</span>
    <span class="qbar" style="flex:1;height:10px"><i style="width:50%"></i><i style="width:16.6%"></i><i style="width:1.7%"></i></span>
    <span class="fig" style="font-size:18px;flex:none">41<span class="t-cap ink3" style="font-family:Hanken"> of 60</span></span>
    ${ico('right',18,2,'style="color:var(--ink3)"')}
  </button>
  ${bottomBar()}`;

/* 02 The den, quiet: nobody else is in */
S['den-quiet'] = () => `${statusBar('6:15 PM')}${DEN_HEADER()}
  ${den({h:312, deskY:230, lamp:'dim', wall:{pennant:4, shelf:true, window:true}, chars:[
    {m:'zoya', x:48, away:true, lit:false},
    {m:'riya', x:136, away:true, lit:false, sub:'Played<br>4:10 PM'},
    {m:'kabir', x:224, away:true, lit:false, sub:'Played<br>4:55 PM'},
    {m:'you', x:310, here:true, label:'You', lit:false}]})}
  <div class="pad" style="margin-top:-6px;position:relative;z-index:6">
    <div class="ticket" style="--notch:118px;padding:16px">
      <div class="t-sub">You're the first one here</div>
      <div class="t-small ink2 wrapline" style="margin-top:4px">Riya's sprint is open until 4:10 PM tomorrow. Race Riya's and Kabir's runs now, at the pace they really played.</div>
      <div class="perf" style="top:118px"></div>
      <div style="height:24px"></div>
      <button class="key" data-go="ghost">${ico('ghost',20,2)}Race their runs</button>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
        <button class="tbtn" style="width:auto">${ico('sticker',18,2)}Ask for a live game</button>
        <span class="t-cap ink3">Mob Time: Sun 8:00 PM</span>
      </div>
    </div>

/* =====================================================================

   ===================================================================== */
const EASE = {
  glide:'cubic-bezier(.15,.5,.5,1)', out:'cubic-bezier(.23,1,.32,1)', emphasized:'cubic-bezier(.16,1,.3,1)',

/* spring (duration, bounce) as CSS linear(), the same model as the app's Springs */
function spring(dur, bounce){

const MOMENT_LIST = [['enter','1. Enter the den'],['golive','2. Go live'],['countdown','3. Countdown'],['lockin','4. Answer lock-in'],['rightwrong','5. Right and wrong'],['friendfinish','6. A friend finishes'],['podium','7. Podium reveal'],['streak','8. Streak extends'],['reveal','9. Character reveal'],['quest','10. Quest complete']];

/* ---------- run, seek, skip ---------- */
function stopMoment(){ cancelAnimationFrame(RAF); if(CUR){ CUR.anims.forEach(a=>{ try{a.cancel()}catch(e){} }); } CUR=null; }
function prepareMoment(name){
  const m=MOMENTS[name]; render(m.screen, true);
  CUR={name, anims:[], tickers:[], cues:[], dur:m.dur};
  m.run();
  return CUR;
}
function playMoment(name){
  stopMoment(); prepareMoment(name);
  const t0=performance.now(); const shown=new Set();
  const loop=()=>{ if(!CUR) return; const ms=performance.now()-t0; CUR.tickers.forEach(f=>f(ms));
    if(CUES) CUR.cues.forEach(([t,txt],i)=>{ if(ms>=t && !shown.has(i)){ shown.add(i); showCue(txt);} });
    if(ms < CUR.dur+400) RAF=requestAnimationFrame(loop); };
  RAF=requestAnimationFrame(loop);
}
function seekMoment(t){ if(!CUR) return; CUR.anims.forEach(a=>{ a.pause(); a.currentTime=t; }); CUR.tickers.forEach(f=>f(t)); }
function skipMoment(){ if(!CUR) return; CUR.anims.forEach(a=>{ const ct=a.effect.getComputedTiming(); if(ct.iterations===Infinity) return; const end=ct.endTime, now=a.currentTime||0; const left=Math.max(1,end-now); a.updatePlaybackRate(left/200); }); }
function showCue(txt){ const c=$('#cues'); const d=document.createElement('div'); d.className='cue'; d.textContent=txt; c.appendChild(d); setTimeout(()=>d.remove(),1400); }
window.prepareMoment=prepareMoment; window.seekMoment=seekMoment; window.playMoment=playMoment;

/* ---------- render ---------- */
let current='den-live';
function render(id, quiet){
  current=id; if(!quiet) stopMoment();
  const host=$('#phone');
  host.className=`phone ${theme}`;
  host.innerHTML=`<div class="scr">${S[id]()}</div>`;
  $$('#nav .lnk').forEach(b=>b.classList.toggle('on', b.dataset.s===id));
  host.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); const to=b.dataset.go; if(to==='den-live') { playMoment('enter'); } else render(to); }));
  host.querySelectorAll('[data-moment]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); const m=b.dataset.moment; playMoment(m); if(m==='countdown') setTimeout(()=>{ if(CUR&&CUR.name==='countdown'){} },0); }));
  host.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{ host.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); b.classList.add('sel'); }));
  const sk=host.querySelector('[data-skip]'); if(sk) sk.addEventListener('click',e=>{ e.stopPropagation(); skipMoment(); });
}
function boot(){
  const app=$('#app');
  if(SHOT){ app.innerHTML=`<div id="phone" class="phone ${theme}"></div>`; }
  else {
    app.innerHTML=`<div class="proto"><aside class="nav" id="nav">
      <h1>The Mob: Den Live</h1><p>Clickable motion prototype, 360 x 780 dp. Every name, mark and time is an illustrative fixture.</p>
      <div class="row"><button class="tg ${theme==='night'?'on':''}" data-theme="night">Night</button><button class="tg ${theme==='day'?'on':''}" data-theme="day">Day</button><button class="tg ${RM?'on':''}" data-rm>Reduced motion</button></div>
      <h2>Signature moments</h2>${MOMENT_LIST.map(([k,l])=>`<button class="lnk" data-m="${k}">${l}</button>`).join('')}
      <h2>Screens</h2>${SCREENS.map(([k,l])=>`<button class="lnk" data-s="${k}">${l}</button>`).join('')}
    </aside><div class="phonewrap"><div id="phone" class="phone ${theme}"></div><div class="cap">Tap anywhere during a show moment to skip it to its end in 200 ms. Haptic and sound cues appear bottom right.</div></div></div>`;
    $$('#nav [data-s]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.s)));
    $$('#nav [data-m]').forEach(b=>b.addEventListener('click',()=>playMoment(b.dataset.m)));
    $$('#nav [data-theme]').forEach(b=>b.addEventListener('click',()=>{ const u=new URL(location); u.searchParams.set('theme',b.dataset.theme); location=u; }));
    $('#nav [data-rm]').addEventListener('click',()=>{ const u=new URL(location); u.searchParams.set('rm',RM?'0':'1'); location=u; });
    $('#phone').addEventListener('pointerdown',()=>{ if(CUR) skipMoment(); });
  }
  const m=Q.get('moment'), s=Q.get('screen')||'den-live';
  if(m){ if(Q.get('seek')==='1'){ prepareMoment(m); seekMoment(0); } else setTimeout(()=>playMoment(m), +(Q.get('wait')||300)); }
  else render(s);
}
boot();
