.rb-key i[data-k='pace'] { width: 14px; height: 0; border-top: 1px dashed var(--ink3); border-radius: 0; vertical-align: 3px; }
.rb-toggle { min-height: 44px; font: 600 14px/1 'Hanken'; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--lineStrong); }
.rb-detail { margin-top: 4px; font: 500 13.5px/1.5 'Hanken'; color: var(--ink2); }
.map { margin-top: 12px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.map span { aspect-ratio: 1; border-radius: 999px; display: grid; place-items: center; font: 700 12px/1 'Hanken'; box-shadow: inset 0 0 0 1.5px var(--lineStrong); color: var(--ink3); }
.map span[data-v='right'] { box-shadow: inset 0 0 0 1.5px var(--good); color: var(--good); }
.map span[data-v='wrong'] { background: var(--badWash); box-shadow: inset 0 0 0 1.5px var(--badBorder); color: var(--bad); }
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>5G 82%</span></div>
  <div class="scroll" data-scroller id="scroller"></div>
</div>
<script src="data.js"></script>
<script src="replay.js"></script>
<script>
(function () {
  const P = new URLSearchParams(location.search);
  const S = P.get('s') || 'review';
  if (P.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
  const { papers, chapters, mistakes, review, result, short, fmt } = window.MM;
  const root = document.getElementById('scroller');
  const phone = document.querySelector('.phone');
  const chev = (d = 'M9 6l6 6-6 6') => `<svg class="chev" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  const obj = (o) => `assets/app-obj-${o}.webp`;
  const picks = (m) => m.pick ? `<span class="picks"><span class="y"><i>${m.pick}</i>yours</span><span class="k"><i>${m.key}</i>answer</span></span>` : '';
  const when = (m) => `${papers[m.paper].name}, ${papers[m.paper].at}`;

  function reviewPage() {
    const c = chapters[0];
    const savedRow = (m) => {
      const ch = chapters.find((x) => x.id === m.ch);
      const st = m.state === 'slipped' ? `Slipped on a new question ${m.checked}` : m.state === 'pending' ? `Repaired ${m.repaired}. Not checked yet` : `Held on a new question`;
      return `<div class="q"><span class="qb" data-k="${m.state}">${m.n}</span><b>${ch.name}</b><span class="w">${when(m)}</span><span class="st" data-k="${m.state}">${st}</span><span class="pill">${m.state === 'pending' ? 'Check it held' : 'See repair'}</span></div>`;
    };
    root.innerHTML = `
      <div class="bar-top"><span class="av">P</span><h1>Review</h1></div>
      <div class="page">
        <p class="lede">Your 3 papers lost <b>${review.totalLost} marks</b>: ${review.wrong} wrong, ${review.blank} left blank. ${review.repaired.length} repaired.</p>
        <section class="hero" aria-label="Your costliest chapter">
          <img class="art" src="${obj(c.obj)}" alt="">
          <p class="lead">You lose the most marks in</p>
          <h2>${c.name}</h2>
          <div class="big"><b>${c.lost}</b><span>of ${c.offer}<br>marks lost</span></div>
          <p class="src"><b>${c.q} questions</b> in ${c.paperNames.join(' and ')}: ${c.w} wrong, ${c.b} left blank.</p>
          <div class="track"><i style="width:${Math.round((c.lost / c.offer) * 100)}%"></i></div>
          <a class="volt" href="#">Practise 10 on this chapter</a>
          <p class="cost">10 new questions, about 10 minutes. 10 of your ${review.credits} credits.</p>
        </section>
        <div class="mk-head">${c.open.length} mistakes to repair<span>Newest first</span></div>
        ${c.open.map((m, i) => `<div class="q ${i === c.open.length - 1 ? 'end' : ''}"><span class="qb">${m.n}</span><b>${m.stem}</b><span class="w">${when(m)}</span>${picks(m)}<span class="pill">Repair</span></div>`).join('')}
        <div class="after">
          <p><b>1 left blank:</b> Q47, Mock 3. <u>Try it again, free</u></p>
          <p><b>1 repaired:</b> Q17 from Mock 2 slipped on a new question tonight. It is in Saved repairs.</p>
          <p class="fine">Each repair is 1 AI credit; you have ${review.aiCredits}. Seeing the answer and trying again are free.</p>
          <a class="lnk" href="#">Learn the idea first: Goodwill and the new partner, 7 min</a>
        </div>
        <section class="sec" aria-labelledby="mc">
          <div class="sec-head"><h2 id="mc">More chapters</h2><p>Most marks first</p></div>
          ${chapters.slice(1, 5).map((x) => `<div class="ch"><img src="${obj(x.obj)}" alt=""><b>${x.name}</b><span class="lost">−${x.lost}</span><span class="meta">${x.lost} of ${x.offer} marks lost. ${x.open.length} to repair, ${x.repaired.length} repaired.</span><span class="tr"><span class="track"><i style="width:${Math.round((x.lost / x.offer) * 100)}%"></i></span>${chev('M6 9l6 6 6-6')}</span></div>`).join('')}
          <button class="seeall">See all ${chapters.length} chapters${chev('M6 9l6 6 6-6')}</button>
        </section>
        <a class="row revise" href="#"><b>Revise <span>${review.revise.due} due today</span></b><span>${review.revise.back} questions back, ${review.revise.checks} Check it held, ${review.revise.cards} concept cards. About ${review.revise.minutes} min, free.</span>${chev()}</a>
        <section class="sec saved" data-sec="saved" aria-labelledby="sv">
          <div class="sec-head"><h2 id="sv">Saved repairs</h2><p>${review.repaired.length}, open free</p></div>
          <p class="sub">${review.held} held, ${review.slipped} slipped, ${review.pending} waiting for Check it held.</p>
          ${review.repaired.slice(0, 4).map(savedRow).join('')}
          <button class="seeall">Show all ${review.repaired.length}${chev('M6 9l6 6 6-6')}</button>
        </section>
        <section class="sec" aria-labelledby="pp">
          <div class="sec-head"><h2 id="pp">Your papers</h2><p>Newest first</p></div>
          ${[papers.m3, papers.bq, papers.m2].map((p) => `<div class="pp"><img src="${obj(p.subject === 'Accountancy' ? 'accountancy' : 'business')}" alt=""><b>${p.name}, ${p.subject}</b><span>${p.at}</span><span class="sc">${p.score}<small>of ${p.max}</small></span></div>`).join('')}
        </section>
      </div>`;
    phone.insertAdjacentHTML('beforeend', `<nav class="tabbar"><div class="capsule">
      <span><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Today</span>
      <span><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 13V9M10 3h4"/></svg>Practice</span>
      <span class="on"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Review</span>
      <span><svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-5h6v5"/></svg>Colleges</span>
      <span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>You</span>
    </div><a class="startk" href="#"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>Start</a></nav>`);
  }

  function resultPage() {
    const R = result, m3 = R.paper;
    const openId = P.get('part') || ({ replay: 'time', replay10: 'time', mistakes: 'mistakes' }[S]) || 'marks';
    const parts = [
      { id: 'marks', name: 'Where your marks went', line: `${R.missed} marks missed. Under-20-second answers cost 18.`, count: R.missed },
      { id: 'mistakes', name: 'Your mistakes', line: `${m3.wrong} wrong, ${m3.blank} blank. Q29 waits for Check it held.`, count: m3.wrong + m3.blank },
      { id: 'time', name: 'Time and changes', line: `${m3.took} of ${m3.limitMin} min. 5 changes, net 0 marks.`, count: '46:36' },
      { id: 'rule', name: 'Did your rule hold', line: 'Yes. All 50 opened before going back.', count: '' },
      { id: 'after', name: 'After this mock', line: 'Strengths, weak spots and scores by session.', count: '' },
      { id: 'answers', name: 'Answer by answer', line: `${m3.right} right, ${m3.wrong} wrong, ${m3.blank} blank.`, count: m3.total },
    ];
    const lc = { changed: 'g-changed', quick: 'g-quick', long: 'g-long', other: 'g-other', blank: 'g-blank' };
    const body = (id) => {
      if (id === 'marks') return `<p class="intro"><b>3</b> wrong answers took under 20 seconds each. They cost <b>18</b> of the <b>${R.missed}</b> marks you missed.</p>
        <div class="lgbar">${R.ledger.map((g) => `<i class="${lc[g.id]}" style="flex:${g.marks}"></i>`).join('')}</div>
        ${R.ledger.map((g) => `<div class="lg"><i class="${lc[g.id]}"></i><div><b>${g.label}</b><span>${g.marks} marks on ${g.qs.length}: ${g.qs.map((n) => `Q${n}`).join(', ')}</span></div>${chev('M6 9l6 6 6-6')}</div>`).join('')}`;
      if (id === 'mistakes') {
        const order = [42, 38, 9, 26, 45, 31, 22, 14, 3, 19, 49, 29];
        const rows = mistakes.filter((m) => m.paper === 'm3' && m.state !== 'blank').sort((a, b) => order.indexOf(a.n) - order.indexOf(b.n));
        const show = [...rows.slice(0, 5), rows.find((m) => m.n === 29)];
        return `<p class="intro">In repair order. One action per mistake, the same words as Review.</p>
          ${show.map((m, i) => { const ch = chapters.find((c) => c.id === m.ch); return `<div class="q ${i === show.length - 1 ? 'end' : ''}"><span class="qb" data-k="${m.state === 'pending' ? 'pending' : ''}">${m.n}</span><b>${ch.name}</b><span class="w">${m.state === 'pending' ? `Repaired ${m.repaired}` : m.stem}</span>${picks(m)}<span class="pill">${m.state === 'pending' ? 'Check it held' : 'Repair'}</span></div>`; }).join('')}
          <button class="seeall">Show the other 6 mistakes${chev('M6 9l6 6 6-6')}</button>
          <button class="seeall">4 left blank: Q28, Q36, Q47, Q50${chev('M6 9l6 6 6-6')}</button>
          <dl class="labels"><dt>Repair</dt><dd>no repair yet</dd><dt>Check it held</dt><dd>repaired, not checked</dd><dt>See repair</dt><dd>checked, opens free</dd><dt>Try it again</dt><dd>a blank, free</dd></dl>`;
      }
      if (id === 'time') {
        const isShort = S === 'replay10';
        return `<p class="intro">${isShort ? `Business Studies quick practice: <b>${short.took}</b> on 10 questions.` : `<b>${m3.took}</b> on 50 questions. Even pace <b>${fmt(R.pace)}</b>.`} One bar per question: colour is the result, height the time.</p><div data-replay></div>`;
      }
      if (id === 'answers') return `<div class="map">${R.questions.map((q) => `<span data-v="${q.verdict}">${q.n}</span>`).join('')}</div>`;
      return '';
    };
    root.innerHTML = `
      <div class="bar-top"><a class="back" href="#"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a><span class="t2"><b>Mock 3</b><span>Accountancy</span></span></div>
      <div class="page">
        <p class="rec">Accountancy full mock. Recorded 9:40 PM.</p>
        <div class="score"><b>${m3.score}</b><span>of ${m3.max} marks</span><img src="${obj('accountancy')}" alt=""></div>
        <div class="mbar"><i style="flex:${m3.right};background:var(--ink)"></i><i style="flex:${m3.wrong};background:var(--wrong-fill)"></i><i style="flex:${m3.blank};background:repeating-linear-gradient(135deg,var(--lineStrong) 0 3px,transparent 3px 6px)"></i></div>
        <div class="mlegend"><span><i style="background:var(--ink)"></i>${m3.right} right</span><span><i style="background:var(--wrong-fill)"></i>${m3.wrong} wrong</span><span><i style="box-shadow:inset 0 0 0 1px var(--lineStrong)"></i>${m3.blank} blank</span></div>
        <div class="find"><img src="assets/attentive.webp" alt="Mobi, attentive"><div><b>${R.finding.chapter} cost ${R.finding.lost} of the ${R.missed} marks you missed.</b><span>${R.finding.w} wrong and ${R.finding.b} left blank, of ${R.finding.of} questions.</span></div></div>
        <div class="whycard"><b>Why Q42 first</b><p>${R.finding.chapter}. You picked D.</p><p class="v">A repair gives you why D looked right, the trap, and one rule to keep.</p><a class="lnk" href="#">Practise 10 on ${R.finding.chapter} instead</a></div>
        <a class="recap" href="#">Continue recap, card 3 of 4</a>
        <section id="depth">
          <h2 class="dp-title">Your full analysis</h2>
          <p class="dp-lede">Six parts, each with what it found. One opens at a time.</p>
          <ol class="dp-index">${parts.map((p) => `<li><button class="dp-head" ${p.id === openId ? 'data-open' : ''} data-part="${p.id}"><b>${p.name}</b><span>${p.line}</span><em>${p.count}</em>${chev('M6 9l6 6 6-6')}</button></li>`).join('')}</ol>
        </section>
        <section class="dp-detail" id="part">
          <div class="dp-dhead"><h3>${parts.find((p) => p.id === openId).name}</h3><a href="#depth">All parts</a></div>
          ${body(openId)}
          ${(() => { const i = parts.findIndex((x) => x.id === openId); const nx = parts[i + 1]; return nx ? `<button class="next">Next: ${nx.name}${chev()}</button>` : ''; })()}
        </section>
      </div>`;
    phone.insertAdjacentHTML('beforeend', `<div class="foot"><a class="volt" href="#">Repair Q42</a><p class="fine">1 AI credit. No charge if the repair cannot be written.</p></div>`);
    const host = root.querySelector('[data-replay]');
    if (host) {
      const paper = S === 'replay10' ? short : R;
      window.MMReplay.mount(host, paper, { expanded: true, clockAt: S === 'replay10' ? null : window.MMReplay.changeTimes(R)[22].to_at, selected: S === 'replay10' ? 6 : 22 });
    }
    root.querySelectorAll('.dp-head').forEach((b) => b.addEventListener('click', () => { const u = new URL(location.href); u.searchParams.set('part', b.dataset.part); location.href = u.href; }));
  }

  if (S === "review") reviewPage(); else resultPage();
})();
</script>
</body>
</html>
